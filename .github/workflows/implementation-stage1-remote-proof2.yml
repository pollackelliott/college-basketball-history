          python - "$out/execution-summary.json" <<'PY'
          import json
          import os
          import sys

          output = sys.argv[1]
          original_base = "396ac80855a4d04c3b9a3f98f8c9a2516e9a1e97"
          expected_stage1 = "495d2e0945b9481805f0e0b7bd43ee8eeb2113d965989574b6995964873479a3"

          summary = {
              "proof": "REMOTE IMPLEMENTATION PROOF 2 - DURABLE CHECKPOINT / EXACT REPLAY",
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "proof2_experiment_branch": "experiment/remote-implementation-proof2",
              "durable_checkpoint_commit_sha": os.environ.get("CHECKPOINT_COMMIT"),
              "checkpoint_manifest_sha256": os.environ.get("MANIFEST_SHA"),
              "stage1_reconciliation_sha256": os.environ.get("STAGE1_SHA"),
              "replayed_stage1_sha256": os.environ.get("REPLAY_SHA"),
              "original_replay_base_sha": original_base,
              "current_protected_main_sha": os.environ.get("CURRENT_MAIN_SHA"),
              "checkpoint_base_classification": os.environ.get("BASE_CLASSIFICATION"),
              "byte_exact_stage1_replay": (
                  os.environ.get("REPLAY_SHA") == expected_stage1
              ),
              "tamper_rejection": True,
              "tracked_repository_mutation": (
                  os.environ.get("TRACKED_CLEAN") != "true"
              ),
              "real_liu_onboarding_branch_pushed": False,
              "integration_frozen": False,
              "phase0_started": False,
          }

          with open(output, "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2, sort_keys=True)
              f.write("\n")

          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

          {
            echo "tracked_clean=${TRACKED_CLEAN:-false}"
            echo "remote_liu_onboarding_branch=absent"
            echo "protected_main_mutated=false"
            echo "shared_global_mutation=false"
            echo "phase0_started=false"
          } > "$out/tracked-mutation-check.txt"

          {
            echo '### Remote Implementation Proof 2'
            echo
            echo '\`\`\`json'
            cat "$out/execution-summary.json"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Proof 2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
