name: Remote Implementation Proof 5 - Mutation Atomicity

on:
  push:
    branches:
      - experiment/remote-implementation-proof5

permissions:
  contents: write
  actions: read

concurrency:
  group: remote-implementation-proof5-global-control
  cancel-in-progress: false

jobs:
  mutation-transaction:
    if: ${{ !startsWith(github.event.head_commit.message, '[proof5-internal]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Proof 5 request event
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Execute Proof 5 generic transaction orchestrator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .remote-implementation-poc/control5/orchestrator.py

      - name: Upload Proof 5 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-implementation-proof5-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/proof5-diagnostics
          if-no-files-found: ignore
          retention-days: 14
