name: Temporary LIU scope maintenance validation

on:
  push:
    branches:
      - maintenance/liu-top-level-scope

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact scope reference correction
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("data/reference/program-top-level-scope.csv")
          rows=list(csv.DictReader(p.open(encoding="utf-8-sig", newline="")))
          assert len(rows)==365, len(rows)
          names=[r["program_name"] for r in rows]
          assert len(names)==len(set(names))
          liu=[r for r in rows if r["program_name"]=="Long Island University"]
          assert len(liu)==1, liu
          assert liu[0]["top_level_scope"]=="1928-29..1950-51|1968-69+", liu[0]
          print("LIU_SCOPE_REFERENCE: PASS")
          PY
      - name: Run relevant scope tests
        run: python -m unittest tests.test_program_history_scope -v
      - name: Validate repository
        run: python tools/validate_data.py
