name: Context badge fade polish
on:
  push:
    branches:
      - ui/more-noticeable-context-fade
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/more-noticeable-context-fade
          fetch-depth: 0
      - name: Make sticky badge fade deliberate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          t = p.read_text(encoding='utf-8')

          old_team = '.team-context-title{grid-area:title;justify-self:center;max-width:100%;min-width:0;transform:translateY(-4px);border-radius:7px;padding:6px 11px;background:var(--team-context-bg,#fff);color:var(--team-context-fg,var(--nav));font-family:Graduate,"Rockwell Extra Bold",Rockwell,"Arial Black",serif;font-size:20px;line-height:1.05;letter-spacing:.025em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 0 0 1px rgba(15,23,42,.18),0 2px 7px rgba(0,0,0,.2);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s}.team-context-title.visible{opacity:1;visibility:visible;transform:translateY(0);transition-delay:0s}'
          new_team = '.team-context-title{grid-area:title;justify-self:center;max-width:100%;min-width:0;transform:translateY(-6px);border-radius:7px;padding:6px 11px;background:var(--team-context-bg,#fff);color:var(--team-context-fg,var(--nav));font-family:Graduate,"Rockwell Extra Bold",Rockwell,"Arial Black",serif;font-size:20px;line-height:1.05;letter-spacing:.025em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 0 0 1px rgba(15,23,42,.18),0 2px 7px rgba(0,0,0,.2);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .36s cubic-bezier(.4,0,.2,1),transform .36s cubic-bezier(.4,0,.2,1),visibility 0s linear .36s}.team-context-title.visible{opacity:1;visibility:visible;transform:translateY(0);transition-delay:0s}'
          if t.count(old_team) != 1:
              raise SystemExit(f'team fade rule mismatch: {t.count(old_team)}')
          t = t.replace(old_team, new_team, 1)

          old_series = '.series-context-title{grid-area:title;justify-self:center;max-width:100%;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-4px);transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s}.series-context-title.visible{opacity:1;visibility:visible;transform:translateY(0);transition-delay:0s}'
          new_series = '.series-context-title{grid-area:title;justify-self:center;max-width:100%;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-6px);transition:opacity .36s cubic-bezier(.4,0,.2,1),transform .36s cubic-bezier(.4,0,.2,1),visibility 0s linear .36s}.series-context-title.visible{opacity:1;visibility:visible;transform:translateY(0);transition-delay:0s}'
          if t.count(old_series) != 1:
              raise SystemExit(f'series fade rule mismatch: {t.count(old_series)}')
          t = t.replace(old_series, new_series, 1)

          anchor = '@media(max-width:360px){body.nav-home .brand{font-size:14px}body.nav-home .navlinks button{font-size:11px;padding:7px 5px}body.nav-team .brand,body.nav-series .brand{width:66px}.series-context-badge{padding:4px 5px}}\n'
          reduced = '@media(prefers-reduced-motion:reduce){.team-context-title,.series-context-title{transition:none}}\n'
          if reduced not in t:
              if t.count(anchor) != 1:
                  raise SystemExit(f'reduced-motion anchor mismatch: {t.count(anchor)}')
              t = t.replace(anchor, anchor + reduced, 1)

          p.write_text(t, encoding='utf-8')
          print('PASS: context badges now use a 360ms fade/6px settle with reduced-motion fallback')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('site/index.html').read_text(encoding='utf-8')
          expected = 'transition:opacity .36s cubic-bezier(.4,0,.2,1),transform .36s cubic-bezier(.4,0,.2,1),visibility 0s linear .36s'
          assert t.count(expected) == 2
          assert t.count('translateY(-6px)') >= 2
          assert '@media(prefers-reduced-motion:reduce){.team-context-title,.series-context-title{transition:none}}' in t
          assert 'document.startViewTransition(update)' in t
          assert 'history.pushState(null, "", nextHash)' in t
          PY
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_data.py
          PYTHONDONTWRITEBYTECODE=1 python tools/build_site_data.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          git diff --check
      - name: Commit fade polish
        run: |
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add site/index.html
          git commit -m "Make sticky context fade more noticeable"
          git push origin HEAD:ui/more-noticeable-context-fade
