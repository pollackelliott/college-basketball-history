name: Reconciliation diagnostic branch validation

on:
  push:
    branches:
      - tooling/reconciliation-diagnostic-trace

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tooling branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check diagnostic tooling
        run: |
          python -m py_compile tools/reconciliation_trace.py
          python -m py_compile tools/onboarding_hardening.py

      - name: Run focused reconciliation diagnostic tests
        run: |
          python -m unittest discover -s tests -p 'test_reconciliation_diagnostic_trace.py' -v
          python -m unittest discover -s tests -p 'test_onboarding_reconciliation_location_final_state.py' -v
          python -m unittest discover -s tests -p 'test_reconciliation_site_metadata_resolution.py' -v
