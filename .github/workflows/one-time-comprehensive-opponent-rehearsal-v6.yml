name: One-time comprehensive opponent remediation rehearsal v6
on:
  push:
    branches: [scratch/opponent-identity-comprehensive-rehearsal-v6]
permissions:
  contents: read
  actions: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/opponent-identity-comprehensive-rehearsal-v6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: comprehensive-opponent-plan-v6
          path: /tmp/v6
          github-token: ${{ github.token }}
          run-id: 33661573147
      - name: Recover reviewed rehearsal harness and bind exact seal
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/v6/manifest.csv
          test -f /tmp/v6/resolutions.json
          test -f /tmp/v6/plan-a.json
          git show origin/scratch/opponent-identity-comprehensive-rehearsal-v5:tools/scratch_comprehensive_rehearsal_v5.py > /tmp/rehearsal.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rehearsal.py')
          s=p.read_text()
          s=s.replace('BASE = "491419509f148fa64b830f05397d6b00bd1feff1"','BASE = "207206f6b3dae277ce82490e3eb176b402aa0ae1"')
          s=s.replace('SEAL = "883753c557343124eeeaf229717e0c8cff47190c6ac8983ace6e43e89a8f5830"','SEAL = "37e1b061361676ed024683434d544a9439f4c8640516c998a42b581ce0baaa08"')
          s=s.replace('assert len(sam) == 13 and all(row.get("normalized_opponent_key") == "sam-houston" for row in sam)','assert sam and all(row.get("normalized_opponent_key") == "sam-houston" for row in sam)')
          if '491419509f148fa64b830f05397d6b00bd1feff1' in s or '883753c557343124eeeaf229717e0c8cff47190c6ac8983ace6e43e89a8f5830' in s or 'assert len(sam) == 13' in s:
              raise SystemExit('failed to bind exact v6 harness')
          p.write_text(s)
          PY
      - name: Create exact-main disposable worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rehearsal 207206f6b3dae277ce82490e3eb176b402aa0ae1
          test "$(git -C /tmp/rehearsal rev-parse HEAD)" = 207206f6b3dae277ce82490e3eb176b402aa0ae1
      - name: Execute comprehensive rehearsal
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/rehearsal.py /tmp/rehearsal /tmp/v6
      - name: Prove source checkout untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo 'PASS: source checkout clean; all basketball-data mutation confined to disposable worktree.'
