name: Temporary sealed apply validation

on:
  push:
    branches:
      - tooling/stage2-sealed-apply-remote

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tooling/stage2-sealed-apply-remote
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sealed apply runtime
        run: |
          python -m py_compile \
            tools/remote_implementation_control.py \
            tools/remote_implementation_runner.py \
            tools/remote_implementation_verify.py \
            tools/remote_implementation_stage2_apply.py
      - name: Run sealed apply regression
        run: python -m unittest -v tests.test_remote_implementation_stage2_apply
      - name: Run surrounding remote regressions
        run: |
          python -m unittest -v \
            tests.test_remote_implementation_control \
            tests.test_remote_implementation_stage2_proposal \
            tests.test_remote_implementation_stage2_gate1_fill \
            tests.test_remote_implementation_stage2_preseal \
            tests.test_remote_implementation_stage2_seal \
            tests.test_remote_implementation_stage2_diagnostic
      - name: Run core sealed-plan regression
        run: python -m unittest -v tests.test_onboarding_fast_path
