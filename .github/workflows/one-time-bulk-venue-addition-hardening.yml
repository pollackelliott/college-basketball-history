name: One-time bulk venue addition hardening

on:
  push:
    branches:
      - chore/opponent-identity-bulk-venue-additions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/opponent-identity-bulk-venue-additions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add sealed atomic venue registry additions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tool=Path('tools/opponent_identity_bulk_transaction.py')
          text=tool.read_text()

          needle='''def _mapped_unknown_groups(rows: list[dict[str, str]], key_map: dict[str, str], affected: set[str]) -> list[dict[str, Any]]:\n'''
          insert='''def load_venue_registry_additions(repo: Path, path: Path) -> tuple[list[dict[str, str]], list[str]]:\n    doc = json.loads(path.read_text(encoding="utf-8"))\n    raw_additions = doc.get("venue_registry_additions") or []\n    if not raw_additions:\n        return [], []\n    venue_path = repo / "data/reference/venues.csv"\n    if not venue_path.exists():\n        return [], ["venue registry additions requested but data/reference/venues.csv is missing"]\n    fields, existing = read_csv(venue_path)\n    blockers: list[str] = []\n    existing_ids = {clean(r.get("venue_id")) for r in existing}\n    existing_keys = {clean(r.get("venue_key")) for r in existing}\n    numeric = [int(v[4:]) for v in existing_ids if v.startswith("VEN-") and v[4:].isdigit()]\n    next_expected = max(numeric or [0]) + 1\n    additions: list[dict[str, str]] = []\n    seen_ids: set[str] = set()\n    seen_keys: set[str] = set()\n    required = {"venue_id", "venue_key", "display_name", "city", "state", "identity_status", "source_basis"}\n    for index, raw in enumerate(raw_additions):\n        unknown = sorted(set(raw) - set(fields))\n        if unknown:\n            blockers.append(f"venue addition {index + 1}: unknown fields {unknown}")\n        row = {field: clean(raw.get(field)) for field in fields}\n        missing = sorted(field for field in required if not row.get(field))\n        if missing:\n            blockers.append(f"venue addition {index + 1}: missing required fields {missing}")\n        vid = row.get("venue_id", "")\n        key = row.get("venue_key", "")\n        if vid in existing_ids or vid in seen_ids:\n            blockers.append(f"venue addition {index + 1}: duplicate venue_id {vid!r}")\n        if key in existing_keys or key in seen_keys:\n            blockers.append(f"venue addition {index + 1}: duplicate venue_key {key!r}")\n        seen_ids.add(vid); seen_keys.add(key); additions.append(row)\n    expected_ids = [f"VEN-{number:06d}" for number in range(next_expected, next_expected + len(additions))]\n    actual_ids = [row.get("venue_id", "") for row in additions]\n    if actual_ids != expected_ids:\n        blockers.append(f"venue additions must use the next sequential global IDs: expected {expected_ids}, got {actual_ids}")\n    return additions, sorted(set(blockers))\n\n\ndef _mapped_unknown_groups(rows: list[dict[str, str]], key_map: dict[str, str], affected: set[str]) -> list[dict[str, Any]]:\n'''
          assert needle in text
          text=text.replace(needle,insert,1)

          needle='''    items, key_map, blockers = load_manifest(repo, manifest_path.resolve())\n    pair_resolutions, distinct_resolutions = load_resolutions(resolutions_path.resolve())\n    _, canonical_rows = read_csv(repo / "data/canonical/games.csv")\n'''
          replacement='''    items, key_map, blockers = load_manifest(repo, manifest_path.resolve())\n    pair_resolutions, distinct_resolutions = load_resolutions(resolutions_path.resolve())\n    venue_additions, venue_blockers = load_venue_registry_additions(repo, resolutions_path.resolve())\n    blockers.extend(venue_blockers)\n    _, canonical_rows = read_csv(repo / "data/canonical/games.csv")\n'''
          assert needle in text
          text=text.replace(needle,replacement,1)

          needle='''    unused_pairs = [r["resolution_id"] for r in pair_resolutions if r["resolution_id"] not in used_pair_resolutions]\n'''
          insert='''    # Any physical venue introduced by a reviewed reconciliation is part of the\n    # same sealed transaction.  Validate final pair references against the exact\n    # current registry plus the proposed additions before apply.\n    venue_path = repo / "data/reference/venues.csv"\n    if venue_path.exists():\n        _, venue_rows = read_csv(venue_path)\n        venue_rows = venue_rows + venue_additions\n        venue_by_id = {clean(r.get("venue_id")): clean(r.get("venue_key")) for r in venue_rows if clean(r.get("venue_id"))}\n        venue_by_key = {clean(r.get("venue_key")): clean(r.get("venue_id")) for r in venue_rows if clean(r.get("venue_key"))}\n        for pair in pairs:\n            final = pair["final_canonical_values"]\n            vid, vkey = clean(final.get("venue_id")), clean(final.get("venue_key"))\n            if bool(vid) != bool(vkey):\n                blockers.append(f"{pair['survivor_canonical_game_id']}: final venue_id/key must be populated together")\n            elif vid and (venue_by_id.get(vid) != vkey or venue_by_key.get(vkey) != vid):\n                blockers.append(f"{pair['survivor_canonical_game_id']}: final venue reference {vid}/{vkey} is absent or mismatched in sealed registry state")\n\n    unused_pairs = [r["resolution_id"] for r in pair_resolutions if r["resolution_id"] not in used_pair_resolutions]\n'''
          assert needle in text
          text=text.replace(needle,insert,1)

          needle='''        "resolutions.json": sha_file(resolutions_path.resolve()),\n    }\n'''
          replacement='''        "resolutions.json": sha_file(resolutions_path.resolve()),\n    }\n    if venue_additions:\n        fingerprints["venues.csv"] = sha_file(repo / "data/reference/venues.csv")\n'''
          assert needle in text
          text=text.replace(needle,replacement,1)

          needle='''        "retain_distinct_resolutions": [r for r in distinct_resolutions if r["resolution_id"] in used_distinct],\n        "new_discrepancies": sorted(specs, key=lambda x: x["discrepancy_id"]),\n'''
          replacement='''        "retain_distinct_resolutions": [r for r in distinct_resolutions if r["resolution_id"] in used_distinct],\n        "venue_registry_additions": venue_additions,\n        "new_discrepancies": sorted(specs, key=lambda x: x["discrepancy_id"]),\n'''
          assert needle in text
          text=text.replace(needle,replacement,1)

          needle='''    paths = [\n        repo / "data/canonical/games.csv",\n        repo / "data/evidence/game-assertions.csv",\n        repo / "data/reconciliation/discrepancies.csv",\n    ]\n'''
          replacement='''    paths = [\n        repo / "data/canonical/games.csv",\n        repo / "data/evidence/game-assertions.csv",\n        repo / "data/reconciliation/discrepancies.csv",\n    ]\n    if plan["venue_registry_additions"]:\n        paths.append(repo / "data/reference/venues.csv")\n'''
          assert needle in text
          text=text.replace(needle,replacement,1)

          needle='''        cf, cr = read_csv(repo / "data/canonical/games.csv")\n        af, ar = read_csv(repo / "data/evidence/game-assertions.csv")\n'''
          insert='''        if plan["venue_registry_additions"]:\n            vp = repo / "data/reference/venues.csv"\n            vf, vr = read_csv(vp)\n            existing_ids = {clean(r.get("venue_id")) for r in vr}\n            existing_keys = {clean(r.get("venue_key")) for r in vr}\n            for addition in plan["venue_registry_additions"]:\n                if addition["venue_id"] in existing_ids or addition["venue_key"] in existing_keys:\n                    raise BulkTransactionError("venue registry changed after plan sealing")\n                vr.append(dict(addition))\n                existing_ids.add(addition["venue_id"]); existing_keys.add(addition["venue_key"])\n            tx.write_csv(vp, vf, vr)\n\n        cf, cr = read_csv(repo / "data/canonical/games.csv")\n        af, ar = read_csv(repo / "data/evidence/game-assertions.csv")\n'''
          assert needle in text
          text=text.replace(needle,insert,1)

          needle='''        retained = set(plan["retained_distinct_canonical_game_ids"])\n        if retained and not retained.issubset({clean(r.get("canonical_game_id")) for r in cr2}):\n'''
          insert='''        if plan["venue_registry_additions"]:\n            _, final_venues = read_csv(repo / "data/reference/venues.csv")\n            by_id = {clean(r.get("venue_id")): r for r in final_venues}\n            for addition in plan["venue_registry_additions"]:\n                row = by_id.get(addition["venue_id"])\n                if not row or any(clean(row.get(field)) != clean(addition.get(field)) for field in addition):\n                    raise BulkTransactionError(f"postcondition: venue addition {addition['venue_id']} missing or changed")\n\n        retained = set(plan["retained_distinct_canonical_game_ids"])\n        if retained and not retained.issubset({clean(r.get("canonical_game_id")) for r in cr2}):\n'''
          assert needle in text
          text=text.replace(needle,insert,1)

          needle='''        "discrepancies_added": len(plan["new_discrepancies"]),\n    }\n'''
          replacement='''        "discrepancies_added": len(plan["new_discrepancies"]),\n        "venue_registry_additions": len(plan["venue_registry_additions"]),\n    }\n'''
          assert needle in text
          text=text.replace(needle,replacement,1)
          tool.write_text(text)

          test=Path('tests/test_opponent_identity_bulk_transaction.py')
          text=test.read_text()
          needle="PROGRAM_HEADERS = ['program_key','program_name','display_name','current_d1','public_page_enabled']\n"
          replacement=needle+"VENUE_HEADERS = ['venue_id','venue_key','display_name','city','state','opened','closed','date_precision','identity_status','source_basis','notes']\n"
          assert needle in text
          text=text.replace(needle,replacement,1)

          needle='''    def _resolution(self,pairs=None,distinct=None):\n        self.resolutions.write_text(json.dumps({\n            'schema_version':2,'resolutions':pairs or [],'retain_distinct':distinct or []\n        }),encoding='utf-8')\n'''
          replacement='''    def _resolution(self,pairs=None,distinct=None,venues=None):\n        self.resolutions.write_text(json.dumps({\n            'schema_version':2,'resolutions':pairs or [],'retain_distinct':distinct or [],\n            'venue_registry_additions':venues or []\n        }),encoding='utf-8')\n'''
          assert needle in text
          text=text.replace(needle,replacement,1)

          needle='''    def test_grouped_package_scope_preserves_multiple_literal_labels(self):\n'''
          insert='''    def test_explicit_reconciliation_can_add_sealed_global_venue(self):\n        self._manifest()\n        self._write(self.repo/'data/reference/venues.csv',VENUE_HEADERS,[[\n            'VEN-000001','known-gym','Known Gym','Known City','ST','','','','TEST','fixture',''\n        ]])\n        stale=game('CBBG-9','old-target',site='TEAM_A_HOME',home='alpha',venue='known-gym',city='Alpha City')\n        counterpart=game('CBBG-2','target',site='NEUTRAL',home='',venue='',city='')\n        self._write(self.repo/'data/canonical/games.csv',CANONICAL_HEADERS,[stale,counterpart])\n        self._write(self.repo/'data/evidence/game-assertions.csv',ASSERTION_HEADERS,[\n            ['A1','CBBG-9','alpha','SRC-1','old-target'],['A2','CBBG-2','target','T-1','alpha']\n        ])\n        venue={\n            'venue_id':'VEN-000002','venue_key':'new-neutral-complex','display_name':'New Neutral Complex',\n            'city':'Neutral City','state':'PR','opened':'','closed':'','date_precision':'',\n            'identity_status':'RESEARCHED_TEST','source_basis':'official tournament evidence','notes':'fixture'\n        }\n        self._resolution(pairs=[{\n            'resolution_id':'PAIR-VENUE-1','kind':'EXPLICIT_RECONCILIATION',\n            'survivor_canonical_game_id':'CBBG-9','absorbed_canonical_game_id':'CBBG-2',\n            'canonical_values':{'site_type':'NEUTRAL','venue_key':'new-neutral-complex','venue_id':'VEN-000002','site_city':'Neutral City','site_state':'PR'},\n            'canonical_clear_fields':['designated_home_team_key'],\n            'resolution_basis':'reviewed official tournament evidence establishes neutral site and physical venue',\n            'evidence_urls':['https://example.test/venue'],'discrepancies':[]\n        }],venues=[venue])\n        plan=bulk.build_plan(self.repo,self.manifest,self.resolutions)\n        self.assertEqual(plan['blockers'],[])\n        self.assertEqual(plan['venue_registry_additions'],[venue])\n        result=bulk.apply(self.repo,self.manifest,self.resolutions,plan['plan_sha256'],run_validation=False)\n        self.assertEqual(result['venue_registry_additions'],1)\n        venues=self._read(self.repo/'data/reference/venues.csv')\n        self.assertEqual(venues[-1]['venue_id'],'VEN-000002')\n        row=self._read(self.repo/'data/canonical/games.csv')[0]\n        self.assertEqual(row['site_type'],'NEUTRAL')\n        self.assertEqual(row['designated_home_team_key'],'')\n        self.assertEqual(row['venue_key'],'new-neutral-complex')\n        self.assertEqual(row['venue_id'],'VEN-000002')\n\n    def test_grouped_package_scope_preserves_multiple_literal_labels(self):\n'''
          assert needle in text
          test.write_text(text.replace(needle,insert,1))

          doc=Path('docs/opponent-identity-bulk-remediation.md')
          text=doc.read_text()
          needle='''- `retain_distinct`: explicit groups of canonical IDs that must remain separate despite\n  an unknown-date mapped-signature collision, with substantive resolution basis.\n'''
          replacement=needle+'''- `venue_registry_additions` (optional): full rows for newly researched physical venues required by an explicit reconciliation. Additions are sealed with the plan, must use the next sequential global `VEN-` IDs, are checked for key/ID collisions, and are committed or rolled back atomically with the game reconciliation.\n'''
          assert needle in text
          doc.write_text(text.replace(needle,replacement,1))
          PY

          python -m py_compile tools/opponent_identity_bulk_transaction.py
          python -m unittest tests.test_opponent_identity_bulk_transaction -v
          python -m unittest tests.test_opponent_identity_transaction -v
          python -m unittest discover -s tests -v

          rm .github/workflows/one-time-bulk-venue-addition-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/opponent_identity_bulk_transaction.py tests/test_opponent_identity_bulk_transaction.py docs/opponent-identity-bulk-remediation.md .github/workflows/one-time-bulk-venue-addition-hardening.yml
          git commit -m "Seal opponent reconciliation venue additions"
          git push origin HEAD:chore/opponent-identity-bulk-venue-additions
