name: One-time comprehensive opponent remediation rehearsal v3
on:
  push:
    branches: [scratch/opponent-identity-comprehensive-rehearsal-v3]
permissions:
  contents: read
  actions: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 806caa7d5ed93e2949c675a1a1ddaad3e8ba8400
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: comprehensive-opponent-plan-v3
          path: /tmp/v3
          github-token: ${{ github.token }}
          run-id: 33656220190
      - name: Prepare exact disposable checkout and immutable-evidence fingerprints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 806caa7d5ed93e2949c675a1a1ddaad3e8ba8400
          rm -rf /tmp/rehearsal
          cp -a . /tmp/rehearsal
          cd /tmp/rehearsal
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          plan=json.load(open('/tmp/v3/plan-a.json'))
          assert plan['plan_sha256']=='2cfffd73b566aabd71834b427d7171bd3531bb7bb4f5ace1ab660641883301c3'
          assert plan['git_head']=='806caa7d5ed93e2949c675a1a1ddaad3e8ba8400' and not plan['blockers']
          def rows(p):
              with Path(p).open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def count(p): return len(rows(p))
          def projection_hash(paths, mutable):
              h=hashlib.sha256()
              for p in sorted(paths,key=str):
                  for r in rows(p):
                      payload=[(k,r.get(k,'')) for k in r.keys() if k not in mutable]
                      h.update((str(p)+'|'+json.dumps(payload,ensure_ascii=False,separators=(',',':'))+'\n').encode())
              return h.hexdigest()
          pre={
            'canonical':count('data/canonical/games.csv'),
            'assertions':count('data/evidence/game-assertions.csv'),
            'discrepancies':count('data/reconciliation/discrepancies.csv'),
            'venues':count('data/reference/venues.csv'),
            'source_immutable':projection_hash(Path('schools').glob('*/source-games.csv'),{'normalized_opponent_key','opponent_current_d1'}),
            'assertion_immutable':projection_hash([Path('data/evidence/game-assertions.csv')],{'canonical_game_id','normalized_opponent_key'}),
            'opponent_immutable':projection_hash(Path('schools').glob('*/opponents.csv'),{'canonical_opponent_key','canonical_opponent_name','current_d1'}),
          }
          Path('/tmp/pre.json').write_text(json.dumps(pre,indent=2,sort_keys=True)+'\n')
          print(json.dumps(pre,sort_keys=True))
          PY
      - name: Apply exact sealed transaction in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rehearsal
          python tools/opponent_identity_bulk_transaction.py apply /tmp/v3/manifest.csv /tmp/v3/resolutions.json --expected-plan-sha256 2cfffd73b566aabd71834b427d7171bd3531bb7bb4f5ace1ab660641883301c3 --apply | tee /tmp/apply.log
      - name: Prove transaction accounting and evidence preservation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rehearsal
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          pre=json.load(open('/tmp/pre.json')); plan=json.load(open('/tmp/v3/plan-a.json'))
          def rows(p):
              with Path(p).open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def projection_hash(paths, mutable):
              h=hashlib.sha256()
              for p in sorted(paths,key=str):
                  for r in rows(p):
                      payload=[(k,r.get(k,'')) for k in r.keys() if k not in mutable]
                      h.update((str(p)+'|'+json.dumps(payload,ensure_ascii=False,separators=(',',':'))+'\n').encode())
              return h.hexdigest()
          canonical=rows('data/canonical/games.csv'); assertions=rows('data/evidence/game-assertions.csv'); discs=rows('data/reconciliation/discrepancies.csv'); venues=rows('data/reference/venues.csv')
          assert len(canonical)==pre['canonical']-58
          assert len(assertions)==pre['assertions']
          assert len(discs)==pre['discrepancies']+5
          assert len(venues)==pre['venues']+1
          assert projection_hash(Path('schools').glob('*/source-games.csv'),{'normalized_opponent_key','opponent_current_d1'})==pre['source_immutable']
          assert projection_hash([Path('data/evidence/game-assertions.csv')],{'canonical_game_id','normalized_opponent_key'})==pre['assertion_immutable']
          assert projection_hash(Path('schools').glob('*/opponents.csv'),{'canonical_opponent_key','canonical_opponent_name','current_d1'})==pre['opponent_immutable']
          old=set(plan['global_key_map']); byid={r['canonical_game_id']:r for r in canonical}
          assert not any(r['team_a_key'] in old or r['team_b_key'] in old for r in canonical)
          assert not any(r.get('normalized_opponent_key','') in old for r in assertions)
          for p in Path('schools').glob('*/source-games.csv'):
              assert not any(r.get('normalized_opponent_key','') in old for r in rows(p)), p
          for p in Path('schools').glob('*/opponents.csv'):
              assert not any(r.get('canonical_opponent_key','') in old for r in rows(p)), p
          absorbed=set(plan['absorbed_canonical_game_ids']); assert len(absorbed)==58
          assert absorbed.isdisjoint(byid)
          assert not any(r['canonical_game_id'] in absorbed for r in assertions)
          for pair in plan['canonical_pairs']:
              row=byid[pair['survivor_canonical_game_id']]
              for k,v in pair['final_canonical_values'].items(): assert row.get(k,'')==str(v), (pair['survivor_canonical_game_id'],k,row.get(k,''),v)
          for gid in ['CBBG-0065455','CBBG-0065459']:
              assert gid in byid and 'sam-houston' in {byid[gid]['team_a_key'],byid[gid]['team_b_key']}
          txa=rows('schools/texas-a-m/source-games.csv')
          sam=[r for r in txa if r.get('normalized_opponent_key')=='sam-houston' and r.get('source_opponent_label')=='Sam Houston NC']
          assert len(sam)==13, len(sam)
          ohio=byid['CBBG-0046360']
          assert (ohio['site_type'],ohio['designated_home_team_key'],ohio['venue_key'],ohio['venue_id'],ohio['site_city'],ohio['site_state'])==('NEUTRAL','','eugenio-guerra-sports-complex','VEN-000371','Bayamón','PR')
          vr=[r for r in venues if r['venue_id']=='VEN-000371']; assert len(vr)==1 and vr[0]['venue_key']=='eugenio-guerra-sports-complex'
          new_ids={d['discrepancy_id'] for d in plan['new_discrepancies']}; found={d['discrepancy_id'] for d in discs if d['discrepancy_id'] in new_ids}
          assert found==new_ids and all(d['status']=='RESOLVED' for d in discs if d['discrepancy_id'] in new_ids)
          print('PASS: 434 affected rows accounted; 58 absorbed; 376 remapped in place; 2 Sam Houston games retained; 5 reviewed discrepancies; immutable literal evidence preserved.')
          PY
      - name: Repository validation, site rebuild, freshness, tests, and censuses
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rehearsal
          python tools/validate_data.py | tee /tmp/validate.log
          python tools/build_site_data.py | tee /tmp/build-site.log
          python tools/check_site_data_freshness.py | tee /tmp/freshness.log
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/tests.log
          python tools/published_opponent_identity_census.py --json > /tmp/opponent-census.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/opponent-census.json'))
          assert p['priority_counts']['P0']==0, p['priority_counts']
          print('P0_OPPONENT_IDENTITY_FINDINGS=0')
          PY
          python tools/published_site_completeness_census.py --json > /tmp/site-census.json
          git status --short > /tmp/status.txt
          git diff --name-only > /tmp/changed-paths.txt
          echo "CHANGED_PATH_COUNT=$(wc -l < /tmp/changed-paths.txt)"
          cat /tmp/changed-paths.txt
      - name: Confirm original exact checkout was never mutated
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 806caa7d5ed93e2949c675a1a1ddaad3e8ba8400
          test -z "$(git status --porcelain)"
          echo 'PASS: real workflow checkout remained byte-clean; all mutation occurred only in /tmp/rehearsal.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comprehensive-opponent-rehearsal-v3
          path: |
            /tmp/pre.json
            /tmp/apply.log
            /tmp/validate.log
            /tmp/build-site.log
            /tmp/freshness.log
            /tmp/tests.log
            /tmp/opponent-census.json
            /tmp/site-census.json
            /tmp/status.txt
            /tmp/changed-paths.txt
          if-no-files-found: warn
