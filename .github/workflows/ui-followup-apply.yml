name: Apply UI follow-up refinements

on:
  push:
    branches:
      - chore/history-ui-exploration

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/history-ui-exploration
          fetch-depth: 0
      - name: Apply requested UI refinements
        run: python tools/_tmp_ui_followup.py
      - name: Validate inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('site/index.html','utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline script found');
          fs.writeFileSync('/tmp/site-inline.js', scripts[scripts.length - 1][1]);
          NODE
          node --check /tmp/site-inline.js
          git diff --check
      - name: Validate repository
        run: |
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_data.py
          PYTHONDONTWRITEBYTECODE=1 python tools/build_site_data.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Commit production UI change
        run: |
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add site/index.html
          if git diff --cached --quiet; then
            echo "No production change to commit."
            exit 0
          fi
          git commit -m "Refine history UI follow-up details"
          git push origin HEAD:chore/history-ui-exploration
