name: Temporary pre-seal equivalence validation

on:
  push:
    branches:
      - tooling/preseal-semantic-equivalence

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tooling/preseal-semantic-equivalence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repaired remote runtime
        run: |
          python -m py_compile             tools/remote_implementation_stage2_preseal.py             tools/remote_implementation_runner.py             tools/remote_implementation_verify.py
      - name: Run pre-seal equivalence regression
        run: python -m unittest -v tests.test_remote_implementation_stage2_preseal
      - name: Run surrounding remote regressions
        run: |
          python -m unittest -v             tests.test_remote_implementation_control             tests.test_remote_implementation_stage2_proposal             tests.test_remote_implementation_stage2_gate1_fill             tests.test_remote_implementation_stage2_diagnostic
