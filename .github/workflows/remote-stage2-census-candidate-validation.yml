name: Temporary remote Stage 2 census candidate validation

on:
  push:
    branches:
      - tooling/remote-stage2-census

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile candidate remote tooling
        run: |
          python -m py_compile \
            tools/remote_implementation_control.py \
            tools/remote_implementation_io.py \
            tools/remote_implementation_runner.py \
            tools/remote_implementation_verify.py \
            tools/remote_implementation_stage2_census.py
      - name: Run focused remote control tests
        run: |
          python -m unittest \
            tests.test_remote_implementation_control \
            tests.test_remote_implementation_stage2_census -v
