name: All-History expansion known-good conformance

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/all-history-expansion-known-good-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  known-good-conformance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out durable control authority
        uses: actions/checkout@v4
        with:
          ref: control/remote-implementation
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact candidate runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replay VCU, Arizona State, Houston, and UCF
        shell: bash
        run: |
          set -euo pipefail
          control_commit="$(git -C control rev-parse HEAD)"
          candidate_commit="$(git -C candidate rev-parse HEAD)"
          python candidate/tools/all_history_expansion_known_good_conformance.py \
            --control-repo control \
            --runtime-repo candidate \
            --control-commit "$control_commit" \
            --diag /tmp/all-history-expansion-known-good-conformance \
            --json-out /tmp/all-history-expansion-known-good-conformance/summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path('/tmp/all-history-expansion-known-good-conformance/summary.json').read_text()
          )
          assert summary['status'] == 'PASS', summary
          assert summary['witness_count'] == 4, summary
          assert [row['school_key'] for row in summary['witnesses']] == [
              'vcu', 'arizona-state', 'houston', 'ucf'
          ], summary
          assert all(
              row.get('tracked_stage2_mutation') == 'NONE'
              for row in summary['witnesses']
          ), summary
          print('ALL_HISTORY_EXPANSION_KNOWN_GOOD_CONFORMANCE=PASS')
          print('CONTROL_COMMIT=' + summary['control_commit'])
          print('RUNTIME_COMMIT=' + summary['runtime_commit'])
          PY
          test "$(git -C candidate rev-parse HEAD)" = "$candidate_commit"

      - name: Upload conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-history-expansion-known-good-conformance
          path: /tmp/all-history-expansion-known-good-conformance
          if-no-files-found: warn
