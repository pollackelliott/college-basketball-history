name: Mobile context badge flash regression
on:
  push:
    branches:
      - fix/mobile-context-badge-flash
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-context-badge-flash
          fetch-depth: 0
      - name: Apply mobile context fix
        run: python tools/tmp_fix_mobile_context_flash.py
      - name: Validate inline JavaScript
        run: |
          python -c "from pathlib import Path; import re; t=Path('site/index.html').read_text(); s=re.findall(r'<script>(.*?)</script>',t,re.S); assert len(s)==1; Path('/tmp/site-inline.js').write_text(s[0])"
          node --check /tmp/site-inline.js
      - name: Verify route scroll-reset guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('site/index.html').read_text(encoding='utf-8')
          sync_start = text.index('function syncTeamContextTitle()')
          sync_end = text.index('let teamContextSyncPending', sync_start)
          sync = text[sync_start:sync_end]
          render_start = text.index('function render()')
          render_end = text.index('function openProgramFromSearch', render_start)
          render = text[render_start:render_end]
          settle_start = text.index('function settleRouteContextAfterScrollReset')
          settle_end = text.index('function scheduleTeamContextTitleSync', settle_start)
          settle = text[settle_start:settle_end]
          checks = [
              ('guard exists', 'if (routeContextResetPending)' in sync),
              ('guard hides both contexts', 'hideTeamContextTitle();' in sync and 'hideSeriesContextTitle();' in sync),
              ('guard precedes team visibility branch', sync.index('if (routeContextResetPending)') < sync.index('if (isTeam)')),
              ('render arms guard before scroll reset', render.index('routeContextResetPending = true;') < render.index('window.scrollTo(0, 0);')),
              ('render syncs while guard is armed', render.index('window.scrollTo(0, 0);') < render.index('syncTeamContextTitle();')),
              ('render schedules settlement', 'requestAnimationFrame(() => settleRouteContextAfterScrollReset())' in render),
              ('settlement waits for actual top', 'Math.abs(window.scrollY) <= 1' in settle),
              ('settlement retries scroll reset', 'window.scrollTo(0, 0);' in settle and 'settleRouteContextAfterScrollReset(attempt + 1)' in settle),
              ('settlement releases guard before final sync', settle.index('routeContextResetPending = false;') < settle.index('syncTeamContextTitle();')),
          ]
          for label, ok in checks:
              print(('PASS' if ok else 'FAIL') + ': ' + label)
          if not all(ok for _, ok in checks):
              raise SystemExit('mobile context scroll-reset guard regression check failed')
          PY
      - name: Validate repository
        run: |
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_data.py
          PYTHONDONTWRITEBYTECODE=1 python tools/build_site_data.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          git diff --check
      - name: Commit production fix
        run: |
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add site/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prevent mobile context badge flash"
          git push origin HEAD:fix/mobile-context-badge-flash
