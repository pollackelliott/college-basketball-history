name: Mobile context badge flash regression
on:
  push:
    branches:
      - fix/mobile-context-badge-flash
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-context-badge-flash
          fetch-depth: 0
      - name: Apply mobile context fix
        run: python tools/tmp_fix_mobile_context_flash.py
      - name: Validate inline JavaScript
        run: |
          python -c "from pathlib import Path; import re; t=Path('site/index.html').read_text(); s=re.findall(r'<script>(.*?)</script>',t,re.S); assert len(s)==1; Path('/tmp/site-inline.js').write_text(s[0])"
          node --check /tmp/site-inline.js
      - name: Browser QA delayed mobile scroll reset
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('site/index.html').read_text(encoding='utf-8')
          qa = r'''
          <pre id="qaOut" style="position:fixed;left:0;bottom:0;z-index:9999;background:white">RUNNING</pre>
          <script>
          const qaDelay=ms=>new Promise(r=>setTimeout(r,ms));
          async function qaWaitFor(fn,label){for(let i=0;i<300;i++){try{const v=fn();if(v)return v}catch{}await qaDelay(50)}throw new Error('timeout: '+label)}
          async function qaFrames(n=3){for(let i=0;i<n;i++)await new Promise(r=>requestAnimationFrame(r))}
          function qaPass(lines,ok,label,extra=''){lines.push(`${ok?'PASS':'FAIL'}: ${label}${extra?` :: ${extra}`:''}`)}
          setTimeout(async()=>{
            const lines=[];
            try{
              await qaWaitFor(()=>document.querySelector('#programGrid'),'home ready');
              await qaFrames(4);

              window.scrollTo(0,1800);
              await qaFrames(3);
              const nativeScrollTo=window.scrollTo.bind(window);
              let delayedCalls=0;
              window.scrollTo=(...args)=>{delayedCalls++;};
              location.hash='team/alabama';
              await qaWaitFor(()=>document.getElementById('teamPageTitle'),'team rendered');
              await qaFrames(3);
              const teamBadge=document.getElementById('teamContextTitle');
              qaPass(lines,!teamBadge.classList.contains('visible'),'team badge stays hidden while mobile scroll reset is delayed',`scrollY=${Math.round(window.scrollY)}, delayedCalls=${delayedCalls}`);

              window.scrollTo=nativeScrollTo;
              nativeScrollTo(0,0);
              await qaWaitFor(()=>Math.abs(window.scrollY)<=1,'team top reset');
              await qaFrames(4);
              qaPass(lines,!teamBadge.classList.contains('visible'),'team badge stays hidden once route settles at top',`scrollY=${Math.round(window.scrollY)}`);

              nativeScrollTo(0,650);
              await qaFrames(5);
              qaPass(lines,teamBadge.classList.contains('visible'),'team badge appears normally after scrolling past team heading',`scrollY=${Math.round(window.scrollY)}`);

              const nativeAgain=window.scrollTo.bind(window);
              delayedCalls=0;
              window.scrollTo=(...args)=>{delayedCalls++;};
              location.hash='matchup/alabama/auburn';
              await qaWaitFor(()=>document.querySelector('.match-head'),'series rendered');
              await qaFrames(3);
              const seriesBadge=document.getElementById('seriesContextTitle');
              qaPass(lines,!seriesBadge.classList.contains('visible'),'series badges stay hidden while mobile scroll reset is delayed',`scrollY=${Math.round(window.scrollY)}, delayedCalls=${delayedCalls}`);

              window.scrollTo=nativeAgain;
              nativeAgain(0,0);
              await qaWaitFor(()=>Math.abs(window.scrollY)<=1,'series top reset');
              await qaFrames(4);
              qaPass(lines,!seriesBadge.classList.contains('visible'),'series badges stay hidden once route settles at top',`scrollY=${Math.round(window.scrollY)}`);

              nativeAgain(0,650);
              await qaFrames(5);
              qaPass(lines,seriesBadge.classList.contains('visible'),'series badges appear normally after scrolling past series heading',`scrollY=${Math.round(window.scrollY)}`);
            }catch(e){lines.push(`FAIL: ${e.message}`)}
            document.getElementById('qaOut').textContent=lines.join('\n');
          },150);
          </script>
          '''
          if page.count('</body>') != 1:
              raise SystemExit('Expected one body close')
          Path('site/_qa_mobile_context.html').write_text(page.replace('</body>', qa + '</body>'), encoding='utf-8')
          PY
          python -m http.server 8000 --directory site >/tmp/ui-context-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep .2; done
          google-chrome --headless=new --disable-gpu --no-sandbox --window-size=390,844 --virtual-time-budget=45000 --dump-dom http://127.0.0.1:8000/_qa_mobile_context.html#home >/tmp/ui-context-dom.html
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          text=Path('/tmp/ui-context-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<pre id="qaOut"[^>]*>(.*?)</pre>', text, re.S)
          if not m: raise SystemExit('QA output missing')
          output=unescape(re.sub(r'<[^>]+>','',m.group(1))).strip()
          print(output)
          fails=[line for line in output.splitlines() if line.startswith('FAIL:')]
          if fails: raise SystemExit(f'{len(fails)} mobile context checks failed')
          if output.count('PASS:') != 6: raise SystemExit(f'Expected 6 passes, got {output.count("PASS:")}')
          PY
          rm -f site/_qa_mobile_context.html
      - name: Validate repository
        run: |
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_data.py
          PYTHONDONTWRITEBYTECODE=1 python tools/build_site_data.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          git diff --check
      - name: Commit production fix
        run: |
          rm -f site/_qa_mobile_context.html
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add site/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prevent mobile context badge flash"
          git push origin HEAD:fix/mobile-context-badge-flash
