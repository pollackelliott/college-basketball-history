name: George Mason exact expansion Stage 1 rehearsal
on:
  pull_request:
    paths: ['.github/workflows/george-mason-expansion-stage1-rehearsal.yml']
permissions:
  contents: read
jobs:
  authentic-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate protected main and immutable Research base
        run: |
          test "$(git rev-parse refs/remotes/origin/main)" = "c8477ffd4c9bad610ddd9abc961c7a3fe0e77d84"
          test "$(git rev-parse --verify df73675852ec5a43dfac50da0ee06d8bcabf8832^{commit})" = "df73675852ec5a43dfac50da0ee06d8bcabf8832"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retrieve unreferenced Git blob and verify exact original frozen ZIP bytes
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRANSPORT_DIR: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os,json,base64,hashlib,lzma
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          from pathlib import Path
          blob_sha="dde2c6bc0a4641154732cd822c978a124c61d57d"
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs/{blob_sha}"
          request=Request(url,headers={
              "Authorization":"Bearer "+os.environ["GITHUB_READ_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          with urlopen(request,timeout=60) as response:
              blob=json.load(response)
          if blob.get("sha")!=blob_sha or blob.get("encoding")!="base64":
              raise SystemExit("unreferenced Git transport blob mismatch")
          text=base64.b64decode(blob["content"])
          if hashlib.sha1(b"blob "+str(len(text)).encode()+b"\0"+text).hexdigest()!=blob_sha:
              raise SystemExit("Git blob raw identity mismatch")
          if hashlib.sha256(text).hexdigest()!="5b1faa4293a147c04b36e7fb2b882cff15b446d5e3b6cefc366a219ae274ddc4":
              raise SystemExit("transport text SHA-256 mismatch")
          compressed=base64.b64decode(b"".join(text.split()),validate=True)
          if hashlib.sha256(compressed).hexdigest()!="8854b49ac2ecc8bf455bb75c5db5f300c1a10d4c154d7b515cb3c99b926bdb50":
              raise SystemExit("XZ SHA-256 mismatch")
          original=lzma.decompress(compressed)
          freeze_sha="bd3d550907b8d761eb7000c1f5d934f24d5a3c96b47e054d49a173c5e1295236"
          if hashlib.sha256(original).hexdigest()!=freeze_sha:
              raise SystemExit("ORIGINAL RESEARCH FREEZE ZIP SHA-256 MISMATCH")
          target=Path(os.environ["TRANSPORT_DIR"])/"george-mason-expansion-research-frozen.zip"
          target.write_bytes(original)
          with ZipFile(target) as archive:
              if archive.testzip():
                  raise SystemExit("Freeze ZIP CRC failure")
              manifest=json.loads(archive.read("expansion-freeze.json"))
          if (manifest.get("school_key"),manifest.get("research_base_sha"),manifest.get("state"))!=(
              "george-mason","df73675852ec5a43dfac50da0ee06d8bcabf8832","EXPANSION_RESEARCH_FROZEN"):
              raise SystemExit("Freeze manifest authority mismatch")
          print("EXACT_FREEZE_TRANSPORT_VERIFIED",freeze_sha,len(original))
          PY
      - name: Permanent full inherited-baseline and expansion-freeze verification
        run: |
          python tools/all_history_expansion_freeze.py --repo . verify "${RUNNER_TEMP}/george-mason-expansion-research-frozen.zip"
      - name: Run permanent exact-current-main Stage 1 twice without repository mutation
        run: |
          mkdir -p "${RUNNER_TEMP}/gmu-stage1"
          python tools/expansion_implementation_stage1.py george-mason "${RUNNER_TEMP}/george-mason-expansion-research-frozen.zip" --expected-sha256 bd3d550907b8d761eb7000c1f5d934f24d5a3c96b47e054d49a173c5e1295236 --research-base df73675852ec5a43dfac50da0ee06d8bcabf8832 --main-sha c8477ffd4c9bad610ddd9abc961c7a3fe0e77d84 --repo . --output "${RUNNER_TEMP}/gmu-stage1/a" >"${RUNNER_TEMP}/gmu-stage1/run-a.log" 2>&1 || { cat "${RUNNER_TEMP}/gmu-stage1/run-a.log"; exit 1; }
          cat "${RUNNER_TEMP}/gmu-stage1/run-a.log"
          python tools/expansion_implementation_stage1.py george-mason "${RUNNER_TEMP}/george-mason-expansion-research-frozen.zip" --expected-sha256 bd3d550907b8d761eb7000c1f5d934f24d5a3c96b47e054d49a173c5e1295236 --research-base df73675852ec5a43dfac50da0ee06d8bcabf8832 --main-sha c8477ffd4c9bad610ddd9abc961c7a3fe0e77d84 --repo . --output "${RUNNER_TEMP}/gmu-stage1/b" >"${RUNNER_TEMP}/gmu-stage1/run-b.log" 2>&1 || { cat "${RUNNER_TEMP}/gmu-stage1/run-b.log"; exit 1; }
          cat "${RUNNER_TEMP}/gmu-stage1/run-b.log"
      - name: Independent byte-level two-rehearsal proof and complete population inventory
        run: |
          python - <<'PY'
          import csv,hashlib,io,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gmu-stage1"
          a,b=root/"a",root/"b"
          members=["source-games.csv","opponents.csv","venues.csv","conferences.csv","notes.md","source-notes.md","expansion-stage1-reconciliation.json"]
          for name in members:
              if (a/name).read_bytes()!=(b/name).read_bytes():
                  raise SystemExit("nondeterministic candidate: "+name)
          report=json.loads((a/members[-1]).read_text())
          for name,expected in report["candidate_member_sha256"].items():
              if hashlib.sha256((a/name).read_bytes()).hexdigest()!=expected:
                  raise SystemExit("candidate hash mismatch: "+name)
          raw=subprocess.check_output(["git","show","df73675852ec5a43dfac50da0ee06d8bcabf8832:schools/george-mason/source-games.csv"])
          inherited=list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"))))
          combined=list(csv.DictReader((a/"source-games.csv").open(encoding="utf-8")))
          if len(inherited)!=1455 or len(combined)!=1769 or combined[:1455]!=inherited:
              raise SystemExit("inherited evidence changed or source count incorrect")
          if len({r["source_game_id"] for r in combined})!=1769:
              raise SystemExit("duplicate source-game IDs")
          census=report["census"]
          if (census["inherited_source_game_count"],census["supplemental_new_source_game_count"])!=(1455,314):
              raise SystemExit("source count mismatch")
          identity=report["canonical_identity_census"]
          if len(identity["game_rows"])!=314 or sum(identity["counts"].values())!=314:
              raise SystemExit("canonical match population incomplete")
          if census["opponent_support_actions"]["NEW_SUPPLEMENTAL"]!=96 or census["opponent_support_actions"]["EXTEND_INHERITED"]!=25:
              raise SystemExit("opponent actions changed")
          if census["venue_support_actions"]["NEW_SUPPLEMENTAL"]!=7 or census["venue_support_actions"]["EXTEND_INHERITED"]!=1:
              raise SystemExit("venue actions changed")
          if report["status"]!="BLOCKED" or report["write_authority"]!="NONE_REHEARSAL_ONLY":
              raise SystemExit("unauthorized integration advance")
          if subprocess.check_output(["git","status","--porcelain","--untracked-files=no"]).strip():
              raise SystemExit("tracked repository mutation detected")
          proof={"status":"INDEPENDENTLY_REPRODUCED_READ_ONLY_STAGE1",
                 "protected_main_sha":"c8477ffd4c9bad610ddd9abc961c7a3fe0e77d84",
                 "research_base_sha":"df73675852ec5a43dfac50da0ee06d8bcabf8832",
                 "freeze_zip_sha256":"bd3d550907b8d761eb7000c1f5d934f24d5a3c96b47e054d49a173c5e1295236",
                 "identity_counts":identity["counts"],
                 "support_opponents":census["opponent_support_actions"],
                 "support_venues":census["venue_support_actions"],
                 "global_venue_counts":report["global_venue_reconciliation"]["counts"],
                 "blockers":report["blockers"],
                 "candidate_sha256":{name:hashlib.sha256((a/name).read_bytes()).hexdigest() for name in members},
                 "integration_freeze_authorized":False}
          serialized=(json.dumps(proof,sort_keys=True,separators=(",",":"))+"\n").encode()
          (root/"independent-proof.json").write_bytes(serialized)
          print("INDEPENDENT_PROOF_SHA256",hashlib.sha256(serialized).hexdigest())
          print("RECONCILIATION_COUNTS",json.dumps({k:proof[k] for k in ("identity_counts","support_opponents","support_venues","global_venue_counts")},sort_keys=True))
          print("BLOCKER_CLASSES",json.dumps([x["class"] for x in proof["blockers"]],sort_keys=True))
          PY
      - name: Focused generic Integration Freeze and Phase 0 authority regressions
        run: python -m unittest discover -s tests -p 'test_all_history_expansion_integration.py' -v
      - name: Integrate exact read-only expansion freeze twice and verify independent equivalence
        run: |
          PROOF_SHA=$(sha256sum "$RUNNER_TEMP/gmu-stage1/independent-proof.json" | cut -d' ' -f1)
          python - <<'PY'
          import csv,hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gmu-stage1"
          venues_raw=(root/"a/venues.csv").read_bytes()
          venues=list(csv.DictReader((root/"a/venues.csv").open(encoding="utf-8")))
          target=[r for r in venues if r.get("venue_key")=="umbc-fieldhouse"]
          assert len(target)==1,target
          row=target[0]
          assert (row.get("canonical_name"),row.get("city"),row.get("state"))==(
              "UMBC Fieldhouse","Baltimore","MD"),row
          globals_=list(csv.DictReader(Path("data/reference/venues.csv").open(encoding="utf-8")))
          global_row=[r for r in globals_ if r.get("venue_id")=="VEN-000934"]
          assert len(global_row)==1,global_row
          global_row=global_row[0]
          assert (global_row.get("venue_key"),global_row.get("city"),global_row.get("state"))==(
              "retriever-activities-center","Catonsville","MD"),global_row
          spec={
              "schema_version":2,
              "school_key":"george-mason",
              "owner_approval_basis":"Control Center accepted durable UMBC physical-venue resolution: https://github.com/pollackelliott/college-basketball-history/pull/572#issuecomment-6844523817",
              "expected_research_zip_sha256":"bd3d550907b8d761eb7000c1f5d934f24d5a3c96b47e054d49a173c5e1295236",
              "expected_venues_sha256":hashlib.sha256(venues_raw).hexdigest(),
              "mappings":[{
                  "local_venue_key":"umbc-fieldhouse",
                  "expected_local_name":"UMBC Fieldhouse",
                  "expected_local_city":"Baltimore",
                  "expected_local_state":"MD",
                  "global_venue_id":"VEN-000934",
                  "global_venue_key":"retriever-activities-center",
                  "expected_global_city":"Catonsville",
                  "expected_global_state":"MD",
                  "allow_locality_variant":True,
                  "locality_variant_basis":"UMBC identifies the physical campus in Catonsville while using a Baltimore MD 21250 mailing address; UMBC institutional history identifies the 1973 UMBC Fieldhouse as the same building later renamed Retriever Activities Center.",
                  "resolution_basis":"Control Center accepted same-physical-venue resolution at PR #572 issuecomment-6844523817; no second global venue; preserve literal frozen/source Baltimore locality evidence."
              }]
          }
          raw=(json.dumps(spec,sort_keys=True,separators=(",",":"))+"\n").encode()
          out=root/"umbc-venue-reconciliation.json"
          out.write_bytes(raw)
          print("VENUE_RECONCILIATION_SHA256",hashlib.sha256(raw).hexdigest())
          print("FROZEN_VENUES_SHA256",spec["expected_venues_sha256"])
          PY
          for slot in a b; do
            python tools/all_history_expansion_integration.py freeze george-mason "$RUNNER_TEMP/george-mason-expansion-research-frozen.zip" \
              --expected-sha256 bd3d550907b8d761eb7000c1f5d934f24d5a3c96b47e054d49a173c5e1295236 \
              --research-base df73675852ec5a43dfac50da0ee06d8bcabf8832 \
              --main-sha c8477ffd4c9bad610ddd9abc961c7a3fe0e77d84 \
              --independent-proof "$RUNNER_TEMP/gmu-stage1/independent-proof.json" \
              --independent-proof-sha256 "$PROOF_SHA" \
              --venue-reconciliation "$RUNNER_TEMP/gmu-stage1/umbc-venue-reconciliation.json" \
              --repo . --output "$RUNNER_TEMP/gmu-stage1/integration-$slot"
          done
          python tools/all_history_expansion_integration.py verify "$RUNNER_TEMP/gmu-stage1/integration-a"
          python tools/all_history_expansion_integration.py verify "$RUNNER_TEMP/gmu-stage1/integration-b"
          python tools/all_history_expansion_integration.py prepare-phase0 \
            "$RUNNER_TEMP/gmu-stage1/integration-a" \
            --output "$RUNNER_TEMP/gmu-stage1/phase0-preparation-only.json"
          python tools/all_history_expansion_phase0_preview.py \
            --repo . --integration-freeze "$RUNNER_TEMP/gmu-stage1/integration-a" \
            --output "$RUNNER_TEMP/gmu-stage1/phase0-disposable-preview"
          python - <<'PY'
          import csv,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gmu-stage1"
          a,b=root/"integration-a",root/"integration-b"
          preview=root/"phase0-disposable-preview"
          members=sorted(p.name for p in a.iterdir() if p.is_file())
          assert len(members)==9, members
          assert "venue-reconciliation.json" in members
          assert members==sorted(p.name for p in b.iterdir() if p.is_file())
          for name in members:
              assert (a/name).read_bytes()==(b/name).read_bytes(), f"nondeterministic integration freeze {name}"
          m=json.loads((a/"expansion-integration-freeze.json").read_bytes())
          assert m["status"]=="INTEGRATION_FROZEN"
          assert m["source_preservation"]["inherited_count"]==1455
          assert m["source_preservation"]["supplemental_count"]==314
          assert m["source_preservation"]["combined_count"]==1769
          assert m["canonical_identity_counts"]=={
              "IDENTITY_REVIEW_BLOCKER":0, "PROVISIONAL_NEW_CANONICAL":312,"REUSE_CANONICAL":2}
          assert m["global_venue_reconciliation"]=={
              "GLOBAL_VENUE_IDENTITY_REVIEW_BLOCKER":0,
              "NEW_GLOBAL_VENUE_REGISTRATION_REQUIRED":6,
              "REUSE_REGISTERED_GLOBAL_VENUE":2}
          assert m["venue_reconciliation"]["spec_path"]=="venue-reconciliation.json"
          assert m["venue_reconciliation"]["mappings"][0]["local_venue_key"]=="umbc-fieldhouse"
          assert m["venue_reconciliation"]["mappings"][0]["global_venue_id"]=="VEN-000934"
          assert m["venue_reconciliation"]["mappings"][0]["global_venue_key"]=="retriever-activities-center"
          vc=m["venue_reconciliation_census"]
          assert vc["blocker_count"]==0,vc
          assert vc["classification_counts"].get("NEW_GLOBAL_IDENTITY")==5,vc
          target=[r for r in vc["rows"] if r["venue_key"]=="umbc-fieldhouse"]
          assert len(target)==1,target
          assert target[0]["classification"]=="SAFE_REPRESENTATION_REUSE",target
          assert target[0]["resolution"]=="REUSE_EXPLICIT_RECONCILIATION",target
          assert target[0]["target_venue_id"]=="VEN-000934",target
          assert target[0]["target_venue_key"]=="retriever-activities-center",target
          assert not m["release_authority"]
          assert m["tracked_mutation"]=="NONE"

          proposal=json.loads((preview/"phase0-preview.json").read_bytes())
          assert proposal["status"]=="DISPOSABLE_ONLY_NOT_PUBLISHED"
          assert proposal["global_venue_registration_count"]==5,proposal
          assert proposal["venue_identity_census"]["blocker_count"]==0,proposal["venue_identity_census"]
          guard=[r for r in proposal["venue_identity_census"]["rows"] if r["venue_key"]=="umbc-fieldhouse"]
          assert len(guard)==1,guard
          assert guard[0]["explicit_reuse_id"]=="VEN-000934",guard
          assert all(x["venue_key"]!="umbc-fieldhouse" for x in proposal["new_global_venue_ids_and_keys"])

          frozen_sources=(a/"source-games.csv").read_bytes()
          preview_sources=(preview/"source-games.csv").read_bytes()
          assert preview_sources==frozen_sources, "source-games literal evidence changed"
          source_rows=list(csv.DictReader((preview/"source-games.csv").open(encoding="utf-8")))
          umbc_games=[r for r in source_rows if r.get("curated_venue_name")=="UMBC Fieldhouse"]
          assert len(umbc_games)==3,umbc_games
          assert [(r.get("game_date"),r.get("city"),r.get("state")) for r in umbc_games]==[
              ("1974-02-23","Baltimore","MD"),
              ("1974-02-28","Baltimore","MD"),
              ("1975-02-27","Baltimore","MD"),
          ],umbc_games

          venue_rows=list(csv.DictReader((preview/"venues.csv").open(encoding="utf-8")))
          resolved=[r for r in venue_rows if r.get("venue_id")=="VEN-000934"]
          assert len(resolved)>=1,resolved
          gmu=[r for r in resolved if r.get("canonical_name")=="UMBC Fieldhouse"]
          assert len(gmu)==1,gmu
          assert (gmu[0]["venue_key"],gmu[0]["city"],gmu[0]["state"])==(
              "retriever-activities-center","Catonsville","MD"),gmu[0]

          projected_globals=list(csv.DictReader((preview/"references/venues.csv").open(encoding="utf-8")))
          current_globals=list(csv.DictReader(Path("data/reference/venues.csv").open(encoding="utf-8")))
          before=[r for r in current_globals if r.get("venue_id")=="VEN-000934"]
          after=[r for r in projected_globals if r.get("venue_id")=="VEN-000934"]
          assert before==after and len(after)==1,(before,after)
          assert not [r for r in projected_globals if r.get("venue_key")=="umbc-fieldhouse"]

          prep=json.loads((root/"phase0-preparation-only.json").read_bytes())
          assert prep["status"]=="PREPARATION_ONLY"
          assert not prep["phase0_executed"]
          assert prep["mutation_authority"]=="NONE"
          assert subprocess.check_output(["git","status","--porcelain","--untracked-files=no"]).strip()==b""
          print("INTEGRATION_FREEZE_SHA256",hashlib.sha256(
              (a/"expansion-integration-freeze.json").read_bytes()).hexdigest())
          print("VENUE_RECONCILIATION_CENSUS",json.dumps(vc,sort_keys=True))
          print("PHASE0_PREVIEW_COUNTS",json.dumps({
              "global_venue_registration_count":proposal["global_venue_registration_count"],
              "venue_blockers":proposal["venue_identity_census"]["blocker_count"],
              "source_game_count":proposal["source_game_count"],
              "inherited_source_game_count":proposal["inherited_source_game_count"],
              "supplemental_source_game_count":proposal["supplemental_source_game_count"],
          },sort_keys=True))
          print("PHASE0_TRANSACTION_EXECUTED",False)
          print("EXACT_REHEARSAL_VERIFIED", True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: george-mason-exact-stage1-rehearsal
          path: |
            ${{ runner.temp }}/gmu-stage1/
            ${{ runner.temp }}/george-mason-expansion-research-frozen.zip
          retention-days: 30
          if-no-files-found: warn
