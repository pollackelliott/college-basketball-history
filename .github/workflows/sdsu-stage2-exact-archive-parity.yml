name: SDSU Stage 2 exact Stage 1 archive parity
on:
  push:
    branches:
      - research/san-diego-state-all-history-expansion
    paths:
      - .github/workflows/sdsu-stage2-exact-archive-parity.yml
permissions:
  contents: write
jobs:
  verify-exact-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Authenticate original archive and create bounded Stage 2 parity checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, os, pathlib, subprocess, zipfile
          from collections import Counter
          ROOT=pathlib.Path("research/san-diego-state-all-history-expansion")
          BASE="d7c620dbd95bd0e9928bb29abcc75f26ee22fd1f"
          MAIN="242370fc551fd749c157c74d92917ddfafbe40e0"
          RESEARCH_BASE="5b840a354fb5cd792239ff8b93cba223a18dd87a"
          source=ROOT/"checkpoints/0029-stage1-complete-source-acknowledged-coverage-gap/san-diego-state-stage1-complete-checkpoint.zip"
          prev=ROOT/"stage2/0048-stage2-archive-parity-transport-blocked"
          dest=ROOT/"stage2/0049-stage2-exact-archive-parity-verification"
          errors=[]; checks={}; inventory={}; mismatch=[]
          def check(name, ok, detail=""):
              checks[name]={"pass":bool(ok),"detail":detail}
              if not ok: errors.append(name+": "+str(detail))
          def sha(b): return hashlib.sha256(b).hexdigest()
          def readcsv(raw):
              return list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig",errors="strict"),newline="")))
          def evidence(row):
              d=dict(row)
              for key,val in row.items():
                  if val and val.lstrip().startswith("{"):
                      try:
                          obj=json.loads(val)
                          if isinstance(obj,dict):
                              d.update({str(k):v for k,v in obj.items() if k not in d})
                              for nested in obj.values():
                                  if isinstance(nested,dict):
                                      d.update({str(k):v for k,v in nested.items() if k not in d})
                      except (json.JSONDecodeError,TypeError):
                          pass
              return d
          def game_id(r):
              for key in ("source_game_id","game_id","research_game_id","source_id"):
                  if r.get(key): return r[key]
              return ""
          def same(a,b): return str(a if a is not None else "")==str(b if b is not None else "")
          def getblob(path):
              return subprocess.check_output(["git","rev-parse",f"{BASE}:{path.as_posix()}"],text=True).strip()
          out={"kind":"SDSU_STAGE2_EXACT_ARCHIVE_PARITY_0049_V1","school_key":"san-diego-state","stage":"STAGE_2","parent_research_head":BASE,"protected_main_sha":MAIN,"immutable_research_base_sha":RESEARCH_BASE}
          try:
              actual=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
              parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
              changed=subprocess.check_output(["git","diff","--name-only",BASE,"HEAD"],text=True).splitlines()
              allowed=[".github/workflows/sdsu-stage2-exact-archive-parity.yml"]
              check("authenticated_workflow_parent",parent==BASE,{"actual":parent,"expected":BASE})
              check("workflow_changed_path_only",changed==allowed,changed)
              check("protected_main_object_present",subprocess.run(["git","cat-file","-e",MAIN+"^{commit}"],capture_output=True).returncode==0,MAIN)
              check("research_base_object_present",subprocess.run(["git","cat-file","-e",RESEARCH_BASE+"^{commit}"],capture_output=True).returncode==0,RESEARCH_BASE)
              raw=source.read_bytes()
              check("original_stage1_zip_size",len(raw)==451387,len(raw))
              check("original_stage1_zip_sha256",sha(raw)=="25d9eed65d15dfdb9a32bc1434b7f71e98ecf6b9d0f731cd8e8d6ceb8e2aa7c6",sha(raw))
              check("original_stage1_zip_git_blob",getblob(source)=="e71dc178f8b360dd19fad5c2e14075fcb999dbb9",getblob(source))
              accepted=prev/"structured-stage2-ledger.csv"
              mapping=prev/"stage4-authoring/opponents.csv"
              check("stage2_ledger_unchanged_blob",getblob(accepted)=="4865c0b823394a7b47ed938df7f762aa6c77b5ad",getblob(accepted))
              check("opponent_map_unchanged_blob",getblob(mapping)=="fe7314fa2b8c0b8ca24d8b938b677edff997c4ba",getblob(mapping))
              s2=readcsv(accepted.read_bytes())
              maps=readcsv(mapping.read_bytes())
              check("stage2_game_row_population",len(s2)==1086,len(s2))
              check("stage2_opponent_label_population",len(maps)==341,len(maps))
              check("stage2_resolved_opponents",len({r.get("canonical_opponent_key","") for r in maps})==203 and all(r.get("canonical_opponent_key") for r in maps),"distinct keys "+str(len({r.get("canonical_opponent_key","") for r in maps})))
              check("stage2_game_id_uniqueness",len({game_id(r) for r in s2})==1086 and all(game_id(r) for r in s2),{"id_columns":list(s2[0]) if s2 else []})
              check("stage2_no_unsupported_han",all(r.get("site_type","UNKNOWN")=="UNKNOWN" for r in s2),"unknown rows "+str(sum(r.get("site_type","UNKNOWN")=="UNKNOWN" for r in s2)))
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  files=z.namelist()
                  inventory["zip_members"]=files
                  check("stage1_zip_crc_integrity",z.testzip() is None,"zipfile.testzip")
                  manifests=[x for x in files if x.endswith("stage1-manifest.json")]
                  check("stage1_internal_manifest_present",len(manifests)==1,manifests)
                  if manifests:
                      manifest=json.loads(z.read(manifests[0]))
                      inventory["stage1_manifest_keys"]=list(manifest)
                      inventory["stage1_manifest_kind"]=manifest.get("kind")
                      inventory["stage1_manifest"]=manifest
                      hashes=[]
                      def findhashes(o,path=""):
                          if isinstance(o,dict):
                              if isinstance(o.get("sha256"),str) and len(o["sha256"])==64 and path:
                                  hashes.append((path,o["sha256"]))
                              for k,v in o.items():
                                  if isinstance(v,dict) and not k in ("sha256","size","bytes","bytes_utf8"): findhashes(v, k if not path else path+"/"+k)
                      if isinstance(manifest.get("files"),dict):
                          for path,obj in manifest["files"].items():
                              if isinstance(obj,dict):
                                  expected=obj.get("sha256")
                                  if expected:
                                      options=[path,"checkpoint/"+path]
                                      matched=[a for a in options if a in files]
                                      check("stage1_manifest_member_"+path,bool(matched) and sha(z.read(matched[0]))==expected,{"path":matched[0] if matched else None,"expected":expected})
                                      hashes.append(path)
                      check("stage1_internal_manifest_member_hashes_verified",len(hashes)>=5,{"verified_member_entries":len(hashes)})
                  csv_candidates=[]
                  for name in files:
                      if name.lower().endswith(".csv"):
                          try:
                              rows=readcsv(z.read(name))
                              csv_candidates.append((name,len(rows),list(rows[0]) if rows else [],rows))
                          except Exception as e:
                              inventory.setdefault("unreadable_csv",[]).append([name,str(e)])
                  inventory["csv_inventory"]=[{"path":name,"rows":count,"columns":columns} for name,count,columns,rows in csv_candidates]
                  matching=[x for x in csv_candidates if x[1]==1086 and any(k in x[2] for k in ("source_game_id","game_id","research_game_id"))]
                  matching.sort(key=lambda x:(0 if "ledger" in x[0] else 1,x[0]))
                  check("authoritative_stage1_accepted_ledger_identified",len(matching)>=1,[x[0] for x in matching])
                  if matching:
                      name,count,cols,s1=matching[0]
                      inventory["chosen_stage1_ledger"]=name
                      old={game_id(r):r for r in s1}
                      new={game_id(r):r for r in s2}
                      ids1=set(old);ids2=set(new)
                      check("exact_game_id_set",ids1==ids2,{"only_stage1":sorted(ids1-ids2),"only_stage2":sorted(ids2-ids1)})
                      ignored={"opponent_key","canonical_opponent_key","resolved_opponent_key"}
                      unrepresented=set()
                      for gid in sorted(ids1 & ids2):
                          a=old[gid];b=evidence(new[gid])
                          for col,rawval in a.items():
                              if col in ignored: continue
                              if col not in b:
                                  unrepresented.add(col)
                                  mismatch.append({"game_id":gid,"column":col,"kind":"SOURCE_FIELD_NOT_PRESERVED"})
                              elif not same(rawval,b[col]):
                                  mismatch.append({"game_id":gid,"column":col,"kind":"FIELD_PARITY_MISMATCH","stage1":str(rawval)[:250],"stage2":str(b[col])[:250]})
                      inventory["unrepresented_stage1_columns"]=sorted(unrepresented)
                      check("all_preserved_stage1_fields_exactly_equal",len(mismatch)==0,{"mismatch_count":len(mismatch),"distinct_columns":sorted({m["column"] for m in mismatch}),"sample":mismatch[:25]})
                  excluded_candidates=[(name,count) for name,count,cols,rows in csv_candidates if count==1126 or ("exclusion" in name.lower() and count==40)]
                  inventory["disposition_candidates"]=excluded_candidates
                  check("stage1_exclusion_accounting",bool(excluded_candidates),excluded_candidates)
                  candidate_cov=[n for n in files if "source-acknowledged-coverage-gaps" in n or "season-coverage.json" in n]
                  inventory["coverage_members"]=candidate_cov
                  check("stage1_1921_22_coverage_debt_preserved",bool(candidate_cov),candidate_cov)
                  for n in candidate_cov: inventory.setdefault("coverage_payloads",{})[n]=json.loads(z.read(n))
                  check("stage1_complete_manifest_status",bool(manifests) and bool(manifest.get("stage1_complete") or manifest.get("status")=="COMPLETE"),{"stage1_complete":manifest.get("stage1_complete") if manifests else None})
          except Exception as exc:
              errors.append("EXECUTION_EXCEPTION: "+repr(exc))
              out["exception"]=repr(exc)
          out["checks"]=checks;out["zip_inventory"]=inventory
          out["mismatches"]=mismatch
          out["mismatch_count"]=len(mismatch)
          out["passed"]=not errors
          out["errors"]=errors
          dest.mkdir(parents=True,exist_ok=False)
          report=dest/"parity-report.json"
          report.write_text(json.dumps(out,indent=2,ensure_ascii=False)+"\n")
          status={"checkpoint":"0049-stage2-exact-archive-parity-verification","school_key":"san-diego-state","stage":"STAGE_2","stage2_complete":not errors,"stage2_state":"COMPLETE" if not errors else "BLOCKED_EXACT_ARCHIVE_PARITY_VERIFICATION","parent_research_head":BASE,"protected_main_sha":MAIN,"immutable_research_base_sha":RESEARCH_BASE,"original_stage1_zip_sha256":"25d9eed65d15dfdb9a32bc1434b7f71e98ecf6b9d0f731cd8e8d6ceb8e2aa7c6","accepted_game_rows":1086,"previous_ledger_sha256":"1f65277fc7143b0494a6f88d304e182dcea748abf5aad22561bb86083ac1cc89","previous_opponent_map_sha256":"b115ba0b5c1de314345e12342d8b76e2eb082c77411d985343f713adf696707d","stage3_started":False,"unresolved_verification_checks":errors}
          (dest/"research-status.json").write_text(json.dumps(status,indent=2)+"\n")
          result_files={}
          for n in ("parity-report.json","research-status.json"):
              b=(dest/n).read_bytes();result_files[n]={"sha256":sha(b),"bytes_utf8":len(b)}
          (dest/"manifest.json").write_text(json.dumps({"kind":"SDSU_STAGE2_0049_ARCHIVE_VERIFICATION_CHECKPOINT_V1","checkpoint":dest.name,"parent_research_head":BASE,"immutable_research_base_sha":RESEARCH_BASE,"stage2_complete":not errors,"files":result_files,"source_checkpoint_0048_unmodified":True},indent=2)+"\n")
          print(json.dumps({"status":"PASS" if not errors else "BLOCKED","checks":len(checks),"errors":errors[:12],"mismatch_count":len(mismatch),"checkpoint":str(dest)}))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as fd:
              fd.write("## San Diego State Stage 2 archive parity\n\n")
              fd.write("**"+("PASS" if not errors else "BLOCKED")+"** — "+str(len(checks))+" checks, "+str(len(mismatch))+" field mismatches\n\n")
              fd.write("Stage 1 ZIP SHA-256: "+sha(source.read_bytes())+"\n\n")
              fd.write("Remaining checks: "+("; ".join(errors[:10]) if errors else "none")+"\n")
          PY
      - name: Publish exact Research checkpoint (never protected main)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/san-diego-state-all-history-expansion/stage2/0049-stage2-exact-archive-parity-verification/manifest.json
          git add research/san-diego-state-all-history-expansion/stage2/0049-stage2-exact-archive-parity-verification/research-status.json
          git add research/san-diego-state-all-history-expansion/stage2/0049-stage2-exact-archive-parity-verification/parity-report.json
          git commit -m "research(sdsu): checkpoint Stage 2 exact Stage 1 archive parity"
          git push origin HEAD:refs/heads/research/san-diego-state-all-history-expansion
