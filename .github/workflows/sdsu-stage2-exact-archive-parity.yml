name: SDSU Stage 2 exact Stage 1 archive certification
on:
  push:
    branches:
      - research/san-diego-state-all-history-expansion
    paths:
      - .github/workflows/sdsu-stage2-exact-archive-parity.yml
permissions:
  contents: read
jobs:
  certify-stage2-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Independently certify exact original Stage 1 archive and corrected full Stage 2 population
        shell: bash
        run: |
          python - <<'PY'
          import collections,csv,hashlib,io,json,pathlib,subprocess,zipfile
          root=pathlib.Path("research/san-diego-state-all-history-expansion")
          parent="8ce570bbe263f1116453fc7b72c5e70119ea1321"
          p=root/"stage2/0052-stage2-complete-exact-source-provenance"
          stage1=root/"checkpoints/0029-stage1-complete-source-acknowledged-coverage-gap/san-diego-state-stage1-complete-checkpoint.zip"
          prior=root/"stage2/0048-stage2-archive-parity-transport-blocked"
          def sha(b):return hashlib.sha256(b).hexdigest()
          def readcsv(data):return list(csv.DictReader(io.StringIO(data.decode("utf-8-sig"),newline="")))
          def ck(condition,message):
              if not condition:raise AssertionError(message)
          ck(subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()==parent,"unexpected parent research HEAD")
          ck(subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"],text=True).splitlines()==sorted([".github/workflows/sdsu-stage2-exact-archive-parity.yml"]+[str(x) for x in p.rglob("*") if x.is_file()]),"unexpected commit paths")
          manifest=json.loads((p/"manifest.json").read_text())
          ck(manifest["stage2_complete"] is True and manifest["parent_research_head"]==parent and manifest["immutable_research_base_sha"]=="5b840a354fb5cd792239ff8b93cba223a18dd87a","manifest authority")
          for file,spec in manifest["files"].items():
              contents=(p/file).read_bytes()
              ck(sha(contents)==spec["sha256"] and len(contents)==spec["bytes"],"manifest member "+file)
          zipbytes=stage1.read_bytes()
          ck(len(zipbytes)==451387 and sha(zipbytes)=="25d9eed65d15dfdb9a32bc1434b7f71e98ecf6b9d0f731cd8e8d6ceb8e2aa7c6","original ZIP identity")
          with zipfile.ZipFile(stage1) as archive:
              ck(archive.testzip() is None,"ZIP CRC")
              sm=json.loads(archive.read("checkpoint/stage1-manifest.json"))
              ck(sm["stage1_complete"] is True and sm["game_rows"]==1086 and sm["research_base_sha"]==manifest["immutable_research_base_sha"],"original Stage 1 manifest")
              ck(len(sm["members"])==20 and len(sm["original_audited_members"])==8,"member population")
              for name,spec in sm["members"].items():
                  b=archive.read("checkpoint/"+name)
                  ck(len(b)==spec["size"] and sha(b)==spec["sha256"],"inner member "+name)
              relocated=0
              for name,spec in sm["original_audited_members"].items():
                  candidates=[name,"checkpoint/audited-parent/"+name.removeprefix("checkpoint/")]
                  matches=[n for n in candidates if n in archive.namelist() and len(archive.read(n))==spec["size"] and sha(archive.read(n))==spec["sha256"]]
                  ck(bool(matches),"audited parent "+name)
                  if matches[0]!=name:relocated+=1
              ck(relocated==3,"expected audited parent closeout relocations")
              s1=readcsv(archive.read("checkpoint/structured-stage1-ledger.csv"))
              dispositions=readcsv(archive.read("checkpoint/source-authority/all-49-season-dispositions.csv"))
              gaps=archive.read("checkpoint/source-acknowledged-coverage-gaps.json")
              seasoncov=archive.read("checkpoint/season-coverage.json")
              ck((p/"source-acknowledged-coverage-gaps.json").read_bytes()==gaps,"coverage debt copied exactly")
              ck((p/"stage4-authoring/season-coverage.json").read_bytes()==seasoncov,"season coverage copied exactly")
              debt=json.loads(gaps)
              ck(debt["total_unidentified_games"]==3 and debt["terminal_gaps"][0]["new_game_ids"]==0,"coverage debt accounting")
              ck(len(dispositions)==1126 and len({r["research_id"] for r in dispositions})==1126,"disposition records")
              ck(len(set(r["research_id"] for r in dispositions)-set(r["research_game_id"] for r in s1))==40,"exact source exclusions")
          old=readcsv((prior/"structured-stage2-ledger.csv").read_bytes())
          new=readcsv((p/"structured-stage2-ledger.csv").read_bytes())
          mapping=readcsv((p/"stage4-authoring/opponents.csv").read_bytes())
          ck(sha((p/"structured-stage2-ledger.csv").read_bytes())=="2809b2b619255eaa5b5d637254b850cd7811d1e922f6fdee2b6dda2447d53d95","exact corrected ledger bytes")
          ck((p/"stage4-authoring/opponents.csv").read_bytes()==(prior/"stage4-authoring/opponents.csv").read_bytes(),"unchanged accepted map")
          ck(len(s1)==len(old)==len(new)==1086 and len(mapping)==341,"row counts")
          a={r["research_game_id"]:r for r in s1}
          o={r["research_game_id"]:r for r in old}
          b={r["research_game_id"]:r for r in new}
          ck(len(a)==len(o)==len(b)==1086 and set(a)==set(o)==set(b),"full game ID set")
          extra={"opponent_literal","game_universe_state","source_checkpoint","source_row_order","source_result_token","literal_source_line","source_cohort_git_blob","source_row_json_sha256"}
          ck(set(a[next(iter(a))])-set(o[next(iter(o))])==extra,"eight exact carry columns")
          different=[]
          for gid,r in b.items():
              source=a[gid]
              previous=o[gid]
              for col,value in source.items():ck(r[col]==value,"Stage 1 authoritative source field "+gid+" "+col)
              for col,value in previous.items():
                  if col!="source_literal_line":ck(r[col]==value,"unauthorized Stage 2 alteration "+gid+" "+col)
              ck(r["source_opponent_label"]==source["opponent_literal"] and r["result"]==source["source_result_token"],"original opponent/outcome alias "+gid)
              if r["source_literal_line"]!=previous["source_literal_line"]:
                  ck(r["source_literal_line"].startswith(previous["source_literal_line"]+" | "),"not known split suffix "+gid)
                  different.append(gid)
          ck(len(different)==214,"exact 214 mechanical restorations")
          inventory=readcsv((p/"provenance-repair-inventory.csv").read_bytes())
          ck(len(inventory)==214 and {x["research_game_id"] for x in inventory}==set(different),"exact inventory")
          for fix in inventory:
              gid=fix["research_game_id"]
              ck(fix["field"]=="source_literal_line" and fix["before"]==o[gid]["source_literal_line"] and fix["after"]==b[gid]["source_literal_line"] and fix["cause"]=="PIPE_DELIMITED_RESULT_AND_SCORE_SUFFIX_TRUNCATED","inventory row "+gid)
          ck(collections.Counter(r["game_type"] for r in new)=={"REGULAR_SEASON":1043,"POSTSEASON":43},"types")
          ck(collections.Counter(r["result"] for r in new)=={"W":654,"L":431,"T":1},"outcomes")
          ck(all(r["site_type"]=="UNKNOWN" for r in new),"no unsupported site")
          ck(len([r for r in new if not r["team_score"] and not r["opponent_score"]])==5,"five blank score pairs")
          ck(len([r for r in new if r["result"]=="T"])==1,"one tie")
          index={r["source_opponent_label"]:r for r in mapping}
          counts=collections.Counter(r["source_opponent_label"] for r in new)
          ck(len(index)==len(counts)==341 and len({r["canonical_opponent_key"] for r in mapping})==203,"map identity")
          for label,num in counts.items():
              ck(label in index and int(index[label]["games_with_source_label"])==num,"map count "+label)
          for r in new:ck(r["canonical_opponent_key"]==index[r["source_opponent_label"]]["canonical_opponent_key"]==r["opponent_key"],"map identity "+r["research_game_id"])
          audit=json.loads((p/"full-population-parity-audit.json").read_text())
          ck(audit["after"]["source_field_mismatches"]==0 and audit["classification"]["rows"]==214 and audit["local_full_population_pre_certification"]=="PASS","local proof intact")
          state=json.loads((p/"research-status.json").read_text())
          ck(state["stage2_complete"] is True and state["stage3_started"] is False and state["immutable_research_base_sha"]==manifest["immutable_research_base_sha"],"Stage 2 boundary")
          with open("/tmp/sdsu-stage2-summary.txt","w") as out:out.write("SDSU STAGE 2 CERTIFIED: 1,086 game IDs; all 15 original Stage 1 fields match for every game; 214 provenance restorations verified; opponent labels 341, keys 203; stage 3 not started.\n")
          print(open("/tmp/sdsu-stage2-summary.txt").read())
          PY
      - name: Publish read-only certification summary
        shell: bash
        run: |
          cat /tmp/sdsu-stage2-summary.txt >> "$GITHUB_STEP_SUMMARY"
