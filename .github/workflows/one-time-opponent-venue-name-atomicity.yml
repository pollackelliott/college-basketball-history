name: One-time opponent venue name atomicity hardening
on:
  push:
    branches: [chore/opponent-identity-venue-name-atomicity]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/opponent-identity-venue-name-atomicity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch transaction, tests, and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tool=Path('tools/opponent_identity_bulk_transaction.py')
          text=tool.read_text()
          old='''import opponent_identity_transaction as tx\n'''
          new='''import opponent_identity_transaction as tx\nimport venue_reference\n'''
          assert old in text
          text=text.replace(old,new,1)

          old='''    return additions, sorted(set(blockers))\n\n\ndef _mapped_unknown_groups'''
          new='''    return additions, sorted(set(blockers))\n\n\ndef derive_venue_name_additions(\n    repo: Path, venue_additions: list[dict[str, str]]\n) -> tuple[list[dict[str, str]], list[str]]:\n    if not venue_additions:\n        return [], []\n    path = repo / "data/reference/venue-names.csv"\n    if not path.exists():\n        return [], ["venue registry additions requested but data/reference/venue-names.csv is missing"]\n    fields, existing = read_csv(path)\n    blockers: list[str] = []\n    missing = sorted(venue_reference.REQUIRED_NAME_COLUMNS - set(fields))\n    if missing:\n        return [], ["venue-names.csv missing columns: " + ", ".join(missing)]\n    existing_by_id: dict[str, list[dict[str, str]]] = defaultdict(list)\n    for row in existing:\n        existing_by_id[clean(row.get("venue_id"))].append(row)\n    additions: list[dict[str, str]] = []\n    for venue in venue_additions:\n        vid = clean(venue.get("venue_id"))\n        display = clean(venue.get("display_name"))\n        if existing_by_id.get(vid):\n            blockers.append(f"venue name addition {vid}: venue_id already appears in venue-names.csv")\n            continue\n        normalized = venue_reference.normalized_venue_name(display)\n        if not normalized:\n            blockers.append(f"venue name addition {vid}: display name cannot normalize to blank")\n            continue\n        row = {field: "" for field in fields}\n        row.update({\n            "venue_id": vid,\n            "venue_name": display,\n            "normalized_name": normalized,\n            "name_type": "PROJECT_DISPLAY",\n            "source_basis": clean(venue.get("source_basis")),\n            "notes": clean(venue.get("notes")),\n        })\n        additions.append(row)\n    return additions, sorted(set(blockers))\n\n\ndef _mapped_unknown_groups'''
          assert old in text
          text=text.replace(old,new,1)

          old='''    venue_additions, venue_blockers = load_venue_registry_additions(repo, resolutions_path.resolve())\n    blockers.extend(venue_blockers)\n    _, canonical_rows = read_csv(repo / "data/canonical/games.csv")\n'''
          new='''    venue_additions, venue_blockers = load_venue_registry_additions(repo, resolutions_path.resolve())\n    blockers.extend(venue_blockers)\n    venue_name_additions, venue_name_blockers = derive_venue_name_additions(repo, venue_additions)\n    blockers.extend(venue_name_blockers)\n    _, canonical_rows = read_csv(repo / "data/canonical/games.csv")\n'''
          assert old in text
          text=text.replace(old,new,1)

          old='''    if venue_additions:\n        fingerprints["venues.csv"] = sha_file(repo / "data/reference/venues.csv")\n'''
          new='''    if venue_additions:\n        fingerprints["venues.csv"] = sha_file(repo / "data/reference/venues.csv")\n        fingerprints["venue-names.csv"] = sha_file(repo / "data/reference/venue-names.csv")\n'''
          assert old in text
          text=text.replace(old,new,1)

          old='''        "venue_registry_additions": venue_additions,\n        "new_discrepancies": sorted(specs, key=lambda x: x["discrepancy_id"]),\n'''
          new='''        "venue_registry_additions": venue_additions,\n        "venue_name_additions": venue_name_additions,\n        "new_discrepancies": sorted(specs, key=lambda x: x["discrepancy_id"]),\n'''
          assert old in text
          text=text.replace(old,new,1)

          old='''    if plan["venue_registry_additions"]:\n        paths.append(repo / "data/reference/venues.csv")\n'''
          new='''    if plan["venue_registry_additions"]:\n        paths.append(repo / "data/reference/venues.csv")\n        paths.append(repo / "data/reference/venue-names.csv")\n'''
          assert old in text
          text=text.replace(old,new,1)

          old='''            tx.write_csv(vp, vf, vr)\n\n        cf, cr = read_csv(repo / "data/canonical/games.csv")\n'''
          new='''            tx.write_csv(vp, vf, vr)\n\n            vnp = repo / "data/reference/venue-names.csv"\n            vnf, vnr = read_csv(vnp)\n            existing_name_ids = {clean(r.get("venue_id")) for r in vnr}\n            for addition in plan["venue_name_additions"]:\n                if addition["venue_id"] in existing_name_ids:\n                    raise BulkTransactionError("venue-name registry changed after plan sealing")\n                vnr.append(dict(addition))\n                existing_name_ids.add(addition["venue_id"])\n            tx.write_csv(vnp, vnf, vnr)\n\n        cf, cr = read_csv(repo / "data/canonical/games.csv")\n'''
          assert old in text
          text=text.replace(old,new,1)

          old='''            for addition in plan["venue_registry_additions"]:\n                row = by_id.get(addition["venue_id"])\n                if not row or any(clean(row.get(field)) != clean(addition.get(field)) for field in addition):\n                    raise BulkTransactionError(f"postcondition: venue addition {addition['venue_id']} missing or changed")\n\n        retained = set(plan["retained_distinct_canonical_game_ids"])\n'''
          new='''            for addition in plan["venue_registry_additions"]:\n                row = by_id.get(addition["venue_id"])\n                if not row or any(clean(row.get(field)) != clean(addition.get(field)) for field in addition):\n                    raise BulkTransactionError(f"postcondition: venue addition {addition['venue_id']} missing or changed")\n            _, final_names = read_csv(repo / "data/reference/venue-names.csv")\n            for addition in plan["venue_name_additions"]:\n                matches = [r for r in final_names if clean(r.get("venue_id")) == addition["venue_id"]]\n                if len(matches) != 1 or any(\n                    clean(matches[0].get(field)) != clean(addition.get(field)) for field in addition\n                ):\n                    raise BulkTransactionError(\n                        f"postcondition: venue name addition {addition['venue_id']} missing, duplicated, or changed"\n                    )\n\n        retained = set(plan["retained_distinct_canonical_game_ids"])\n'''
          assert old in text
          text=text.replace(old,new,1)

          old='''        "venue_registry_additions": len(plan["venue_registry_additions"]),\n    }\n'''
          new='''        "venue_registry_additions": len(plan["venue_registry_additions"]),\n        "venue_name_additions": len(plan["venue_name_additions"]),\n    }\n'''
          assert old in text
          text=text.replace(old,new,1)
          tool.write_text(text)

          test=Path('tests/test_opponent_identity_bulk_transaction.py')
          text=test.read_text()
          old='''import unittest\nfrom pathlib import Path\n'''
          new='''import unittest\nfrom pathlib import Path\nfrom unittest import mock\n'''
          assert old in text
          text=text.replace(old,new,1)
          old="""VENUE_HEADERS = ['venue_id','venue_key','display_name','city','state','opened','closed','date_precision','identity_status','source_basis','notes']\n"""
          new="""VENUE_HEADERS = ['venue_id','venue_key','display_name','city','state','opened','closed','date_precision','identity_status','source_basis','notes']\nVENUE_NAME_HEADERS = ['venue_id','venue_name','normalized_name','name_type','valid_from','valid_to','date_precision','source_basis','notes']\n"""
          assert old in text
          text=text.replace(old,new,1)
          old='''        self._write(self.repo/'data/reference/venues.csv',VENUE_HEADERS,[[\n            'VEN-000001','known-gym','Known Gym','Known City','ST','','','','TEST','fixture',''\n        ]])\n        stale=game('CBBG-9','old-target',site='TEAM_A_HOME',home='alpha',venue='known-gym',city='Alpha City')\n'''
          new='''        self._write(self.repo/'data/reference/venues.csv',VENUE_HEADERS,[[\n            'VEN-000001','known-gym','Known Gym','Known City','ST','','','','TEST','fixture',''\n        ]])\n        self._write(self.repo/'data/reference/venue-names.csv',VENUE_NAME_HEADERS,[[\n            'VEN-000001','Known Gym','knowngym','PROJECT_DISPLAY','','','','fixture',''\n        ]])\n        stale=game('CBBG-9','old-target',site='TEAM_A_HOME',home='alpha',venue='known-gym',city='Alpha City')\n'''
          assert old in text
          text=text.replace(old,new,1)
          old='''        self.assertEqual(plan['venue_registry_additions'],[venue])\n        result=bulk.apply(self.repo,self.manifest,self.resolutions,plan['plan_sha256'],run_validation=False)\n        self.assertEqual(result['venue_registry_additions'],1)\n        venues=self._read(self.repo/'data/reference/venues.csv')\n        self.assertEqual(venues[-1]['venue_id'],'VEN-000002')\n'''
          new='''        self.assertEqual(plan['venue_registry_additions'],[venue])\n        expected_name={\n            'venue_id':'VEN-000002','venue_name':'New Neutral Complex','normalized_name':'newneutralcomplex',\n            'name_type':'PROJECT_DISPLAY','valid_from':'','valid_to':'','date_precision':'',\n            'source_basis':'official tournament evidence','notes':'fixture'\n        }\n        self.assertEqual(plan['venue_name_additions'],[expected_name])\n        result=bulk.apply(self.repo,self.manifest,self.resolutions,plan['plan_sha256'],run_validation=False)\n        self.assertEqual(result['venue_registry_additions'],1)\n        self.assertEqual(result['venue_name_additions'],1)\n        venues=self._read(self.repo/'data/reference/venues.csv')\n        self.assertEqual(venues[-1]['venue_id'],'VEN-000002')\n        names=self._read(self.repo/'data/reference/venue-names.csv')\n        self.assertEqual(names[-1],expected_name)\n'''
          assert old in text
          text=text.replace(old,new,1)
          marker='''    def test_grouped_package_scope_preserves_multiple_literal_labels(self):\n'''
          addition='''    def test_venue_and_project_display_name_roll_back_together(self):\n        self._manifest()\n        self._write(self.repo/'data/reference/venues.csv',VENUE_HEADERS,[[\n            'VEN-000001','known-gym','Known Gym','Known City','ST','','','','TEST','fixture',''\n        ]])\n        self._write(self.repo/'data/reference/venue-names.csv',VENUE_NAME_HEADERS,[[\n            'VEN-000001','Known Gym','knowngym','PROJECT_DISPLAY','','','','fixture',''\n        ]])\n        self._write(self.repo/'data/canonical/games.csv',CANONICAL_HEADERS,[\n            game('CBBG-9','old-target',site='TEAM_A_HOME',home='alpha',venue='known-gym',city='Alpha City'),\n            game('CBBG-2','target',site='NEUTRAL',home='',venue='',city='')\n        ])\n        self._write(self.repo/'data/evidence/game-assertions.csv',ASSERTION_HEADERS,[\n            ['A1','CBBG-9','alpha','SRC-1','old-target'],['A2','CBBG-2','target','T-1','alpha']\n        ])\n        venue={'venue_id':'VEN-000002','venue_key':'new-neutral-complex','display_name':'New Neutral Complex','city':'Neutral City','state':'PR','opened':'','closed':'','date_precision':'','identity_status':'RESEARCHED_TEST','source_basis':'official tournament evidence','notes':'fixture'}\n        self._resolution(pairs=[{\n            'resolution_id':'PAIR-VENUE-ROLLBACK','kind':'EXPLICIT_RECONCILIATION',\n            'survivor_canonical_game_id':'CBBG-9','absorbed_canonical_game_id':'CBBG-2',\n            'canonical_values':{'site_type':'NEUTRAL','venue_key':'new-neutral-complex','venue_id':'VEN-000002','site_city':'Neutral City','site_state':'PR'},\n            'canonical_clear_fields':['designated_home_team_key'],\n            'resolution_basis':'reviewed venue evidence','evidence_urls':[],'discrepancies':[]\n        }],venues=[venue])\n        plan=bulk.build_plan(self.repo,self.manifest,self.resolutions)\n        self.assertEqual(plan['blockers'],[])\n        venue_before=(self.repo/'data/reference/venues.csv').read_bytes()\n        names_before=(self.repo/'data/reference/venue-names.csv').read_bytes()\n        with mock.patch.object(bulk,'_run_validation',side_effect=bulk.BulkTransactionError('forced validation failure')):\n            with self.assertRaisesRegex(bulk.BulkTransactionError,'forced validation failure'):\n                bulk.apply(self.repo,self.manifest,self.resolutions,plan['plan_sha256'],run_validation=True)\n        self.assertEqual((self.repo/'data/reference/venues.csv').read_bytes(),venue_before)\n        self.assertEqual((self.repo/'data/reference/venue-names.csv').read_bytes(),names_before)\n\n'''
          assert marker in text
          text=text.replace(marker,addition+marker,1)
          test.write_text(text)

          doc=Path('docs/opponent-identity-bulk-remediation.md')
          text=doc.read_text()
          old='''- `venue_registry_additions` (optional): full rows for newly researched physical venues required by an explicit reconciliation. Additions are sealed with the plan, must use the next sequential global `VEN-` IDs, are checked for key/ID collisions, and are committed or rolled back atomically with the game reconciliation.\n'''
          new='''- `venue_registry_additions` (optional): full rows for newly researched physical venues required by an explicit reconciliation. Additions are sealed with the plan, must use the next sequential global `VEN-` IDs, and are checked for key/ID collisions. The transaction deterministically derives and seals exactly one matching `PROJECT_DISPLAY` row in `venue-names.csv` for every new venue, fingerprints both registries, and commits or rolls back both rows atomically with the game reconciliation.\n'''
          assert old in text
          doc.write_text(text.replace(old,new,1))
          PY

          python -m py_compile tools/opponent_identity_bulk_transaction.py
          python -m unittest tests.test_opponent_identity_bulk_transaction -v
          python -m unittest tests.test_opponent_identity_transaction -v
          python -m unittest discover -s tests -v

          rm .github/workflows/one-time-opponent-venue-name-atomicity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/opponent_identity_bulk_transaction.py tests/test_opponent_identity_bulk_transaction.py docs/opponent-identity-bulk-remediation.md .github/workflows/one-time-opponent-venue-name-atomicity.yml
          git commit -m 'Seal venue display names with bulk transactions'
          git push origin HEAD:chore/opponent-identity-venue-name-atomicity
