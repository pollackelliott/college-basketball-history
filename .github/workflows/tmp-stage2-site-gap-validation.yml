name: Temporary Stage 2 site-gap validation

on:
  push:
    branches:
      - tooling/stage2-reciprocal-site-gap-provenance

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused regression suite
        run: python -m unittest discover -s tests -p 'test_stage2_reciprocal_only_site_gap_provenance.py' -v
      - name: Existing site reconciliation regression suites
        run: |
          python -m unittest discover -s tests -p 'test_implementation_site_review_accounting.py' -v
          python -m unittest discover -s tests -p 'test_onboarding_site_reconciliation_provenance.py' -v
          python -m unittest discover -s tests -p 'test_implementation_site_gate.py' -v
      - name: Full repository test suite
        run: python -m unittest discover -s tests -v
