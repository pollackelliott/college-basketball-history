name: Temporary Stage 2 candidate dispatch bridge

on:
  push:
    branches:
      - tooling/stage2-reciprocal-site-gap-provenance

permissions:
  contents: read
  actions: write

jobs:
  dispatch-after-helper-removal:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository-owned candidate rehearsal only after helper removal
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_COMMIT: 18b1e726b13a8ad2232a02131a4ce265b46b4cf3
          PROPOSAL_CHECKPOINT_PATH: .remote-implementation/checkpoints/george-washington/george-washington-stage2-proposal-0001/checkpoint-manifest.json
          CANDIDATE_BRANCH: tooling/stage2-reciprocal-site-gap-provenance
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_BRANCH" --jq '.object.sha')"
          helper_path=".github/workflows/tmp-stage2-site-gap-validation.yml"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$helper_path?ref=$candidate_sha" >/dev/null 2>&1; then
            echo "Temporary dispatch bridge is still present at $candidate_sha." >&2
            echo "Delete it from the candidate branch, then rerun this failed job." >&2
            exit 1
          fi
          gh workflow run stage2-candidate-runtime-rehearsal.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "candidate_sha=$candidate_sha" \
            -f "control_commit=$CONTROL_COMMIT" \
            -f "proposal_checkpoint_path=$PROPOSAL_CHECKPOINT_PATH"
          echo "Dispatched exact candidate runtime rehearsal for $candidate_sha"
