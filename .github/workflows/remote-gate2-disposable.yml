name: Disposable real LIU Gate 2 authority check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  deployments: read

jobs:
  liu-gate2-dry-run:
    if: github.event.pull_request.head.ref == 'tooling/remote-gate2-production-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate actual LIU Preview and fresh verification without mutating
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/disposable_gate2_liu.py

# REMOVE after successful one-shot proof, before production merge.
