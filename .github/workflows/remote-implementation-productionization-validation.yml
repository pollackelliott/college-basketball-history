name: Remote Implementation productionization validation

on:
  push:
    branches:
      - tooling/remote-implementation-control-plane

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile remote Implementation tools
        run: |
          python -m py_compile             tools/remote_implementation_control.py             tools/remote_implementation_io.py             tools/remote_implementation_runner.py             tools/remote_implementation_verify.py
      - name: Run remote control-plane tests
        run: python -m unittest discover -s tests -p 'test_remote_implementation_control.py' -v
