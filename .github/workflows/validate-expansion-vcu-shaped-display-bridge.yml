              "stage2_reconciliation_diagnostic": False,
              "stage2_sealed_apply": False,
              "venue_identity_maintenance": False,
          }
          template = {
              "schema_version": 1,
              "kind": "REMOTE_IMPLEMENTATION_REQUEST",
              "request_id": "miami-expansion-stage2-opponent-display-isolated-vcu-bridge-0001",
              "school_key": "miami",
              "operation": "STAGE2_OPPONENT_DISPLAY_NORMALIZE",
              "expected_protected_main_sha": "19dc85c18902234c2241e39d3ba34006d2903e80",
              "target_branch": "data/miami-onboarding",
              "target_sha": census["target_sha"],
              "integration_freeze_sha256": census["integration_freeze_sha256"],
              "semantic_snapshot_sha256": census["semantic_snapshot_sha256"],
              "stage2_census_checkpoint": {
                  "path": checkpoint.relative_to(control).as_posix(),
                  "sha256": hashlib.sha256(checkpoint.read_bytes()).hexdigest(),
              },
              "creation_provenance": {
                  "origin": "Control Center isolated VCU-shaped expansion bridge proof",
                  "authorization": (
                      "Validation-only use of the existing census-bound "
                      "STAGE2_OPPONENT_DISPLAY_NORMALIZE path for the exact "
                      "single rio-grande blocker population."
                  ),
              },
              "authority": flags,
          }
          Path("/tmp/vcu-shaped-expansion-bridge/stage2-normalize-template.json").write_text(
              json.dumps(template, indent=2, sort_keys=True) + "\n"
          )
          PY

          env -u GITHUB_ACTIONS -u GITHUB_SHA             python "$GITHUB_WORKSPACE/runtime/tools/remote_implementation_request_submit.py"               --repo control               --template /tmp/vcu-shaped-expansion-bridge/stage2-normalize-template.json               --submit               | tee /tmp/vcu-shaped-expansion-bridge/stage2-normalize-submit.json

          latest_control="$(git --git-dir="$GITHUB_WORKSPACE/isolated-origin.git" rev-parse refs/heads/control/remote-implementation)"
          git -C control fetch --no-tags origin             "+refs/heads/control/remote-implementation:refs/remotes/origin/remote-control"
          git -C control reset --hard "$latest_control"

      - name: Run isolated existing Stage 2 display normalization and verifier
        shell: bash
        env:
          GITHUB_REPOSITORY: pollackelliott/college-basketball-history
          GITHUB_RUN_ID: '991005'
          GITHUB_RUN_ATTEMPT: '1'
        run: |
          set -euo pipefail
          phase0_target="$(cat /tmp/runner-target-head)"
          export REMOTE_IMPLEMENTATION_DIAG=/tmp/vcu-shaped-expansion-bridge/stage2-normalize-runner-diag
          (
            cd control
            env -u GITHUB_SHA python "$GITHUB_WORKSPACE/runtime/tools/remote_implementation_runner.py"               | tee /tmp/vcu-shaped-expansion-bridge/stage2-normalize-runner.log
          )

          normalized_target="$(git --git-dir="$GITHUB_WORKSPACE/isolated-origin.git" rev-parse refs/heads/data/miami-onboarding)"
          test "$normalized_target" != "$phase0_target"
          echo "$normalized_target" > /tmp/normalized-target-head

          latest_control="$(git --git-dir="$GITHUB_WORKSPACE/isolated-origin.git" rev-parse refs/heads/control/remote-implementation)"
          git -C control fetch --no-tags origin             "+refs/heads/control/remote-implementation:refs/remotes/origin/remote-control"
          git -C control reset --hard "$latest_control"

          # Production fresh verification runs in a separate clean job checkout.
          # Clear validation-runner-only local worktree branches before reusing this
          # checkout so the verifier sees the same fresh branch namespace.
          git -C runtime worktree prune
          while IFS= read -r local_branch; do
            local_branch="${local_branch#  }"
            local_branch="${local_branch#* }"
            if [[ -n "$local_branch" ]]; then
              git -C runtime branch -D "$local_branch"
            fi
          done < <(git -C runtime branch --list 'remote-stage2-*')

          export REMOTE_IMPLEMENTATION_DIAG=/tmp/vcu-shaped-expansion-bridge/stage2-normalize-verifier-diag
          (
            cd control
            env -u GITHUB_SHA python "$GITHUB_WORKSPACE/runtime/tools/remote_implementation_verify.py"               | tee /tmp/vcu-shaped-expansion-bridge/stage2-normalize-verifier.log
          )

          latest_control="$(git --git-dir="$GITHUB_WORKSPACE/isolated-origin.git" rev-parse refs/heads/control/remote-implementation)"
          git -C control fetch --no-tags origin             "+refs/heads/control/remote-implementation:refs/remotes/origin/remote-control"
          git -C control reset --hard "$latest_control"

          python - <<'PY'
          import json
          from pathlib import Path

          control = Path("control")
          request_id = "miami-expansion-stage2-opponent-display-isolated-vcu-bridge-0001"
          verification_path = (
              control / ".remote-implementation" / "verifications" / "miami"
              / request_id / "stage2-opponent-display-verification.json"
          )
          verification = json.loads(verification_path.read_text())
          assert verification["remote_stage2_opponent_display_equivalence"] == "PASS", verification
          assert verification["semantic_drift"] == "PASS", verification
          assert verification["stage2_status"] == "CAPABILITY_CENSUS_READY", verification
          assert verification["expected_blocker_keys"] == ["rio-grande"], verification
          assert sorted(verification["changed_paths"]) == [
              "schools/miami/opponents.csv",
              "schools/miami/source-games.csv",
          ], verification

          writeahead = (
              control / ".remote-implementation" / "writeahead" / "miami"
              / request_id / "field-level-proof.json"
          )
          proof = json.loads(writeahead.read_text())
          assert proof["opponent_changed_keys"] == ["rio-grande"], proof
          assert proof["source_game_changed_keys"] == ["rio-grande"], proof
          assert proof["opponent_key_changes"] == 0, proof
          assert proof["source_game_non_name_field_changes"] == 0, proof
          assert proof["literal_evidence_changes"] == 0, proof

          summary = {
              "status": "PASS",
              "candidate_sha": "91106d9bb1850014fde80b577e3ebac67310bfef",
              "protected_main_sha": "19dc85c18902234c2241e39d3ba34006d2903e80",
              "phase0_fresh_verification": "PASS",
              "stage2_initial_status": "BLOCKED_SINGLE_RIO_GRANDE_DISPLAY",
              "stage2_normalization_equivalence": "PASS",
              "stage2_final_status": verification["stage2_status"],
              "normalized_target_sha": Path("/tmp/normalized-target-head").read_text().strip(),
              "live_control_mutation": "NONE",
              "live_miami_mutation": "NONE",
          }
          Path("/tmp/vcu-shaped-expansion-bridge/final-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Reauthenticate live repository untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C observer fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/live-main" \
            "+refs/heads/control/remote-implementation:refs/remotes/origin/live-control" \
            "+refs/heads/data/miami-onboarding:refs/remotes/origin/live-miami"
          test "$(git -C observer rev-parse refs/remotes/origin/live-main)" = "19dc85c18902234c2241e39d3ba34006d2903e80"
          test "$(git -C observer rev-parse refs/remotes/origin/live-control)" = "9f151e5c478da2ceccc6c1fadf0e3a3b50b14d58"
          test "$(git -C observer rev-parse refs/remotes/origin/live-miami)" = "817197e3410a893bd1f481d4cce5aa630cc1c7e3"

