name: Clemson Gate 1 execution

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write
  deployments: read
  pull-requests: write
  statuses: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Clemson onboarding branch
        uses: actions/checkout@v4
        with:
          ref: data/clemson-onboarding
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Execute approved Clemson Gate 1 through release preparation
        shell: bash
        run: |
          set -eo pipefail

          EXPECTED_MAIN="6c48d7dc510fd318c35344c37dc21f2c2f45e59c"
          EXPECTED_HEAD="a1b768ec6581c7a7329ca987401ec80f15d694e1"
          EXPECTED_DECISION_SHA="9dd32a7e5233843d23b55f92e9e14aa7210b35ccd23b54dc2f845eaadcd93923"
          EXPECTED_MAP_SHA="87cc2241664b4dea9f03fd0a87d3da188061c6f41533f8947ab32de2c6942c38"

          test "$(git branch --show-current)" = "data/clemson-onboarding"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain --untracked-files=all)"

          mkdir -p .onboarding/clemson

          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from integration_freeze_guard import (
              build_source_game_semantic_snapshot,
              semantic_snapshot_sha256,
          )
          expected = "f6f3d62adeac4a497e45944c142e20e85a56289974f2c0b75d40f79521c5aca1"
          source = Path("schools/clemson/source-games.csv")
          snapshot = build_source_game_semantic_snapshot(source)
          actual = semantic_snapshot_sha256(snapshot)
          if actual != expected:
              raise SystemExit(f"semantic freeze mismatch: {actual} != {expected}")
          Path(".onboarding/clemson/integration-freeze.json").write_text(
              json.dumps(
                  {
                      "schema_version": 2,
                      "school_key": "clemson",
                      "status": "INTEGRATION_FROZEN",
                      "research_base_sha": "e57a7049b2315508e59fd68b4324c34050901f45",
                      "integration_base_sha": "de4ccb88fc5550b66b514841000b1c5e04bd93f5",
                      "origin_main_sha": "de4ccb88fc5550b66b514841000b1c5e04bd93f5",
                      "source_game_semantic_guard": {
                          "schema_version": 1,
                          "snapshot_sha256": actual,
                          "snapshot": snapshot,
                      },
                  },
                  indent=2,
                  ensure_ascii=False,
              ) + "\n",
              encoding="utf-8",
          )
          print("SEMANTIC_FREEZE_SHA256=" + actual)
          PY

          curl -L --fail \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10951573507/zip" \
            -o /tmp/clemson-map-artifact.zip
          unzip -p /tmp/clemson-map-artifact.zip recommendation-map.json \
            > .onboarding/clemson/recommendation-map.json

          MAP_SHA="$(sha256sum .onboarding/clemson/recommendation-map.json | awk '{print $1}')"
          echo "RECOMMENDATION_MAP_SHA256=$MAP_SHA"
          test "$MAP_SHA" = "$EXPECTED_MAP_SHA"

          python tools/implementation_stage2.py clemson \
            --map .onboarding/clemson/recommendation-map.json

          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path(".onboarding/clemson/implementation-stage2-status.json").read_text())
          assert s["status"]=="OWNER_GATE_1_READY", s
          assert s["preflight"]["decision_count"]==160, s
          assert s["preflight"]["decision_universe_sha256"]=="9dd32a7e5233843d23b55f92e9e14aa7210b35ccd23b54dc2f845eaadcd93923", s
          assert s["recommendation_map"]["decision_count"]==160, s
          assert s["recommendation_map"]["sha256"]=="87cc2241664b4dea9f03fd0a87d3da188061c6f41533f8947ab32de2c6942c38", s
          print("STAGE2_REVALIDATION=OWNER_GATE_1_READY")
          PY

          python tools/onboarding_hardening.py fill-review clemson \
            --map .onboarding/clemson/recommendation-map.json

          python tools/onboarding_hardening.py rehearse-review clemson

          python tools/onboard_school.py clemson --approve --approved-by "Elliott"

          APPROVED_HASH="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path(".onboarding/clemson/approved-plan.json").read_text())["approved_plan_hash"])
          PY
          )"
          echo "APPROVED_PLAN_HASH=$APPROVED_HASH"

          python tools/onboard_school.py clemson \
            --apply \
            --approved-plan "$APPROVED_HASH"

          python tools/onboard_school.py clemson --verify

          python tools/release_school.py clemson --prepare --deployment-timeout 900

          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path(".onboarding/clemson/release-state.json").read_text())
          print("RELEASE_HEAD_SHA="+state["head_sha"])
          print("RELEASE_PR_NUMBER="+str(state["pr_number"]))
          print("RELEASE_PR_URL="+state["pr_url"])
          print("PREVIEW_URL="+str(state.get("preview_deployment",{}).get("environment_url","")))
          print("APPROVED_PLAN_HASH="+state["approved_plan_hash"])
          print("CHANGED_PATH_COUNT="+str(len(state.get("changed_paths",[]))))
          PY

      - name: Upload Clemson Gate 1 execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clemson-gate1-execution
          include-hidden-files: true
          path: |
            .onboarding/clemson/approved-plan.json
            .onboarding/clemson/approved-review.md
            .onboarding/clemson/release-manifest.json
            .onboarding/clemson/release-state.json
            .onboarding/clemson/visual-qa.md
            .onboarding/clemson/implementation-stage2-status.json
            .onboarding/clemson/last-rehearsal-site-gate.json
          if-no-files-found: warn
