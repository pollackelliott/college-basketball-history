name: Alabama correction micro stage 0002

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/alabama-correction-micro-stage-0002.yml

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact transport head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: transport

      - name: Authenticate transport, correction branch, and global control
        shell: bash
        run: |
          set -euo pipefail
          cd transport
          expected_main="50e834f05952a70f8e8fee3c7aee92994e252dc8"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/data/alabama-correction:refs/remotes/origin/data/alabama-correction" \
            "+refs/heads/control/remote-implementation:refs/remotes/origin/control/remote-implementation"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$expected_main" ]] || { echo "protected main moved" >&2; exit 1; }
          [[ "$(git rev-parse refs/remotes/origin/data/alabama-correction)" == "$expected_main" ]] || { echo "correction branch is not exact current main" >&2; exit 1; }
          changed="$(git diff --name-only "$expected_main"..HEAD)"
          [[ "$changed" == ".github/workflows/alabama-correction-micro-stage-0002.yml" ]] || { echo "unexpected transport paths:" >&2; printf '%s\n' "$changed" >&2; exit 1; }
          python - <<'PY'
          import json, subprocess
          raw=subprocess.check_output(["git","show","refs/remotes/origin/control/remote-implementation:.remote-implementation/control-state.json"],text=True)
          s=json.loads(raw)
          if s.get("lifecycle_state")!="IDLE" or s.get("transaction_state")!="COMPLETE" or s.get("recovery_required") is not False:
              raise SystemExit("global control is not IDLE/COMPLETE")
          active={k:v for k,v in s.items() if k.startswith("active_") and v not in (None,"",False,[],{})}
          if active: raise SystemExit(f"global control has active state: {active}")
          print("GLOBAL_CONTROL_IDLE_COMPLETE_PASS")
          PY

      - name: Check out clean correction branch
        uses: actions/checkout@v4
        with:
          ref: data/alabama-correction
          fetch-depth: 0
          path: staging

      - name: Download exact frozen correction authority
        uses: actions/download-artifact@v4
        with:
          name: alabama-correction-freeze-0001
          run-id: 44533730742
          github-token: ${{ github.token }}
          path: /tmp/alabama-freeze-artifact

      - name: Authenticate frozen correction ZIP
        shell: bash
        run: |
          set -euo pipefail
          freeze="/tmp/alabama-freeze-artifact/alabama-correction-research-frozen.zip"
          [[ -f "$freeze" ]] || { echo "frozen correction ZIP missing" >&2; exit 1; }
          actual="$(sha256sum "$freeze" | awk '{print $1}')"
          [[ "$actual" == "5ff6b1754e7834819250cfe0bc2903c14f534b256f20b1336977bfe9a369e1f5" ]] || { echo "freeze SHA mismatch: $actual" >&2; exit 1; }
          python - <<'PY'
          import json, zipfile
          p="/tmp/alabama-freeze-artifact/alabama-correction-research-frozen.zip"
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read("correction-freeze.json"))
          expected={
            "status":"CORRECTION_RESEARCH_FROZEN",
            "workflow_kind":"POST_PUBLICATION_CORRECTION",
            "school_key":"alabama",
            "research_base_sha":"41766e0da09c7d703a8b5a753a386c9ba6cd2fa2",
            "scope":"field-correction",
            "correction_mode":"SOURCE_GAME_DELTA",
            "correction_diff_sha256":"27de1f754a247f273498f8cdc89ced58959f90e764501223ed6496ad95229154",
            "correction_source_game_ids":["ALARAW-01436"],
          }
          for k,v in expected.items():
              if m.get(k)!=v: raise SystemExit(f"freeze manifest mismatch for {k}: {m.get(k)!r}")
          if m.get("research_authority")!={"ref":"miami-expansion-stage6-complete-0034","digest":"56bf810b7879ce077e7d77091f876674d28df5ed8df088b5df5d2c1555e11978"}:
              raise SystemExit("freeze research authority mismatch")
          print("FROZEN_CORRECTION_AUTHORITY_PASS")
          PY

      - name: Dry-run permanent current-main micro stage
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/data/alabama-correction:refs/remotes/origin/data/alabama-correction"
          [[ "$(git rev-parse HEAD)" == "50e834f05952a70f8e8fee3c7aee92994e252dc8" ]] || { echo "staging HEAD is not exact current main" >&2; exit 1; }
          [[ "$(git rev-parse refs/remotes/origin/main)" == "50e834f05952a70f8e8fee3c7aee92994e252dc8" ]] || { echo "main moved before dry run" >&2; exit 1; }
          [[ "$(git rev-parse refs/remotes/origin/data/alabama-correction)" == "50e834f05952a70f8e8fee3c7aee92994e252dc8" ]] || { echo "correction branch moved before dry run" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { git status --short >&2; exit 1; }
          python tools/correction_lifecycle.py stage alabama \
            /tmp/alabama-freeze-artifact/alabama-correction-research-frozen.zip \
            --expected-sha256 5ff6b1754e7834819250cfe0bc2903c14f534b256f20b1336977bfe9a369e1f5 \
            --micro-correction | tee /tmp/alabama-micro-dry-run.txt

      - name: Apply, validate, commit, and authenticate MICRO_CORRECTION_READY
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          git config user.name "College Basketball History Automation"
          git config user.email "actions@users.noreply.github.com"
          python tools/correction_lifecycle.py stage alabama \
            /tmp/alabama-freeze-artifact/alabama-correction-research-frozen.zip \
            --expected-sha256 5ff6b1754e7834819250cfe0bc2903c14f534b256f20b1336977bfe9a369e1f5 \
            --apply --commit --micro-correction | tee /tmp/alabama-micro-apply.txt
          stage_commit="$(git rev-parse HEAD)"
          [[ "$(git rev-parse HEAD^)" == "50e834f05952a70f8e8fee3c7aee92994e252dc8" ]] || { echo "micro commit parent mismatch" >&2; exit 1; }
          cp .onboarding/alabama/integration-freeze.json /tmp/alabama-integration-freeze.json
          cp .onboarding/alabama/micro-correction-ready.json /tmp/alabama-micro-correction-ready.json
          sha256sum /tmp/alabama-integration-freeze.json | tee /tmp/alabama-integration-freeze.json.sha256
          sha256sum /tmp/alabama-micro-correction-ready.json | tee /tmp/alabama-micro-correction-ready.json.sha256
          printf '%s\n' "$stage_commit" > /tmp/alabama-micro-stage-commit.txt
          git diff-tree --no-commit-id --name-only -r HEAD^ HEAD | sort | tee /tmp/alabama-micro-changed-paths.txt
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          ready=json.loads(Path("/tmp/alabama-micro-correction-ready.json").read_text())
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          expected={
            "status":"MICRO_CORRECTION_READY",
            "kind":"POST_PUBLICATION_MICRO_CORRECTION_READY",
            "school_key":"alabama",
            "micro_correction_class":"ONE_GAME_IDENTITY_NORMALIZATION",
            "origin_main_sha":"50e834f05952a70f8e8fee3c7aee92994e252dc8",
            "target_branch":"data/alabama-correction",
            "target_sha":head,
            "correction_freeze_sha256":"5ff6b1754e7834819250cfe0bc2903c14f534b256f20b1336977bfe9a369e1f5",
            "correction_diff_sha256":"27de1f754a247f273498f8cdc89ced58959f90e764501223ed6496ad95229154",
            "correction_source_game_ids":["ALARAW-01436"],
            "owner_approval_model":"SINGLE_EXACT_PREVIEW_APPROVAL",
            "stage2_required":False,
            "owner_gate_1_required":False,
            "sealed_apply_required":False,
          }
          for k,v in expected.items():
              if ready.get(k)!=v: raise SystemExit(f"ready mismatch for {k}: {ready.get(k)!r}")
          changed=set(ready.get("changed_paths") or [])
          required={
            "schools/alabama/source-games.csv",
            "schools/alabama/opponents.csv",
            "data/canonical/games.csv",
            "data/evidence/game-assertions.csv",
          }
          if not required.issubset(changed): raise SystemExit(f"required micro paths missing: {sorted(required-changed)}")
          bad=[p for p in changed if p not in required and p!="data/reconciliation/discrepancies.csv" and not p.startswith("site/data/")]
          if bad: raise SystemExit(f"unauthorized micro paths: {bad}")
          if ready.get("research_authority")!={"ref":"miami-expansion-stage6-complete-0034","digest":"56bf810b7879ce077e7d77091f876674d28df5ed8df088b5df5d2c1555e11978"}:
              raise SystemExit("ready research authority mismatch")
          print(json.dumps(ready,sort_keys=True))
          PY

      - name: Reauthenticate global control immediately before correction-branch CAS
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/data/alabama-correction:refs/remotes/origin/data/alabama-correction" \
            "+refs/heads/control/remote-implementation:refs/remotes/origin/control/remote-implementation"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "50e834f05952a70f8e8fee3c7aee92994e252dc8" ]] || { echo "main moved before publication" >&2; exit 1; }
          [[ "$(git rev-parse refs/remotes/origin/data/alabama-correction)" == "50e834f05952a70f8e8fee3c7aee92994e252dc8" ]] || { echo "correction branch moved before publication" >&2; exit 1; }
          python - <<'PY'
          import json, subprocess
          raw=subprocess.check_output(["git","show","refs/remotes/origin/control/remote-implementation:.remote-implementation/control-state.json"],text=True)
          s=json.loads(raw)
          if s.get("lifecycle_state")!="IDLE" or s.get("transaction_state")!="COMPLETE" or s.get("recovery_required") is not False:
              raise SystemExit("global control no longer safely IDLE/COMPLETE")
          active={k:v for k,v in s.items() if k.startswith("active_") and v not in (None,"",False,[],{})}
          if active: raise SystemExit(f"global control acquired active state: {active}")
          print("GLOBAL_SERIALIZATION_REAUTH_PASS")
          PY

      - name: Publish exact MICRO_CORRECTION_READY commit by predecessor CAS
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          staged="$(git rev-parse HEAD)"
          git push --force-with-lease=refs/heads/data/alabama-correction:50e834f05952a70f8e8fee3c7aee92994e252dc8 origin HEAD:refs/heads/data/alabama-correction
          git fetch --no-tags origin "+refs/heads/data/alabama-correction:refs/remotes/origin/data/alabama-correction"
          actual="$(git rev-parse refs/remotes/origin/data/alabama-correction)"
          [[ "$actual" == "$staged" ]] || { echo "published correction branch mismatch: $actual" >&2; exit 1; }
          printf '%s\n' "$actual" | tee /tmp/published-correction-head.txt

      - name: Verify published micro-correction commit
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          published="$(cat /tmp/published-correction-head.txt)"
          git reset --hard "$published"
          python tools/validate_data.py | tee /tmp/published-validate-data.txt
          python tools/build_site_data.py . --check | tee /tmp/published-build-site-check.txt
          [[ "$(git status --porcelain --untracked-files=all)" == "" ]] || { echo "published micro correction is not reproducibly clean" >&2; git status --short >&2; exit 1; }
          echo "PUBLISHED_MICRO_CORRECTION_EQUIVALENCE_PASS"

      - name: Upload MICRO_CORRECTION_READY authority
        uses: actions/upload-artifact@v4
        with:
          name: alabama-micro-correction-ready-0002
          path: |
            /tmp/alabama-integration-freeze.json
            /tmp/alabama-integration-freeze.json.sha256
            /tmp/alabama-micro-correction-ready.json
            /tmp/alabama-micro-correction-ready.json.sha256
            /tmp/alabama-micro-stage-commit.txt
            /tmp/published-correction-head.txt
            /tmp/alabama-micro-changed-paths.txt
            /tmp/alabama-micro-dry-run.txt
            /tmp/alabama-micro-apply.txt
            /tmp/published-validate-data.txt
            /tmp/published-build-site-check.txt
          if-no-files-found: error
          retention-days: 30
