name: Fordham historical-accounting candidate proof filtered

on:
  push:
    branches:
      - proof3/fordham-accounting-505

permissions:
  contents: read

jobs:
  rehearse-candidate-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact control authority without checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --single-branch             --branch control/remote-implementation             https://github.com/pollackelliott/college-basketball-history.git control
          test "$(git -C control rev-parse HEAD)" = "c0e26ee97cf7498a82f9788d42da4879150e5e04"

      - name: Clone exact candidate runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=4 --single-branch             --branch repair/historical-accounting-canonical-union-504             https://github.com/pollackelliott/college-basketball-history.git candidate
          test "$(git -C candidate rev-parse HEAD)" = "fae29c55ba487906d09b082bf4e00eb27d7fb31f"
          git -C candidate merge-base --is-ancestor             92cc70003ba7bb6e5a1e31416d2d6ebb303ab6f2             fae29c55ba487906d09b082bf4e00eb27d7fb31f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replay exact blocked Fordham proposal with candidate tooling
        shell: bash
        run: |
          set -euo pipefail
          python candidate/tools/stage2_candidate_runtime_rehearsal.py             --source-repo control             --candidate-runtime candidate             --candidate-sha fae29c55ba487906d09b082bf4e00eb27d7fb31f             --control-commit c0e26ee97cf7498a82f9788d42da4879150e5e04             --proposal-checkpoint-path .remote-implementation/checkpoints/fordham/fordham-stage2-proposal-0001/checkpoint-manifest.json             --diag /tmp/stage2-candidate-runtime-rehearsal

      - name: Show exact candidate proof summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/stage2-candidate-runtime-rehearsal/candidate-rehearsal-summary.json ]; then
            cat /tmp/stage2-candidate-runtime-rehearsal/candidate-rehearsal-summary.json
          fi

      - name: Upload candidate rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fordham-accounting-candidate-rehearsal-filtered-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/stage2-candidate-runtime-rehearsal
          if-no-files-found: ignore
          retention-days: 14
