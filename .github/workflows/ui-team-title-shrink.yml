name: Refine sticky team title fit

on:
  push:
    branches:
      - chore/sticky-team-context-title

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/sticky-team-context-title
          fetch-depth: 0

      - name: Add content-aware shrink-to-fit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          text = p.read_text(encoding='utf-8')
          anchor = 'function syncTeamContextTitle() {'
          fit = '''function fitTeamContextTitle() {
            const title = document.getElementById("teamContextTitle");
            if (!title || !title.textContent) return;
            const preferredMinSize = 12;
            const absoluteMinSize = 10;
            const maxSize = 20;
            let size = maxSize;
            title.style.fontSize = `${maxSize}px`;
            title.style.letterSpacing = ".025em";
            while (title.scrollWidth > title.clientWidth && size > preferredMinSize) {
              size = Math.max(preferredMinSize, size - 0.5);
              title.style.fontSize = `${size}px`;
            }
            if (title.scrollWidth > title.clientWidth) {
              title.style.letterSpacing = "0";
              while (title.scrollWidth > title.clientWidth && size > absoluteMinSize) {
                size = Math.max(absoluteMinSize, size - 0.5);
                title.style.fontSize = `${size}px`;
              }
            }
          }

'''
          if fit.strip() in text:
              raise SystemExit('fit function already present')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one sync function anchor, found {text.count(anchor)}')
          text = text.replace(anchor, fit + anchor, 1)
          old = '  title.style.setProperty("--team-context-fg", foreground);\n  const show = heading.getBoundingClientRect().bottom <= topbar.getBoundingClientRect().bottom;'
          new = '  title.style.setProperty("--team-context-fg", foreground);\n  fitTeamContextTitle();\n  const show = heading.getBoundingClientRect().bottom <= topbar.getBoundingClientRect().bottom;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one context-title fit insertion point, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('site/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/site-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/site-inline.js

      - name: Browser QA shrink-to-fit
        run: |
          cat > site/_qa_team_title_fit.html <<'EOF'
          <!doctype html><html><body><iframe id="app" style="width:390px;height:844px;border:0" src="/index.html#team/mississippi-state"></iframe><pre id="out">RUNNING</pre><script>
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          async function waitFor(fn){for(let i=0;i<100;i++){try{const v=fn();if(v)return v}catch{}await delay(100)}throw new Error('timeout')}
          window.addEventListener('load',()=>setTimeout(async()=>{
            const out=[]; const f=document.getElementById('app'), w=f.contentWindow;
            try{
              await waitFor(()=>w.document.querySelector('#teamPageTitle'));
              w.scrollTo(0,1200); await delay(250);
              const ms=w.document.getElementById('teamContextTitle');
              const msSize=parseFloat(w.getComputedStyle(ms).fontSize);
              out.push(`${ms.textContent==='Mississippi State'?'PASS':'FAIL'}: Mississippi State full name preserved :: ${ms.textContent}`);
              out.push(`${ms.scrollWidth<=ms.clientWidth?'PASS':'FAIL'}: Mississippi State fits without clipping :: ${ms.scrollWidth}/${ms.clientWidth}`);
              out.push(`${w.getComputedStyle(ms).whiteSpace==='nowrap'?'PASS':'FAIL'}: title remains one line`);
              out.push(`${msSize<20&&msSize>=10?'PASS':'FAIL'}: long name shrinks only as needed :: ${msSize}px`);
              w.location.hash='#team/missouri'; await waitFor(()=>w.document.querySelector('#teamPageTitle')?.textContent?.includes('Missouri')); w.scrollTo(0,1200); await delay(250);
              const mo=w.document.getElementById('teamContextTitle'); const moSize=parseFloat(w.getComputedStyle(mo).fontSize);
              out.push(`${Math.abs(moSize-20)<0.1?'PASS':'FAIL'}: short name keeps full size :: ${moSize}px`);
            }catch(e){out.push(`FAIL: ${e.message}`)}
            document.getElementById('out').textContent=out.join('\n');
          },500));
          </script></body></html>
          EOF
          python -m http.server 8000 --directory site >/tmp/ui-title-fit-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep .2; done
          google-chrome --headless=new --disable-gpu --no-sandbox --window-size=430,932 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8000/_qa_team_title_fit.html >/tmp/ui-title-fit-dom.html
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          text=Path('/tmp/ui-title-fit-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<pre id="out">(.*?)</pre>',text,re.S)
          if not m: raise SystemExit('QA output missing')
          output=unescape(re.sub(r'<[^>]+>','',m.group(1))).strip()
          print(output)
          fails=[x for x in output.splitlines() if x.startswith('FAIL:')]
          if fails: raise SystemExit(f'{len(fails)} shrink-to-fit checks failed')
          if output.count('PASS:') != 5: raise SystemExit(f'Expected 5 passes, got {output.count("PASS:")}')
          PY

      - name: Validate repository
        run: |
          rm -f site/_qa_team_title_fit.html
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_data.py
          PYTHONDONTWRITEBYTECODE=1 python tools/build_site_data.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          git diff --check

      - name: Commit production change
        run: |
          rm -f site/_qa_team_title_fit.html
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add site/index.html
          git commit -m "Shrink long sticky team titles to fit"
          git push origin HEAD:chore/sticky-team-context-title
