name: Disposable LIU remote release-readiness proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  disposable-liu-release-readiness:
    if: github.event.pull_request.head.ref == 'tooling/remote-release-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct exact LIU release-readiness proof in disposable worktree
        run: python tests/disposable_remote_release_readiness_liu.py

      - name: Confirm no remote release request was authorized
        run: |
          echo "DISPOSABLE TEST ONLY. No PR, Preview, merge, or Git ref push is performed."

# Single-use regression on draft PR #366; REMOVE prior to production merge.
