name: Opponent identity tooling validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  clemson-production-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact Clemson Production state
        shell: bash
        run: |
          set -eo pipefail
          test "$(git rev-parse HEAD)" = "e704d770fa6b94fa64467185e182f70d2834d852"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "e704d770fa6b94fa64467185e182f70d2834d852"
          test -z "$(git status --porcelain --untracked-files=all)"

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          from onboard_school import run_gates
          from release_school import wait_for_deployment, production_data_check

          repo=Path.cwd()
          merge_sha="e704d770fa6b94fa64467185e182f70d2834d852"
          changed_paths=["data/canonical/games.csv","data/evidence/game-assertions.csv","data/reconciliation/discrepancies.csv","data/reconciliation/onboarding-decisions/clemson-18db044e428c.json","data/reference/program-accomplishments.csv","data/reference/programs.csv","schools/clemson/source-games.csv","site/data/manifest.json","site/data/programs.json","site/data/teams/alabama.json","site/data/teams/arizona.json","site/data/teams/arkansas.json","site/data/teams/auburn.json","site/data/teams/baylor.json","site/data/teams/butler.json","site/data/teams/byu.json","site/data/teams/california.json","site/data/teams/cincinnati.json","site/data/teams/clemson.json","site/data/teams/colorado.json","site/data/teams/depaul.json","site/data/teams/duke.json","site/data/teams/florida.json","site/data/teams/georgia.json","site/data/teams/illinois.json","site/data/teams/indiana.json","site/data/teams/iowa.json","site/data/teams/kansas-state.json","site/data/teams/kansas.json","site/data/teams/kentucky.json","site/data/teams/lsu.json","site/data/teams/maryland.json","site/data/teams/michigan.json","site/data/teams/minnesota.json","site/data/teams/mississippi-state.json","site/data/teams/missouri.json","site/data/teams/nebraska.json","site/data/teams/north-carolina.json","site/data/teams/northwestern.json","site/data/teams/ohio-state.json","site/data/teams/oklahoma-state.json","site/data/teams/oklahoma.json","site/data/teams/ole-miss.json","site/data/teams/oregon-state.json","site/data/teams/oregon.json","site/data/teams/penn-state.json","site/data/teams/purdue.json","site/data/teams/rutgers.json","site/data/teams/south-carolina.json","site/data/teams/stanford.json","site/data/teams/tcu.json","site/data/teams/tennessee.json","site/data/teams/texas-a-m.json","site/data/teams/texas-tech.json","site/data/teams/texas.json","site/data/teams/ucf.json","site/data/teams/ucla.json","site/data/teams/vanderbilt.json","site/data/teams/virginia.json","site/data/teams/wake-forest.json","site/data/teams/washington.json","site/data/teams/west-virginia.json"]

          print("=== merged-main reproducibility ===")
          run_gates(repo, "clemson", [], include_tests=True)

          deployment=wait_for_deployment(
              repo,
              "pollackelliott/college-basketball-history",
              merge_sha,
              "Production",
              900,
          )
          checked=production_data_check(
              repo,
              "clemson",
              merge_sha,
              changed_paths,
          )

          local=subprocess.check_output(
              ["git","rev-parse","HEAD"], cwd=repo, text=True
          ).strip()
          remote=subprocess.check_output(
              ["git","rev-parse","origin/main"], cwd=repo, text=True
          ).strip()
          if local != merge_sha or remote != merge_sha:
              raise SystemExit(f"main SHA mismatch after proof: {local} / {remote}")
          if subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"],
              cwd=repo,text=True
          ).strip():
              raise SystemExit("merged-main proof left working tree dirty")

          state={
              "schema_version":1,
              "school_key":"clemson",
              "approved_plan_hash":"18db044e428cdb53fc1afb73a70ed89aca43ce0f2ca3aea7e8430f5e08488bbd",
              "branch":"data/clemson-onboarding",
              "head_sha":"b69e49decfb92541dac9e6f4d2705ed89bf3fa96",
              "pr_number":195,
              "pr_url":"https://github.com/pollackelliott/college-basketball-history/pull/195",
              "merge_sha":merge_sha,
              "production_deployment":deployment,
              "production_json_checked":checked,
              "changed_paths":changed_paths,
              "status":"COMPLETE",
          }
          out=repo/".onboarding/clemson/release-state.json"
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(state,indent=2)+"\n")

          print("\nPRODUCTION QA PASSED")
          print("Merged SHA: "+merge_sha)
          print("Production: "+str(deployment.get("environment_url","")))
          print("Exact JSON documents verified: "+str(len(checked)))
          print("FINAL_STATUS=COMPLETE")
          PY

      - name: Upload Clemson production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clemson-production-proof
          include-hidden-files: true
          path: .onboarding/clemson/release-state.json
          if-no-files-found: error
