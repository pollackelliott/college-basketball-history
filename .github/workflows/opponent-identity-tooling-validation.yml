name: Opponent identity tooling validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Rehearse Clemson Stage 2 recommendation map
        shell: bash
        run: |
          git switch -c data/clemson-onboarding-map-proof

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          from integration_freeze_guard import (
              build_source_game_semantic_snapshot,
              semantic_snapshot_sha256,
          )

          expected = "f6f3d62adeac4a497e45944c142e20e85a56289974f2c0b75d40f79521c5aca1"
          source = Path("schools/clemson/source-games.csv")
          snapshot = build_source_game_semantic_snapshot(source)
          actual = semantic_snapshot_sha256(snapshot)
          if actual != expected:
              raise SystemExit(
                  f"semantic freeze mismatch before Stage 2 rehearsal: {actual} != {expected}"
              )

          output = Path(".onboarding/clemson/integration-freeze.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(
                  {
                      "schema_version": 2,
                      "school_key": "clemson",
                      "status": "INTEGRATION_FROZEN",
                      "research_base_sha": "e57a7049b2315508e59fd68b4324c34050901f45",
                      "integration_base_sha": "de4ccb88fc5550b66b514841000b1c5e04bd93f5",
                      "origin_main_sha": "de4ccb88fc5550b66b514841000b1c5e04bd93f5",
                      "source_game_semantic_guard": {
                          "schema_version": 1,
                          "snapshot_sha256": actual,
                          "snapshot": snapshot,
                      },
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )
          print("SEMANTIC_FREEZE_SHA256=" + actual)
          PY

          cat > .onboarding/clemson/recommendation-map.json <<'JSON'
          {
            "basis_by_decision": {
              "ACCOMPLISHMENTS-CLEMSON": "Use the existing Stage 2 VERIFY_REFERENCE_VALUES recommendation. This is the owner/administrative accomplishment decision already present in the authoritative review packet; no new historical research is introduced by this map.",
              "DISCREPANCY-CLEM-R-1940-004-SITE_TYPE": "Clemson's frozen institutional row explicitly records N1/NEUTRAL on 1940-12-19. The already-reviewed Maryland reciprocal row MDRAW-00378 is Maryland SOURCE_PROGRAM_HOME evidence at Ritchie Coliseum in College Park, MD; that opponent-home venue/location metadata does not establish Clemson's neutral site. Preserve Clemson NEUTRAL, remove the unsupported reciprocal site metadata, and retain the historical neutral venue/locality as researched unresolved under the 1995-96-and-earlier location-first policy.",
              "DISCREPANCY-CLEM-R-1956-023-SITE_TYPE": "Clemson's frozen institutional row explicitly records N1/NEUTRAL on 1957-03-02. The already-reviewed South Carolina reciprocal row SCARAW-00874 is South Carolina SOURCE_PROGRAM_HOME evidence at Carolina Fieldhouse in Columbia, SC; that opponent-home venue/location metadata does not establish Clemson's neutral site. Preserve Clemson NEUTRAL, remove the unsupported reciprocal site metadata, and retain the historical neutral venue/locality as researched unresolved under the 1995-96-and-earlier location-first policy.",
              "DISCREPANCY-CLEM-R-1965-005-SITE_TYPE": "Clemson's frozen institutional row explicitly records N2/NEUTRAL on 1965-12-29. The already-reviewed Ole Miss reciprocal row OMRAW-01039 is Ole Miss SOURCE_PROGRAM_HOME evidence at Old Gym in Oxford, MS and therefore does not establish Clemson's neutral site. Existing frozen same-season Clemson N2 evidence identifies the Poinsettia Classic in Greenville, SC. Preserve Clemson NEUTRAL and the supported Greenville locality, clear the unsupported Ole Miss home building, and retain the exact-building blank as researched partial historical enrichment debt.",
              "DISCREPANCY-CLEM-R-1977-014-SITE_TYPE": "Clemson's RESEARCH_FROZEN institutional row explicitly records N4/NEUTRAL on 1978-01-14 and preserves researched locality Greensboro, NC with valid RESEARCHED_PARTIAL accounting. The reciprocal Wake Forest TEAM_B_HOME assertion does not provide a previously accepted stronger historical basis. Preserve the frozen Clemson NEUTRAL conclusion.",
              "DISCREPANCY-CLEM-R-1978-021-SITE_TYPE": "Clemson's RESEARCH_FROZEN institutional row explicitly records N3/NEUTRAL on 1979-02-07 and preserves researched locality Greensboro, NC with valid RESEARCHED_PARTIAL accounting. The reciprocal Wake Forest TEAM_B_HOME assertion does not provide a previously accepted stronger historical basis. Preserve the frozen Clemson NEUTRAL conclusion.",
              "DISCREPANCY-CLEM-R-2001-025-OVERTIME_PERIODS": "Already-supported correction preserved from Stage 2 recovery: Clemson's structured source normalization says 3 OT, while contemporaneous Clemson official evidence establishes 2OT and the canonical value is 2. Normalize the curated source field to canonical 2 while preserving literal raw_text.",
              "DISCREPANCY-CLEM-R-2004-024-SITE_TYPE": "Clemson's frozen target row explicitly marks the 2005-02-16 Georgia game N2/NEUTRAL. The already-opened Georgia institutional reciprocal row UGARAW-02270 contains the event/site text 'Bi-Lo Center-Greenville, S.C.' while its structured SOURCE_PROGRAM_HOME Athens/Stegeman defaults conflict with that same evidence. Protected-main venue registration maps historical Bi-Lo Center to VEN-000025 / bon-secours-wellness-arena in Greenville, SC.",
              "IDENTITY-CLEM-R-1912-004": "Frozen Clemson has one 1912-13 Georgia game (1913-01-31, L 15-75, away). Georgia's official 1912-13 schedule has one Clemson game (1913-02-07, W 77-15, home). Opponent, season, orientation, and result align uniquely; the date and two-point score difference are downstream field discrepancies, not evidence for a second game.",
              "IDENTITY-CLEM-R-1919-007": "Georgia's official 1919-20 schedule contains two Clemson games: Jan. 23 at Georgia (Georgia 36-22) and Jan. 31 at Clemson (Georgia 33-24). Frozen Clemson also contains two Georgia rows: CLEM-R-1919-004 is the road first game and CLEM-R-1919-007 is the home second game. The root therefore maps to the Jan. 31 canonical candidate; its one-day and one-point differences remain downstream field discrepancies.",
              "IDENTITY-CLEM-R-1923-019": "Frozen Clemson identifies a neutral Southern Conference Tournament loss to Vanderbilt on 1924-02-29, 13-42. Vanderbilt's official series history records a single 1923-24 neutral Clemson game, a 42-14 Vanderbilt win. Season, opponent, neutral context, and result align uniquely; the one-point Clemson-score difference remains the downstream score discrepancy.",
              "IDENTITY-CLEM-R-1926-007": "Frozen Clemson contains consecutive Auburn road games: CLEM-R-1926-007 at 26-42 and CLEM-R-1926-008 at 23-45. Auburn's official 1926-27 schedule contains consecutive home games vs Clemson: Feb. 3, 45-26 and Feb. 4, 45-23. The first frozen row maps one-for-one to CBBG-0030131; CLEM-R-1926-008 already corresponds to the second game.",
              "IDENTITY-CLEM-R-1927-014": "Frozen Clemson contains two distinct Georgia rows in 1927-28: CLEM-R-1927-014 (Jan. 31, home, L 32-36) and CLEM-R-1927-016 (Feb. 6, away, L 25-38). The sole Stage 2 candidate CBBG-0041781 is exactly the Feb. 6 / 25-38 game represented by CLEM-R-1927-016. Under RESEARCH_FROZEN presumptive authority, CLEM-R-1927-014 must not be collapsed onto that already-accounted game; preserve it as a distinct frozen game through FORCE_NEW.",
              "PUBLICATION-CLEMSON": "Use the existing Stage 2 ENABLE_PUBLIC_PAGE recommendation, contingent on the full approved decision set and automated release gates."
            },
            "canonical_patch_by_decision": {
              "DISCREPANCY-CLEM-R-1940-004-SITE_TYPE": {
                "site_city": "",
                "site_state": "",
                "venue_id": "",
                "venue_key": ""
              },
              "DISCREPANCY-CLEM-R-1956-023-SITE_TYPE": {
                "site_city": "",
                "site_state": "",
                "venue_id": "",
                "venue_key": ""
              },
              "DISCREPANCY-CLEM-R-1965-005-SITE_TYPE": {
                "site_city": "Greenville",
                "site_state": "SC",
                "venue_id": "",
                "venue_key": ""
              },
              "DISCREPANCY-CLEM-R-2004-024-SITE_TYPE": {
                "site_city": "Greenville",
                "site_state": "SC",
                "venue_id": "VEN-000025",
                "venue_key": "bon-secours-wellness-arena"
              }
            },
            "decisions": {
              "ACCOMPLISHMENTS-CLEMSON": "VERIFY_REFERENCE_VALUES",
              "DISCREPANCY-CLEM-R-1940-004-SITE_TYPE": "USE_SOURCE",
              "DISCREPANCY-CLEM-R-1956-023-SITE_TYPE": "USE_SOURCE",
              "DISCREPANCY-CLEM-R-1965-005-SITE_TYPE": "USE_SOURCE",
              "DISCREPANCY-CLEM-R-1977-014-SITE_TYPE": "USE_SOURCE",
              "DISCREPANCY-CLEM-R-1978-021-SITE_TYPE": "USE_SOURCE",
              "DISCREPANCY-CLEM-R-2001-025-OVERTIME_PERIODS": "NORMALIZE_SOURCE_TO_CANONICAL",
              "DISCREPANCY-CLEM-R-2004-024-SITE_TYPE": "USE_SOURCE",
              "PUBLICATION-CLEMSON": "ENABLE_PUBLIC_PAGE"
            },
            "defaults": {
              "basis": "RESEARCH_FROZEN Clemson institutional evidence is the presumptive historical authority. Preserve the frozen Clemson historical value; a source/canonical or reciprocal discrepancy alone is not a stronger previously accepted historical basis requiring reopening.",
              "discrepancy": "USE_SOURCE",
              "identity_basis": "Use the completed Stage 2 identity compression/adjudication outcome; downstream historical field discrepancies remain governed by the frozen-research rule.",
              "not_applicable_basis": "Not applicable because the completed identity recommendation selected a different canonical candidate, or FORCE_NEW for the frozen Clemson source game.",
              "selected_conditional": "USE_SOURCE"
            },
            "identity": {
              "CLEM-R-1912-004": "MATCH_CANONICAL:CBBG-0041607",
              "CLEM-R-1919-007": "MATCH_CANONICAL:CBBG-0041657",
              "CLEM-R-1920-014": "MATCH_CANONICAL:CBBG-0030056",
              "CLEM-R-1923-019": "MATCH_CANONICAL:CBBG-0022915",
              "CLEM-R-1925-019": "MATCH_CANONICAL:CBBG-0041749",
              "CLEM-R-1926-007": "MATCH_CANONICAL:CBBG-0030131",
              "CLEM-R-1927-014": "FORCE_NEW",
              "CLEM-R-1927-023": "MATCH_CANONICAL:CBBG-0030151",
              "CLEM-R-1929-004": "MATCH_CANONICAL:CBBG-0020447",
              "CLEM-R-1945-010": "MATCH_CANONICAL:CBBG-0063939",
              "CLEM-R-1950-018": "MATCH_CANONICAL:CBBG-0056738",
              "CLEM-R-1952-013": "MATCH_CANONICAL:CBBG-0095404",
              "CLEM-R-1981-023": "MATCH_CANONICAL:CBBG-0057525",
              "CLEM-R-1991-028": "MATCH_CANONICAL:CBBG-0057818",
              "CLEM-R-2022-009": "MATCH_CANONICAL:CBBG-0128784"
            },
            "notes_by_decision": {},
            "source_patch_by_decision": {
              "DISCREPANCY-CLEM-R-1940-004-SITE_TYPE": {
                "city": "",
                "curated_venue_name": "",
                "notes": "Gate 1 recommendation: Clemson raw N1/NEUTRAL retained. Published Maryland reciprocal MDRAW-00378 is preserved as conflicting project evidence, but its SOURCE_PROGRAM_HOME Ritchie Coliseum / College Park, MD metadata is not used as neutral-site proof. Raw text remains preserved.",
                "site_research_basis": "HISTORICAL_NEUTRAL_RECONCILIATION: Clemson raw N1 establishes NEUTRAL. The already-reviewed Maryland reciprocal MDRAW-00378 is Maryland SOURCE_PROGRAM_HOME at Ritchie Coliseum in College Park, MD and therefore does not establish a neutral venue or locality. No supported neutral city/state or exact building remains in the preserved evidence; the historical neutral site remains unresolved under the 1995-96-and-earlier location-first rule.",
                "site_research_status": "RESEARCHED_UNRESOLVED",
                "state": ""
              },
              "DISCREPANCY-CLEM-R-1956-023-SITE_TYPE": {
                "city": "",
                "curated_venue_name": "",
                "notes": "Gate 1 recommendation: Clemson raw N1/NEUTRAL retained. Published South Carolina reciprocal SCARAW-00874 is preserved as conflicting project evidence, but its SOURCE_PROGRAM_HOME Carolina Fieldhouse / Columbia, SC metadata is not used as neutral-site proof. Raw text remains preserved.",
                "site_research_basis": "HISTORICAL_NEUTRAL_RECONCILIATION: Clemson raw N1 establishes NEUTRAL. The already-reviewed South Carolina reciprocal SCARAW-00874 is South Carolina SOURCE_PROGRAM_HOME at Carolina Fieldhouse in Columbia, SC and therefore does not establish a neutral venue or locality. No supported neutral city/state or exact building remains in the preserved evidence; the historical neutral site remains unresolved under the 1995-96-and-earlier location-first rule.",
                "site_research_status": "RESEARCHED_UNRESOLVED",
                "state": ""
              },
              "DISCREPANCY-CLEM-R-1965-005-SITE_TYPE": {
                "city": "Greenville",
                "curated_venue_name": "",
                "event_or_tournament": "Poinsettia Classic",
                "notes": "Gate 1 recommendation: Clemson raw N2/NEUTRAL retained. Published Ole Miss reciprocal OMRAW-01039 is preserved as conflicting project evidence, but its SOURCE_PROGRAM_HOME Old Gym / Oxford, MS metadata is not used as neutral-site proof. Frozen Clemson same-season N2 evidence supports Poinsettia Classic / Greenville, SC; exact building remains unresolved. Raw text remains preserved.",
                "site_research_basis": "HISTORICAL_LOCATION_ENRICHMENT: Clemson raw N2 establishes NEUTRAL. The already-reviewed Ole Miss reciprocal OMRAW-01039 is Ole Miss SOURCE_PROGRAM_HOME at Old Gym in Oxford, MS and is not neutral-site proof. Frozen same-season Clemson N2 evidence identifies the Poinsettia Classic in Greenville, SC; locality is retained and the exact building remains unresolved under the 1995-96-and-earlier location-first rule.",
                "site_research_status": "RESEARCHED_PARTIAL",
                "state": "SC"
              },
              "DISCREPANCY-CLEM-R-2004-024-SITE_TYPE": {
                "city": "Greenville",
                "curated_venue_name": "Bi-Lo Center",
                "notes": "Gate 1 recommendation: Clemson N2/NEUTRAL retained. Georgia reciprocal UGARAW-02270 carries 'Bi-Lo Center-Greenville, S.C.' event/site evidence; Athens/Stegeman SOURCE_PROGRAM_HOME defaults are not used as neutral-site metadata.",
                "state": "SC"
              }
            }
          }
          
          JSON

          echo "RECOMMENDATION_MAP_SHA256=$(sha256sum .onboarding/clemson/recommendation-map.json | awk '{print $1}')"

          set +e
          python tools/implementation_stage2.py clemson --map .onboarding/clemson/recommendation-map.json
          STAGE2_RC=$?
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          status_path = Path(".onboarding/clemson/implementation-stage2-status.json")
          if not status_path.exists():
              print("STAGE2_STATUS_ARTIFACT=MISSING")
              raise SystemExit(0)

          status = json.loads(status_path.read_text(encoding="utf-8"))
          preflight = status.get("preflight", {})
          recommendation = status.get("recommendation_map", {})
          rehearsal = status.get("proposal_rehearsal", {})
          site = status.get("site_diagnostic", {})

          print("CLEMSON_STAGE2_STATUS=" + str(status.get("status", "")))
          print("CLEMSON_DECISION_COUNT=" + str(preflight.get("decision_count", "")))
          print("CLEMSON_DECISION_SHA256=" + str(preflight.get("decision_universe_sha256", "")))
          print("MAP_DECISION_COUNT=" + str(recommendation.get("decision_count", "")))
          print("MAP_SHA256=" + str(recommendation.get("sha256", "")))
          print("MAP_ACTION_COUNTS=" + json.dumps(recommendation.get("action_counts", {}), sort_keys=True))
          print("PROPOSAL_REHEARSAL=" + ("PASS" if rehearsal else "FAIL"))
          print("PROPOSAL_REHEARSAL_DETAIL=" + json.dumps(rehearsal, sort_keys=True))
          print("SITE_DIAGNOSTIC=" + json.dumps(site, sort_keys=True))
          if status.get("last_error"):
              print("STAGE2_LAST_ERROR=" + str(status["last_error"]))
          PY

          exit "$STAGE2_RC"

      - name: Upload Clemson Stage 2 rehearsal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clemson-stage2-map-rehearsal
          path: |
            .onboarding/clemson/recommendation-map.json
            .onboarding/clemson/implementation-stage2-status.json
            .onboarding/clemson/implementation-stage2-capability-census.json
            .onboarding/clemson/last-rehearsal-site-gate.json
          if-no-files-found: warn

      - name: Run targeted opponent identity tests
        run: |
          python -m unittest discover -s tests -p 'test_opponent_identity_collision_audit.py' -v
          python -m unittest discover -s tests -p 'test_opponent_identity_remediation.py' -v
          python -m unittest discover -s tests -p 'test_published_opponent_identity_census.py' -v

      - name: Run full repository test suite
        run: python -m unittest discover -s tests -v

      - name: Validate alias registry
        run: python tools/opponent_identity_remediation.py validate-aliases --json

      - name: Build and audit the known Texas A&M P0 repair
        shell: bash
        run: |
          cat > /tmp/texas-am-p0-decisions.csv <<'CSV'
          source_program_key,source_opponent_label,from_program_key,to_program_key,decision,evidence_basis,evidence_url
          northwestern,Texas A&M,texas-a-and-m,texas-a-m,MERGE_TO_PROGRAM,"Published Northwestern package uses stale texas-a-and-m identity; authoritative current registry and reciprocal Texas A&M history establish texas-a-m as the same program identity.",https://github.com/pollackelliott/college-basketball-history
          oklahoma,Texas A&M,texas-a-and-m,texas-a-m,MERGE_TO_PROGRAM,"Published Oklahoma package uses stale texas-a-and-m identity; authoritative current registry establishes texas-a-m as the same program identity.",https://github.com/pollackelliott/college-basketball-history
          CSV

          set +e
          python tools/opponent_identity_remediation.py plan /tmp/texas-am-p0-decisions.csv --output /tmp/texas-am-p0-plan-a.json
          PLAN_RC=$?
          set -e
          if [ "$PLAN_RC" -ne 0 ] && [ "$PLAN_RC" -ne 2 ]; then
            echo "Unexpected planner exit code: $PLAN_RC"
            exit 1
          fi

          set +e
          python tools/opponent_identity_remediation.py plan /tmp/texas-am-p0-decisions.csv --output /tmp/texas-am-p0-plan-b.json
          PLAN_RC_2=$?
          set -e
          if [ "$PLAN_RC_2" -ne "$PLAN_RC" ]; then
            echo "Planner exit code is nondeterministic"
            exit 1
          fi

          python tools/opponent_identity_collision_audit.py /tmp/texas-am-p0-decisions.csv --output /tmp/texas-am-collision-audit-a.json
          python tools/opponent_identity_collision_audit.py /tmp/texas-am-p0-decisions.csv --output /tmp/texas-am-collision-audit-b.json

          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          p1 = load('/tmp/texas-am-p0-plan-a.json')
          p2 = load('/tmp/texas-am-p0-plan-b.json')
          a1 = load('/tmp/texas-am-collision-audit-a.json')
          a2 = load('/tmp/texas-am-collision-audit-b.json')

          assert p1['plan_sha256'] == p2['plan_sha256'], 'plan hash is nondeterministic'
          assert a1['audit_sha256'] == a2['audit_sha256'], 'audit hash is nondeterministic'

          affected = a1['affected_canonical_game_count']
          accounted = a1['covered_affected_game_count'] + a1['unpaired_affected_game_count']
          assert affected == accounted, f'affected accounting mismatch: {accounted}/{affected}'

          print('P0_PLAN_SHA256=' + p1['plan_sha256'])
          print('P0_AUDIT_SHA256=' + a1['audit_sha256'])
          print('AFFECTED_CANONICAL_GAMES=' + str(affected))
          print('SAME_DATE_COLLISION_GROUPS=' + str(a1['same_date_collision_group_count']))
          print('EXACT_CORE_MATCH_GROUPS=' + str(a1['exact_core_match_group_count']))
          print('SAME_DATE_IDENTITY_CONFLICT_GROUPS=' + str(a1['same_date_identity_conflict_group_count']))
          print('COVERED_AFFECTED_GAMES=' + str(a1['covered_affected_game_count']))
          print('UNPAIRED_AFFECTED_GAMES=' + str(a1['unpaired_affected_game_count']))

          for item in a1['collision_groups']:
              if item['kind'] == 'SAME_DATE_IDENTITY_CONFLICT':
                  print('CONFLICT=' + ','.join(item['canonical_game_ids']) + '|' + '|'.join(item['signature']) + '|differences=' + ','.join(sorted(item['field_differences'])))

          for game_id in a1['unpaired_affected_game_ids']:
              print('UNPAIRED=' + game_id)
          PY
