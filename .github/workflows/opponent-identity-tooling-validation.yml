name: Opponent identity tooling validation

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write
  deployments: read
  pull-requests: write
  statuses: read

jobs:
  clemson-gate2-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact Clemson release head
        uses: actions/checkout@v4
        with:
          ref: data/clemson-onboarding
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Execute exact approved Preview merge and Production proof
        shell: bash
        run: |
          set -eo pipefail
          EXPECTED_MAIN="6c48d7dc510fd318c35344c37dc21f2c2f45e59c"
          EXPECTED_HEAD="b69e49decfb92541dac9e6f4d2705ed89bf3fa96"

          test "$(git branch --show-current)" = "data/clemson-onboarding"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain --untracked-files=all)"

          mkdir -p .onboarding/clemson
          cat > .onboarding/clemson/release-state.json <<'JSON'
          {
            "schema_version": 1,
            "school_key": "clemson",
            "approved_plan_hash": "18db044e428cdb53fc1afb73a70ed89aca43ce0f2ca3aea7e8430f5e08488bbd",
            "branch": "data/clemson-onboarding",
            "head_sha": "b69e49decfb92541dac9e6f4d2705ed89bf3fa96",
            "pr_number": 195,
            "pr_url": "https://github.com/pollackelliott/college-basketball-history/pull/195",
            "preview_deployment": {
              "environment": "Preview",
              "environment_url": "https://college-basketball-history-git-a548cc-elliott-pollacks-projects.vercel.app",
              "inspector_url": "https://vercel.com/elliott-pollacks-projects/college-basketball-history/76xytWpbujAqLgs43W9j5gPw2feH",
              "state": "success",
              "sha": "b69e49decfb92541dac9e6f4d2705ed89bf3fa96"
            },
            "changed_paths": [
              "data/canonical/games.csv",
              "data/evidence/game-assertions.csv",
              "data/reconciliation/discrepancies.csv",
              "data/reconciliation/onboarding-decisions/clemson-18db044e428c.json",
              "data/reference/program-accomplishments.csv",
              "data/reference/programs.csv",
              "schools/clemson/source-games.csv",
              "site/data/manifest.json",
              "site/data/programs.json",
              "site/data/teams/alabama.json",
              "site/data/teams/arizona.json",
              "site/data/teams/arkansas.json",
              "site/data/teams/auburn.json",
              "site/data/teams/baylor.json",
              "site/data/teams/butler.json",
              "site/data/teams/byu.json",
              "site/data/teams/california.json",
              "site/data/teams/cincinnati.json",
              "site/data/teams/clemson.json",
              "site/data/teams/colorado.json",
              "site/data/teams/depaul.json",
              "site/data/teams/duke.json",
              "site/data/teams/florida.json",
              "site/data/teams/georgia.json",
              "site/data/teams/illinois.json",
              "site/data/teams/indiana.json",
              "site/data/teams/iowa.json",
              "site/data/teams/kansas-state.json",
              "site/data/teams/kansas.json",
              "site/data/teams/kentucky.json",
              "site/data/teams/lsu.json",
              "site/data/teams/maryland.json",
              "site/data/teams/michigan.json",
              "site/data/teams/minnesota.json",
              "site/data/teams/mississippi-state.json",
              "site/data/teams/missouri.json",
              "site/data/teams/nebraska.json",
              "site/data/teams/north-carolina.json",
              "site/data/teams/northwestern.json",
              "site/data/teams/ohio-state.json",
              "site/data/teams/oklahoma-state.json",
              "site/data/teams/oklahoma.json",
              "site/data/teams/ole-miss.json",
              "site/data/teams/oregon-state.json",
              "site/data/teams/oregon.json",
              "site/data/teams/penn-state.json",
              "site/data/teams/purdue.json",
              "site/data/teams/rutgers.json",
              "site/data/teams/south-carolina.json",
              "site/data/teams/stanford.json",
              "site/data/teams/tcu.json",
              "site/data/teams/tennessee.json",
              "site/data/teams/texas-a-m.json",
              "site/data/teams/texas-tech.json",
              "site/data/teams/texas.json",
              "site/data/teams/ucf.json",
              "site/data/teams/ucla.json",
              "site/data/teams/vanderbilt.json",
              "site/data/teams/virginia.json",
              "site/data/teams/wake-forest.json",
              "site/data/teams/washington.json",
              "site/data/teams/west-virginia.json"
            ]
          }
          
          JSON

          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path(".onboarding/clemson/release-state.json").read_text())
          assert s["school_key"]=="clemson"
          assert s["branch"]=="data/clemson-onboarding"
          assert s["head_sha"]=="b69e49decfb92541dac9e6f4d2705ed89bf3fa96"
          assert s["pr_number"]==195
          assert s["approved_plan_hash"]=="18db044e428cdb53fc1afb73a70ed89aca43ce0f2ca3aea7e8430f5e08488bbd"
          assert len(s["changed_paths"])==62
          print("GATE2_RELEASE_STATE=VALID")
          PY

          python tools/release_school.py clemson --merge --preview-approved --deployment-timeout 900

          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path(".onboarding/clemson/release-state.json").read_text())
          print("FINAL_STATUS="+str(s.get("status","")))
          print("MERGED_SHA="+str(s.get("merge_sha","")))
          print("PRODUCTION_URL="+str(s.get("production_deployment",{}).get("environment_url","")))
          print("PRODUCTION_JSON_CHECKED="+str(len(s.get("production_json_checked",[]))))
          print("APPROVED_PLAN_HASH="+str(s.get("approved_plan_hash","")))
          PY

      - name: Upload Clemson Gate 2 production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clemson-gate2-production-proof
          include-hidden-files: true
          path: .onboarding/clemson/release-state.json
          if-no-files-found: error
