name: Opponent identity tooling validation

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Rehearse preserved Clemson Stage 2 recommendation map
        shell: bash
        run: |
          git switch -c data/clemson-onboarding-map-proof

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          from integration_freeze_guard import (
              build_source_game_semantic_snapshot,
              semantic_snapshot_sha256,
          )

          expected = "f6f3d62adeac4a497e45944c142e20e85a56289974f2c0b75d40f79521c5aca1"
          source = Path("schools/clemson/source-games.csv")
          snapshot = build_source_game_semantic_snapshot(source)
          actual = semantic_snapshot_sha256(snapshot)
          if actual != expected:
              raise SystemExit(
                  f"semantic freeze mismatch before Stage 2 rehearsal: {actual} != {expected}"
              )

          output = Path(".onboarding/clemson/integration-freeze.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(
                  {
                      "schema_version": 2,
                      "school_key": "clemson",
                      "status": "INTEGRATION_FROZEN",
                      "research_base_sha": "e57a7049b2315508e59fd68b4324c34050901f45",
                      "integration_base_sha": "de4ccb88fc5550b66b514841000b1c5e04bd93f5",
                      "origin_main_sha": "de4ccb88fc5550b66b514841000b1c5e04bd93f5",
                      "source_game_semantic_guard": {
                          "schema_version": 1,
                          "snapshot_sha256": actual,
                          "snapshot": snapshot,
                      },
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )
          print("SEMANTIC_FREEZE_SHA256=" + actual)
          PY

          curl -L --fail \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10952140311/zip" \
            -o /tmp/clemson-map-artifact.zip
          unzip -p /tmp/clemson-map-artifact.zip recommendation-map.json \
            > .onboarding/clemson/recommendation-map.json

          MAP_SHA="$(sha256sum .onboarding/clemson/recommendation-map.json | awk '{print $1}')"
          echo "RECOMMENDATION_MAP_SHA256=$MAP_SHA"
          test "$MAP_SHA" = "87cc2241664b4dea9f03fd0a87d3da188061c6f41533f8947ab32de2c6942c38"

          set +e
          python tools/implementation_stage2.py clemson \
            --map .onboarding/clemson/recommendation-map.json
          STAGE2_RC=$?
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path(".onboarding/clemson/implementation-stage2-status.json").read_text(
                  encoding="utf-8"
              )
          )
          preflight = status.get("preflight", {})
          recommendation = status.get("recommendation_map", {})
          rehearsal = status.get("proposal_rehearsal", {})
          site = status.get("site_diagnostic")

          print("CLEMSON_STAGE2_STATUS=" + str(status.get("status", "")))
          print("CLEMSON_DECISION_COUNT=" + str(preflight.get("decision_count", "")))
          print("CLEMSON_DECISION_SHA256=" + str(preflight.get("decision_universe_sha256", "")))
          print("MAP_DECISION_COUNT=" + str(recommendation.get("decision_count", "")))
          print("MAP_SHA256=" + str(recommendation.get("sha256", "")))
          print("MAP_ACTION_COUNTS=" + json.dumps(recommendation.get("action_counts", {}), sort_keys=True))
          print("PROPOSAL_REHEARSAL=" + ("PASS" if rehearsal else "FAIL"))
          print("PROPOSAL_REHEARSAL_DETAIL=" + json.dumps(rehearsal, sort_keys=True))
          print("SITE_DIAGNOSTIC=" + json.dumps(site, sort_keys=True))
          if status.get("last_error"):
              print("STAGE2_LAST_ERROR=" + str(status["last_error"]))

          expected_decision_sha = "9dd32a7e5233843d23b55f92e9e14aa7210b35ccd23b54dc2f845eaadcd93923"
          expected_map_sha = "87cc2241664b4dea9f03fd0a87d3da188061c6f41533f8947ab32de2c6942c38"
          if status.get("status") == "OWNER_GATE_1_READY":
              assert preflight.get("decision_count") == 160
              assert preflight.get("decision_universe_sha256") == expected_decision_sha
              assert recommendation.get("decision_count") == 160
              assert recommendation.get("sha256") == expected_map_sha
              assert rehearsal
          PY

          exit "$STAGE2_RC"

      - name: Upload Clemson Stage 2 post-repair rehearsal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clemson-stage2-post-provenance-rehearsal
          path: |
            .onboarding/clemson/recommendation-map.json
            .onboarding/clemson/implementation-stage2-status.json
            .onboarding/clemson/implementation-stage2-capability-census.json
            .onboarding/clemson/last-rehearsal-site-gate.json
          if-no-files-found: warn

      - name: Run targeted opponent identity tests
        run: |
          python -m unittest discover -s tests -p 'test_opponent_identity_collision_audit.py' -v
          python -m unittest discover -s tests -p 'test_opponent_identity_remediation.py' -v
          python -m unittest discover -s tests -p 'test_published_opponent_identity_census.py' -v

      - name: Run full repository test suite
        run: python -m unittest discover -s tests -v

      - name: Validate alias registry
        run: python tools/opponent_identity_remediation.py validate-aliases --json

      - name: Build and audit the known Texas A&M P0 repair
        shell: bash
        run: |
          cat > /tmp/texas-am-p0-decisions.csv <<'CSV'
          source_program_key,source_opponent_label,from_program_key,to_program_key,decision,evidence_basis,evidence_url
          northwestern,Texas A&M,texas-a-and-m,texas-a-m,MERGE_TO_PROGRAM,"Published Northwestern package uses stale texas-a-and-m identity; authoritative current registry and reciprocal Texas A&M history establish texas-a-m as the same program identity.",https://github.com/pollackelliott/college-basketball-history
          oklahoma,Texas A&M,texas-a-and-m,texas-a-m,MERGE_TO_PROGRAM,"Published Oklahoma package uses stale texas-a-and-m identity; authoritative current registry establishes texas-a-m as the same program identity.",https://github.com/pollackelliott/college-basketball-history
          CSV

          set +e
          python tools/opponent_identity_remediation.py plan /tmp/texas-am-p0-decisions.csv --output /tmp/texas-am-p0-plan-a.json
          PLAN_RC=$?
          set -e
          if [ "$PLAN_RC" -ne 0 ] && [ "$PLAN_RC" -ne 2 ]; then
            echo "Unexpected planner exit code: $PLAN_RC"
            exit 1
          fi

          set +e
          python tools/opponent_identity_remediation.py plan /tmp/texas-am-p0-decisions.csv --output /tmp/texas-am-p0-plan-b.json
          PLAN_RC_2=$?
          set -e
          if [ "$PLAN_RC_2" -ne "$PLAN_RC" ]; then
            echo "Planner exit code is nondeterministic"
            exit 1
          fi

          python tools/opponent_identity_collision_audit.py /tmp/texas-am-p0-decisions.csv --output /tmp/texas-am-collision-audit-a.json
          python tools/opponent_identity_collision_audit.py /tmp/texas-am-p0-decisions.csv --output /tmp/texas-am-collision-audit-b.json

          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          p1 = load('/tmp/texas-am-p0-plan-a.json')
          p2 = load('/tmp/texas-am-p0-plan-b.json')
          a1 = load('/tmp/texas-am-collision-audit-a.json')
          a2 = load('/tmp/texas-am-collision-audit-b.json')

          assert p1['plan_sha256'] == p2['plan_sha256'], 'plan hash is nondeterministic'
          assert a1['audit_sha256'] == a2['audit_sha256'], 'audit hash is nondeterministic'

          affected = a1['affected_canonical_game_count']
          accounted = a1['covered_affected_game_count'] + a1['unpaired_affected_game_count']
          assert affected == accounted, f'affected accounting mismatch: {accounted}/{affected}'

          print('P0_PLAN_SHA256=' + p1['plan_sha256'])
          print('P0_AUDIT_SHA256=' + a1['audit_sha256'])
          print('AFFECTED_CANONICAL_GAMES=' + str(affected))
          print('SAME_DATE_COLLISION_GROUPS=' + str(a1['same_date_collision_group_count']))
          print('EXACT_CORE_MATCH_GROUPS=' + str(a1['exact_core_match_group_count']))
          print('SAME_DATE_IDENTITY_CONFLICT_GROUPS=' + str(a1['same_date_identity_conflict_group_count']))
          print('COVERED_AFFECTED_GAMES=' + str(a1['covered_affected_game_count']))
          print('UNPAIRED_AFFECTED_GAMES=' + str(a1['unpaired_affected_game_count']))

          for item in a1['collision_groups']:
              if item['kind'] == 'SAME_DATE_IDENTITY_CONFLICT':
                  print('CONFLICT=' + ','.join(item['canonical_game_ids']) + '|' + '|'.join(item['signature']) + '|differences=' + ','.join(sorted(item['field_differences'])))

          for game_id in a1['unpaired_affected_game_ids']:
              print('UNPAIRED=' + game_id)
          PY
