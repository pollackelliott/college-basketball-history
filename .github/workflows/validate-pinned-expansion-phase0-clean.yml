name: Validate clean pinned expansion Phase 0 authority

on:
  push:
    branches:
      - 'request-validation/pinned-expansion-phase0-clean-f89715'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8971522216323c00e1ba289d4f382192fecaf48
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax compile every modified Python file
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/remote_implementation_control.py \
            tools/remote_implementation_expansion_startup.py \
            tools/remote_implementation_expansion_phase0.py \
            tests/test_remote_implementation_expansion_startup.py \
            tests/test_remote_implementation_expansion_phase0.py
      - name: Run focused regressions and full expansion acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_remote_implementation_expansion_startup.py' -q
          python -m unittest discover -s tests -p 'test_remote_implementation_expansion_phase0.py' -q
          python -m unittest discover -s tests -p 'test_expansion_implementation_stage1.py' -q
          mkdir -p /tmp/pinned-phase0-clean
          python tools/all_history_expansion_implementation_acceptance.py --json \
            | tee /tmp/pinned-phase0-clean/acceptance.json
      - name: Upload focused validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-expansion-phase0-clean-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pinned-phase0-clean/
          if-no-files-found: warn
          retention-days: 14
