name: UI follow-up browser QA

on:
  push:
    branches:
      - chore/history-ui-exploration

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise requested refinements in Chrome
        run: |
          cat > site/_qa_followup.html <<'EOF'
          <!doctype html><html><body>
          <iframe id="mobile" src="/index.html#team/missouri" style="width:390px;height:844px;border:0"></iframe>
          <iframe id="desktop" src="/index.html#team/missouri" style="width:1200px;height:900px;border:0"></iframe>
          <pre id="out">RUNNING</pre>
          <script>
          const checks=[];
          const delay=(ms)=>new Promise(r=>setTimeout(r,ms));
          function check(name,pass,detail=''){checks.push(`${pass?'PASS':'FAIL'}: ${name}${detail?` :: ${detail}`:''}`)}
          async function ready(frame){for(let i=0;i<50;i++){if(frame.contentDocument?.querySelector('#opponentSort'))return;await delay(100)}throw new Error(`${frame.id} did not render`)}
          async function run(){
            try{
              const mobile=document.getElementById('mobile'),desktop=document.getElementById('desktop');
              await ready(mobile); await ready(desktop);
              const md=mobile.contentDocument,mw=mobile.contentWindow,dd=desktop.contentDocument,dw=desktop.contentWindow;

              check('game log colors removed',dd.querySelectorAll('#teamGamesTable .school-color-link').length===0,String(dd.querySelectorAll('#teamGamesTable .school-color-link').length));
              check('opponent record colors added',dd.querySelectorAll('.opponent-breakdown .school-color-link').length>0,String(dd.querySelectorAll('.opponent-breakdown .school-color-link').length));
              check('opponent explanatory tagline removed',!dd.querySelector('.opponent-breakdown .data-note'));
              const recordLink=md.querySelector('.opponent-breakdown .series-link');
              check('mobile opponent names are left aligned',mw.getComputedStyle(recordLink).textAlign==='left',mw.getComputedStyle(recordLink).textAlign);

              const groupLabel=md.getElementById('groupByConference').closest('.opponent-breakdown-control');
              const toggle=groupLabel.querySelector('.toggle-switch');
              const sortLabel=md.getElementById('opponentSort').closest('.opponent-breakdown-control');
              check('group by conference uses switch',!!toggle&&!!groupLabel.querySelector('.toggle-slider'));
              check('mobile group label left control right',toggle.getBoundingClientRect().left>groupLabel.getBoundingClientRect().left+groupLabel.getBoundingClientRect().width/2,`${groupLabel.getBoundingClientRect().left.toFixed(0)} -> ${toggle.getBoundingClientRect().left.toFixed(0)}`);
              check('mobile sort label left dropdown right',md.getElementById('opponentSort').getBoundingClientRect().left>sortLabel.getBoundingClientRect().left+sortLabel.getBoundingClientRect().width/2);

              const teamLoc=dd.getElementById('locationFilter'),teamLocClear=dd.getElementById('locationFilterClear');
              teamLoc.value='Kansas City, MO'; dw.updateTeamGames('missouri',0,true); await delay(60);
              check('team location selected value has clear button',!teamLocClear.hidden);
              dw.clearTeamSearchFilter('missouri','locationFilter'); await delay(60);
              check('team location can return to all',teamLoc.value===''&&teamLocClear.hidden);
              const teamVenue=dd.getElementById('venueFilter'),teamVenueClear=dd.getElementById('venueFilterClear');
              const venueOption=dd.querySelector('#venueFilterOptions option');
              if(venueOption){teamVenue.value=venueOption.value;dw.updateTeamGames('missouri',0,true);await delay(60);check('team venue selected value has clear button',!teamVenueClear.hidden);dw.clearTeamSearchFilter('missouri','venueFilter');await delay(60);check('team venue can return to all',teamVenue.value===''&&teamVenueClear.hidden)}

              dw.location.hash='matchup/missouri/kansas'; await delay(700);
              const sd=desktop.contentDocument,sw=desktop.contentWindow;
              const teamTitles=[...sd.querySelectorAll('.matchup-team-name')];
              check('series school and nickname are separate lines',teamTitles.length===2&&teamTitles.every(t=>t.querySelector('.matchup-school-name')&&t.querySelector('.matchup-nickname')));
              const school=sd.querySelector('.matchup-school-name'),nickname=sd.querySelector('.matchup-nickname');
              check('series nickname is smaller',parseFloat(sw.getComputedStyle(nickname).fontSize)<parseFloat(sw.getComputedStyle(school).fontSize),`${sw.getComputedStyle(school).fontSize} / ${sw.getComputedStyle(nickname).fontSize}`);
              check('series school name alone is linked',school.matches('button.team-title-link')&&!nickname.matches('button'));
              const metrics=[...sd.querySelectorAll('.match-metrics .metric')];
              const current=metrics.find(card=>card.textContent.includes('Current Streak'));
              check('current streak has year note',!!current?.querySelector('small')&&current.querySelector('small').textContent.trim()!=='—',current?.querySelector('small')?.textContent||'none');
              check('NCAA card says Tournament Games',metrics.some(card=>card.textContent.includes('NCAA Tournament Games'))&&!metrics.some(card=>card.textContent.includes('NCAA Tournament Series')));
              const seriesLoc=sd.getElementById('matchupLocationFilter'),seriesLocClear=sd.getElementById('matchupLocationFilterClear');
              const seriesLocOption=sd.querySelector('#matchupLocationOptions option');
              if(seriesLocOption){seriesLoc.value=seriesLocOption.value;sw.updateMatchupHistory('missouri','kansas');await delay(60);check('series location selected value has clear button',!seriesLocClear.hidden);sw.clearMatchupSearchFilter('missouri','kansas','matchupLocationFilter');await delay(60);check('series location can return to all',seriesLoc.value===''&&seriesLocClear.hidden)}
              const seriesVenue=sd.getElementById('matchupVenueFilter'),seriesVenueClear=sd.getElementById('matchupVenueFilterClear');
              const seriesVenueOption=sd.querySelector('#matchupVenueOptions option');
              if(seriesVenueOption){seriesVenue.value=seriesVenueOption.value;sw.updateMatchupHistory('missouri','kansas');await delay(60);check('series venue selected value has clear button',!seriesVenueClear.hidden);sw.clearMatchupSearchFilter('missouri','kansas','matchupVenueFilter');await delay(60);check('series venue can return to all',seriesVenue.value===''&&seriesVenueClear.hidden)}
            }catch(error){check('QA harness',false,error.stack||error.message)}
            document.getElementById('out').textContent=checks.join('\n');
          }
          window.addEventListener('load',()=>setTimeout(run,500));
          </script></body></html>
          EOF
          python -m http.server 8000 --directory site >/tmp/ui-followup-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep .2; done
          google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8000/_qa_followup.html >/tmp/ui-followup-dom.html
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          text=Path('/tmp/ui-followup-dom.html').read_text(encoding='utf-8')
          match=re.search(r'<pre id="out">(.*?)</pre>',text,re.S)
          if not match: raise SystemExit('QA output missing')
          output=unescape(re.sub(r'<[^>]+>','',match.group(1))).strip()
          print(output)
          failures=[line for line in output.splitlines() if line.startswith('FAIL:')]
          if failures: raise SystemExit(f'{len(failures)} browser checks failed')
          if output.count('PASS:')<15: raise SystemExit(f'expected >=15 passes, got {output.count("PASS:")}')
          PY
