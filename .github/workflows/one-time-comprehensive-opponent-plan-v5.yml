name: One-time comprehensive opponent identity plan v5
on:
  push:
    branches: [scratch/opponent-identity-comprehensive-plan-v5]
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 491419509f148fa64b830f05397d6b00bd1feff1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: comprehensive-opponent-plan-v4
          path: /tmp/v4
          github-token: ${{ github.token }}
          run-id: 33657308070
      - name: Verify recovered owner corpus and prior exact plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 491419509f148fa64b830f05397d6b00bd1feff1
          python - <<'PY'
          import csv,json
          old=json.load(open('/tmp/v4/plan-a.json'))
          assert old['git_head']=='25d4e02ea492ad2af96f4ae40822431db7ecc50a'
          assert old['plan_sha256']=='25b8eacc467760c27cabb061e533ced45ba0f3a3a467a22f13852cd56a2e4151'
          assert old['blockers']==[]
          assert (old['affected_canonical_game_count'],len(old['remap_only_canonical_game_ids']),len(old['canonical_pairs']),len(old['absorbed_canonical_game_ids']),len(old['retained_distinct_canonical_game_ids']),len(old['new_discrepancies']),len(old['venue_registry_additions']),len(old['venue_name_additions']))==(434,376,58,58,2,5,1,1)
          with open('/tmp/v4/v3/manifest.csv',encoding='utf-8-sig',newline='') as f: manifest=list(csv.DictReader(f))
          assert len(manifest)==173
          assert len({r['from_program_key'] for r in manifest})==122
          audit=json.load(open('/tmp/v4/v3/authoritative-owner-audit.json'))
          print('OWNER_AUDIT_TOP_LEVEL='+','.join(sorted(audit)))
          for k,v in sorted(audit.items()):
              if isinstance(v,list): print(f'OWNER_AUDIT_COUNT {k}={len(v)}')
              elif isinstance(v,dict): print(f'OWNER_AUDIT_DICT {k}={len(v)}')
              elif isinstance(v,(str,int,float,bool)) or v is None: print(f'OWNER_AUDIT_SCALAR {k}={v}')
          print('MANIFEST_ROWS=173 DISTINCT_KEY_REMAPS=122')
          PY
      - name: Generate exact-main v5 plan twice
        shell: bash
        run: |
          set -euo pipefail
          python tools/opponent_identity_bulk_transaction.py plan /tmp/v4/v3/manifest.csv /tmp/v4/v3/resolutions.json --output /tmp/plan-a.json
          python tools/opponent_identity_bulk_transaction.py plan /tmp/v4/v3/manifest.csv /tmp/v4/v3/resolutions.json --output /tmp/plan-b.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/plan-a.json')); b=json.load(open('/tmp/plan-b.json'))
          assert a['plan_sha256']==b['plan_sha256']
          assert a['git_head']=='491419509f148fa64b830f05397d6b00bd1feff1'
          assert a['blockers']==[], a['blockers']
          assert (a['affected_canonical_game_count'],len(a['remap_only_canonical_game_ids']),len(a['canonical_pairs']),len(a['absorbed_canonical_game_ids']),len(a['retained_distinct_canonical_game_ids']),len(a['new_discrepancies']),len(a['venue_registry_additions']),len(a['venue_name_additions']))==(434,376,58,58,2,5,1,1)
          print('PLAN_SHA256='+a['plan_sha256'])
          print('GIT_HEAD='+a['git_head'])
          print('AFFECTED=434 IN_PLACE=376 PAIRS=58 ABSORBED=58 RETAINED_DISTINCT=2 NEW_DISCREPANCIES=5 VENUES_ADDED=1 VENUE_NAMES_ADDED=1 BLOCKERS=0')
          PY
          sha256sum /tmp/v4/v3/manifest.csv /tmp/v4/v3/resolutions.json /tmp/plan-a.json /tmp/plan-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: comprehensive-opponent-plan-v5
          path: |
            /tmp/v4/v3/authoritative-owner-audit.json
            /tmp/v4/v3/manifest.csv
            /tmp/v4/v3/resolutions.json
            /tmp/plan-a.json
            /tmp/plan-b.json
          if-no-files-found: error
