name: VCU expansion Phase 0 one-shot preparer

on:
  push:
    branches:
      - scratch/vcu-expansion-phase0-prepare-20261114
    paths:
      - '.github/workflows/vcu-expansion-phase0-prepare.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: vcu-expansion-phase0-one-shot-prepare
  cancel-in-progress: false

jobs:
  prepare-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate exact preparer parts and submit guarded VCU request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .scratch/vcu-expansion-phase0/prepare.sh.00)" = "b7d68d4b44021db746017f83046032583a8c0642"
          test "$(git hash-object .scratch/vcu-expansion-phase0/prepare.sh.01)" = "da6950044f0fddb77cc8c6149b6c19e7d3b3520c"
          test "$(git hash-object .scratch/vcu-expansion-phase0/prepare.sh.02)" = "c5a0e1e2fd8b1d358737f0b546cd4a554d87082c"
          test "$(git hash-object .scratch/vcu-expansion-phase0/prepare.sh.03)" = "bac3cafd5c8b81addc8454928a81b61c23d34328"
          test "$(git hash-object .scratch/vcu-expansion-phase0/prepare.sh.04)" = "a1fa02c843e87742625b796124f675b87dfa950c"
          cat .scratch/vcu-expansion-phase0/prepare.sh.* > /tmp/vcu-prepare.sh
          bash /tmp/vcu-prepare.sh
      - name: Preserve read-only preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcu-expansion-phase0-preparation
          path: /tmp/vcu-prep-artifacts
          if-no-files-found: ignore
          retention-days: 30
