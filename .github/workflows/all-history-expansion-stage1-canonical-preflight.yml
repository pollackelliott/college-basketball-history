name: All-History expansion Stage 1 canonical preflight

on:
  pull_request:
    paths:
      - '.github/workflows/all-history-expansion-stage1-canonical-preflight.yml'

permissions:
  contents: read

jobs:
  ucf-exact-main-census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate exact main and census UCF canonical/reciprocal identities
        env:
          EXACT_MAIN: 4682d528bf62eee1ad9cd3d8114663882cb78bdf
          RESEARCH_BASE: 4682d528bf62eee1ad9cd3d8114663882cb78bdf
          SCHOOL_KEY: ucf
          START_YEAR: '1970'
          END_YEAR: '1983'
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse "$RESEARCH_BASE^{commit}")" = "$RESEARCH_BASE"
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import os
          import pathlib
          import subprocess

          main = os.environ["EXACT_MAIN"]
          base = os.environ["RESEARCH_BASE"]
          school = os.environ["SCHOOL_KEY"]
          start = int(os.environ["START_YEAR"])
          end = int(os.environ["END_YEAR"])

          def git_raw(commit, path):
              return subprocess.check_output(["git", "show", f"{commit}:{path}"])

          def rows(raw):
              return list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"), newline="")))

          def in_window(value):
              try:
                  year = int((value or "")[:4])
              except ValueError:
                  return False
              return start <= year <= end

          package_files = (
              "source-games.csv", "opponents.csv", "venues.csv",
              "conferences.csv", "notes.md", "source-notes.md",
          )
          package_sha = {}
          for name in package_files:
              raw = git_raw(base, f"schools/{school}/{name}")
              if git_raw(main, f"schools/{school}/{name}") != raw:
                  raise SystemExit(f"inherited school package drift: {name}")
              package_sha[name] = hashlib.sha256(raw).hexdigest()

          canonical = []
          for row in rows(git_raw(main, "data/canonical/games.csv")):
              if in_window(row.get("season_label", "")) and school in {
                  row.get("team_a_key", ""), row.get("team_b_key", "")
              }:
                  canonical.append(row)

          paths = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", main, "--", "schools"],
              text=True, encoding="utf-8"
          ).splitlines()
          source_paths = [
              path for path in paths
              if path.endswith("/source-games.csv")
              and path != f"schools/{school}/source-games.csv"
          ]
          reciprocal = []
          for path in source_paths:
              for row in rows(git_raw(main, path)):
                  if not in_window(row.get("season_label", "")):
                      continue
                  normalized = (row.get("normalized_opponent_key", "") or "").strip()
                  literal = (row.get("source_opponent_label", "") or "").strip().casefold()
                  curated = (row.get("curated_opponent_name", "") or "").strip().casefold()
                  if (
                      normalized == school
                      or literal in {"ucf", "central florida", "florida technological university"}
                      or curated in {"ucf", "central florida", "florida technological university"}
                  ):
                      reciprocal.append({"source_path": path, **row})

          cfields = [
              "canonical_game_id", "season_label", "game_date",
              "team_a_key", "team_b_key", "team_a_score", "team_b_score",
              "game_type", "site_type", "venue_name", "city", "state"
          ]
          rfields = [
              "source_path", "source_program_key", "source_game_id", "season_label",
              "game_date", "source_opponent_label", "normalized_opponent_key",
              "team_score", "opponent_score", "played_result",
              "curated_game_type", "curated_site_type", "canonical_game_id", "raw_text"
          ]
          crows = [{field: row.get(field, "") for field in cfields} for row in canonical]
          rrows = [{field: row.get(field, "") for field in rfields} for row in reciprocal]
          crows.sort(key=lambda row: (
              row["season_label"], row["game_date"], row["canonical_game_id"]
          ))
          rrows.sort(key=lambda row: (
              row["season_label"], row["game_date"], row["source_path"], row["source_game_id"]
          ))

          report = {
              "kind": "UCF_ALL_HISTORY_STAGE1_CURRENT_MAIN_CANONICAL_RECIPROCAL_PRECHECK",
              "status": "READ_ONLY_PRECHECK_NOT_FULL_STAGE1",
              "protected_main_sha": main,
              "research_base_sha": base,
              "school_key": school,
              "season_start_year": start,
              "season_end_year": end,
              "unchanged_inherited_school_members_sha256": package_sha,
              "canonical_count": len(crows),
              "reciprocal_source_count": len(rrows),
              "canonical_rows": crows,
              "reciprocal_rows": rrows,
          }
          raw = (
              json.dumps(report, sort_keys=True, indent=2, ensure_ascii=False) + "\n"
          ).encode()
          out = pathlib.Path("ucf-stage1-canonical-reciprocal-precheck.json")
          out.write_bytes(raw)
          print("CANONICAL_COUNT", len(crows))
          print("RECIPROCAL_SOURCE_COUNT", len(rrows))
          print("REPORT_SHA256", hashlib.sha256(raw).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ucf-stage1-canonical-reciprocal-precheck
          path: ucf-stage1-canonical-reciprocal-precheck.json
          retention-days: 30

# disposable synchronization trigger for UCF Stage 1
