name: Research Stage 3A-0 portable tool

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact protected-main commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exact Stage 3A-0 tool bundle
        run: |
          python tools/research_stage3a0_portable.py build \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/research-stage3a0-tool" \
            --main-sha "${{ github.sha }}"

      - name: Verify exact Stage 3A-0 tool bundle
        run: |
          python tools/research_stage3a0_portable.py verify \
            "$RUNNER_TEMP/research-stage3a0-tool" \
            --main-sha "${{ github.sha }}"

      - name: Publish exact-SHA Stage 3A-0 tool bundle
        uses: actions/upload-artifact@v4
        with:
          name: research-stage3a0-tool-${{ github.sha }}
          path: ${{ runner.temp }}/research-stage3a0-tool
          if-no-files-found: error
          retention-days: 7
