name: Air Force Stage 4 accepted-ledger compatibility CI
on:
  push:
    branches:
      - repair/air-force-stage4-ledger-compatibility
permissions:
  contents: read
jobs:
  test-and-rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate tool repair
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: repaired
      - name: Checkout original accepted Air Force Stage 3B COMPLETE checkpoint
        uses: actions/checkout@v4
        with:
          ref: 53ae4f1bfd15c9b67e8c6f4ba2907c49eeb85745
          persist-credentials: false
          path: accepted
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute permanent Stage 4 and closeout regression suites
        shell: bash
        run: |
          set -euo pipefail
          cd repaired
          PYTHONPATH=tools python -m unittest discover -s tests -p 'test_research_stage4.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests -p 'test_research_stage4_closeout.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests -p 'test_research_stage4_portable.py' -v
      - name: Authenticate exact accepted 0048 input and assemble deterministic ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C accepted rev-parse HEAD)" = "53ae4f1bfd15c9b67e8c6f4ba2907c49eeb85745"
          mkdir -p "$RUNNER_TEMP/air-force-rehearsal"
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile,os
          root=Path('accepted/research/air-force/stage3b/completion-0048')
          manifest=json.loads((root/'manifest.json').read_bytes())
          assert manifest['status']=='COMPLETE'
          assert manifest['protected_main_sha']=='242370fc551fd749c157c74d92917ddfafbe40e0'
          assert len(manifest['files'])==16
          for item in manifest['files']:
              data=(root/item['name']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['name']
              assert len(data)==item['bytes'],item['name']
          target=Path(os.environ['RUNNER_TEMP'])/'accepted-0048.zip'
          with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_STORED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      info=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_STORED
                      info.external_attr=0o100644<<16
                      z.writestr(info,p.read_bytes())
          expected='c16590d92fe2bf013acde3edd0eebd7eed68bb132421c017b57c41162c356945'
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          assert digest==expected,(digest,expected)
          print('Authentic unchanged 0048 exact deterministic ZIP:',digest)
          PY
      - name: Run repaired permanent authoring command against frozen Stage 3B
        id: stage4
        shell: bash
        run: |
          set +e
          (cd repaired && PYTHONPATH=tools python tools/research_stage4.py author air-force "$RUNNER_TEMP/accepted-0048.zip" --main-sha 242370fc551fd749c157c74d92917ddfafbe40e0 --output-dir "$RUNNER_TEMP/air-force-rehearsal") > "$RUNNER_TEMP/air-force-rehearsal/permanent-tool-console.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/air-force-rehearsal/permanent-tool-exit-code.txt"
          echo "tool_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Independently classify whole remaining validator population
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,os,csv,collections
          root=Path(os.environ['RUNNER_TEMP'])/'air-force-rehearsal'
          pre=json.loads((root/'stage4-authoring-preflight.json').read_text())
          assert pre['status']=='PASS',pre
          assert pre['ledger_rows']==1928
          check=json.loads((root/'closeout/stage4-research-check.json').read_text())
          errors=check['errors']
          assert len(errors)==1,{'observed':len(errors),'first':errors[:15]}
          assert 'SOURCE_PROGRAM_HOME' in errors[0] and 'Alumni Hall' in errors[0] and 'AF-1959-60-006' in errors[0],errors
          with (root/'package/source-games.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==1928
          assert all(row['team_score'].isdigit() and row['opponent_score'].isdigit() for row in rows)
          assert sum(bool(row['raw_text']) for row in rows)==1928
          assert sum(bool(row['source_page']) for row in rows)==1865
          assert sum(bool(row['site_research_status']) for row in rows)>=67
          ids={row['source_game_id']:row for row in rows}
          for game_id,expected in {
              'AF-1999-00-014':'3',
              'AF-1999-00-019':'1',
              'AF-2000-01-009':'1',
          }.items():
              assert ids[game_id]['overtime_periods']==expected,(game_id,ids[game_id]['overtime_periods'])
          for game_id in ['AF-1985-86-008','AF-1985-86-009','AF-1996-97-008','AF-1998-99-008']:
              assert ids[game_id]['site_research_status'] in {'RESEARCHED_PARTIAL','RESEARCHED_UNRESOLVED'}
              assert ids[game_id]['site_research_basis']
          notes=(root/'package/source-notes.md').read_text()
          assert 'goairforcefalcons.com' in notes
          summary={'stage4_preflight':'PASS','research_acceptance':'ONE_VERIFIED_HISTORICAL_CONTRADICTION','validator_errors':errors,'game_rows':1928,'all_scores_preserved':True,'raw_guide_literal_rows':1928,'source_page_rows':1865,'neutral_research_status_preserved':4}
          (root/'rehearsal-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Preserve exactly rehearsed generated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: air-force-stage4-compatibility-exact-rehearsal
          path: ${{ runner.temp }}/air-force-rehearsal/
          if-no-files-found: warn
          retention-days: 14
