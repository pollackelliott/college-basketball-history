name: All-History expansion Stage 1 foundation

on:
  pull_request:
    paths:
      - 'tools/expansion_implementation_stage1.py'
      - 'tests/test_expansion_implementation_stage1.py'
      - 'tools/all_history_expansion_venue_guard.py'
      - 'tests/test_all_history_expansion_venue_guard.py'
      - 'tools/stage1_venue_reconciliation.py'
      - 'tests/test_stage1_venue_reconciliation.py'
      - 'tools/all_history_expansion_remote_contract.py'
      - 'tests/test_all_history_expansion_remote_contract.py'
      - 'tests/test_all_history_expansion_disposable_git_transaction.py'
      - 'tools/all_history_expansion_phase0_preview.py'
      - 'tests/test_all_history_expansion_phase0_preview.py'
      - 'tools/all_history_expansion_integration.py'
      - 'tests/test_all_history_expansion_integration.py'
      - 'tools/remote_implementation_control.py'
      - 'tools/remote_implementation_runner.py'
      - 'tools/remote_implementation_verify.py'
      - 'tools/remote_implementation_expansion_phase0.py'
      - 'tests/test_remote_implementation_expansion_phase0.py'
      - '.github/workflows/remote-implementation.yml'
      - '.github/workflows/all-history-expansion-stage1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expansion-stage1-and-nonregression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Expansion Stage 1 focused regression
        run: python -m unittest discover -s tests -p 'test_expansion_implementation_stage1.py' -v
      - name: Expansion venue identity and remote transaction pure-contract regressions
        run: |
          python -m unittest discover -s tests -p 'test_all_history_expansion_venue_guard.py' -v
          python -m unittest discover -s tests -p 'test_stage1_venue_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_all_history_expansion_remote_contract.py' -v
          python -m unittest discover -s tests -p 'test_all_history_expansion_disposable_git_transaction.py' -v
          python -m unittest discover -s tests -p 'test_all_history_expansion_phase0_preview.py' -v
          python -m unittest discover -s tests -p 'test_all_history_expansion_integration.py' -v
          python -m unittest discover -s tests -p 'test_remote_implementation_expansion_phase0.py' -v
      - name: Full repository unittest nonregression
        run: python -m unittest discover -s tests -p 'test_*.py'
