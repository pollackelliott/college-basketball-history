name: Refine sticky team title layout

on:
  push:
    branches:
      - chore/sticky-team-context-title

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/sticky-team-context-title
          fetch-depth: 0

      - name: Refine top navigation layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('site/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'grid-template-areas:"brand nav title search"'
          if marker in text:
              print('Three-zone sticky title layout already implemented')
              raise SystemExit(0)

          replacements = [
              (
                  '.topbar-inner{max-width:1280px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;min-width:0;position:relative}',
                  '.topbar-inner{max-width:1280px;margin:0 auto;padding:14px 22px;display:grid;grid-template-columns:auto auto minmax(0,1fr) minmax(280px,350px);grid-template-areas:"brand nav title search";align-items:center;gap:16px;min-width:0}'
              ),
              (
                  '.brand{border:0;background:transparent;color:inherit;padding:0;text-align:left;font-family:Graduate,"Rockwell Extra Bold",Rockwell,"Arial Black",serif;font-size:22px;letter-spacing:.055em;cursor:pointer;white-space:nowrap;text-transform:uppercase}',
                  '.brand{grid-area:brand;border:0;background:transparent;color:inherit;padding:0;text-align:left;font-family:Graduate,"Rockwell Extra Bold",Rockwell,"Arial Black",serif;font-size:22px;letter-spacing:.055em;cursor:pointer;white-space:nowrap;text-transform:uppercase}'
              ),
              (
                  '.navlinks{display:flex;gap:4px}',
                  '.navlinks{grid-area:nav;display:flex;gap:4px}'
              ),
              (
                  '.searchbox{margin-left:auto;position:relative;width:min(350px,36vw)}',
                  '.searchbox{grid-area:search;margin-left:0;position:relative;width:100%;min-width:0}'
              ),
              (
                  '@media(max-width:720px){.team-context-title{max-width:36vw;padding:5px 8px;border-radius:6px;font-size:15px;letter-spacing:.015em}}',
                  '@media(max-width:720px){.team-context-title{max-width:100%;padding:5px 8px;border-radius:6px;font-size:15px;letter-spacing:.015em}}'
              ),
              (
                  '@media(max-width:950px){.statbar{grid-template-columns:repeat(2,minmax(0,1fr))}.match-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.subgrid{grid-template-columns:1fr}.searchbox{display:none}.mobile-search-toggle{display:block}.navlinks{margin-left:auto}}',
                  '@media(max-width:950px){.statbar{grid-template-columns:repeat(2,minmax(0,1fr))}.match-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.subgrid{grid-template-columns:1fr}.topbar-inner{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand title nav"}.searchbox{display:none}.mobile-search-toggle{display:block}.navlinks{margin-left:0}}'
              ),
              (
                  '.topbar-inner{padding:9px 10px;gap:5px}.brand{font-size:16px;letter-spacing:.035em}.brand small{display:none}.navlinks{gap:0}.navlinks button{min-height:44px;padding:8px 7px;font-size:12px}',
                  '.topbar-inner{padding:8px 10px;gap:8px}.brand{width:58px;white-space:normal;font-size:15px;line-height:.95;letter-spacing:.035em}.brand small{display:none}.navlinks{gap:0;flex-direction:column;align-items:flex-end}.navlinks button{min-height:26px;padding:2px 4px;font-size:10px;line-height:1.05}'
              ),
              (
                  '@media(max-width:360px){.brand{font-size:14px}.navlinks button{font-size:11px;padding:7px 5px}',
                  '@media(max-width:360px){.brand{font-size:14px}.navlinks button{font-size:9px;padding:2px 3px}'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement target, found {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          pattern = re.compile(r'\.team-context-title\{position:absolute;left:50%;top:50%;max-width:min\(38vw,420px\);transform:translate\(-50%,-50%\) translateY\(-4px\);(.*?)\}\.team-context-title\.visible\{opacity:1;visibility:visible;transform:translate\(-50%,-50%\) translateY\(0\);transition-delay:0s\}')
          match = pattern.search(text)
          if not match:
              raise SystemExit('Expected current team-context-title positioning rule')
          middle = match.group(1)
          replacement = '.team-context-title{grid-area:title;justify-self:center;max-width:100%;min-width:0;transform:translateY(-4px);' + middle + '}.team-context-title.visible{opacity:1;visibility:visible;transform:translateY(0);transition-delay:0s}'
          text = pattern.sub(replacement, text, count=1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Browser QA navigation geometry
        run: |
          cat > site/_qa_team_title_layout.html <<'EOF'
          <!doctype html><html><body><iframe id="app" style="width:390px;height:844px;border:0" src="/index.html#team/mississippi-state"></iframe><pre id="out">RUNNING</pre><script>
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          async function waitFor(fn){for(let i=0;i<100;i++){try{const v=fn();if(v)return v}catch{}await delay(100)}throw new Error('timeout')}
          window.addEventListener('load',()=>setTimeout(async()=>{
            const lines=[], f=document.getElementById('app'), w=f.contentWindow, d=f.contentDocument;
            try{
              await waitFor(()=>d.getElementById('teamPageTitle'));
              w.scrollTo(0,1200); await delay(300);
              const inner=d.querySelector('.topbar-inner'), brand=d.querySelector('.brand'), nav=d.querySelector('.navlinks'), title=d.getElementById('teamContextTitle');
              const br=brand.getBoundingClientRect(), nr=nav.getBoundingClientRect(), tr=title.getBoundingClientRect();
              lines.push(`${getComputedStyle(inner).display==='grid'?'PASS':'FAIL'}: top navigation uses grid`);
              lines.push(`${getComputedStyle(nav).flexDirection==='column'?'PASS':'FAIL'}: mobile Teams/Search stack vertically`);
              lines.push(`${br.height>24?'PASS':'FAIL'}: mobile CBB HISTORY wraps into a compact two-line brand :: ${br.height.toFixed(1)}px`);
              lines.push(`${tr.left>=br.right-1&&tr.right<=nr.left+1?'PASS':'FAIL'}: mobile badge stays inside usable center zone :: ${tr.left.toFixed(1)}-${tr.right.toFixed(1)} between ${br.right.toFixed(1)} and ${nr.left.toFixed(1)}`);
              lines.push(`${title.scrollWidth<=title.clientWidth?'PASS':'FAIL'}: Mississippi State remains unclipped :: ${title.scrollWidth}/${title.clientWidth}`);
              f.style.width='1100px'; await delay(300); w.dispatchEvent(new Event('resize')); await delay(200); w.scrollTo(0,1200); await delay(200);
              const navD=d.querySelector('.navlinks').getBoundingClientRect(), searchD=d.querySelector('.searchbox').getBoundingClientRect(), titleD=d.getElementById('teamContextTitle').getBoundingClientRect();
              const actual=(titleD.left+titleD.right)/2, expected=(navD.right+searchD.left)/2;
              lines.push(`${Math.abs(actual-expected)<3?'PASS':'FAIL'}: desktop badge centers in usable middle zone :: actual ${actual.toFixed(1)}, expected ${expected.toFixed(1)}`);
              lines.push(`${getComputedStyle(d.querySelector('.navlinks')).flexDirection==='row'?'PASS':'FAIL'}: desktop nav remains horizontal`);
            }catch(e){lines.push(`FAIL: ${e.message}`)}
            document.getElementById('out').textContent=lines.join('\n');
          },500));
          </script></body></html>
          EOF
          python -m http.server 8000 --directory site >/tmp/ui-title-layout-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep .2; done
          google-chrome --headless=new --disable-gpu --no-sandbox --window-size=1150,930 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8000/_qa_team_title_layout.html >/tmp/ui-title-layout-dom.html
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          text=Path('/tmp/ui-title-layout-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<pre id="out">(.*?)</pre>', text, re.S)
          if not m: raise SystemExit('QA output missing')
          output=unescape(re.sub(r'<[^>]+>','',m.group(1))).strip()
          print(output)
          fails=[line for line in output.splitlines() if line.startswith('FAIL:')]
          if fails: raise SystemExit(f'{len(fails)} navigation geometry checks failed')
          if output.count('PASS:') != 7: raise SystemExit(f'Expected 7 passes, got {output.count("PASS:")}')
          PY

      - name: Validate repository
        run: |
          rm -f site/_qa_team_title_layout.html
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_data.py
          PYTHONDONTWRITEBYTECODE=1 python tools/build_site_data.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          git diff --check

      - name: Commit production change
        run: |
          rm -f site/_qa_team_title_layout.html
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add site/index.html
          if git diff --cached --quiet; then
            echo "No production change to commit"
            exit 0
          fi
          git commit -m "Balance sticky team title navigation"
          git push origin HEAD:chore/sticky-team-context-title
