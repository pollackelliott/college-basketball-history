name: Miami correction Stage 2 Gate 1 fill validation 0001

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/miami-correction-stage2-gate1-fill-validate-0001.yml"

permissions:
  contents: read

jobs:
  validate-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Authenticate current authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main control/remote-implementation data/miami-correction
          test "$(git rev-parse origin/main)" = "66795cf099c05e272f590fa6d2ffb10c262d6b56"
          test "$(git rev-parse origin/control/remote-implementation)" = "c0822fe40bdd00c17bd8a3078115f5c21d497af3"
          test "$(git rev-parse origin/data/miami-correction)" = "109fb1d5bcf880c8866380e8504b22a86dbed4f1"
          python - <<'PY'
          import json, subprocess
          c=json.loads(subprocess.check_output([
            "git","show","origin/control/remote-implementation:.remote-implementation/control-state.json"
          ]))
          assert c["lifecycle_state"]=="IDLE"
          assert c["transaction_state"]=="COMPLETE"
          assert c["recovery_required"] is False
          assert c.get("active_request_id") is None
          last=c["last_operation"]
          assert last["request_id"]=="miami-correction-stage2-proposal-0002"
          assert last["stage2_status"]=="OWNER_GATE_1_READY"
          assert last["fresh_runner_verification"]=="PASS"
          assert last["remote_stage2_proposal_equivalence"]=="PASS"
          PY
      - name: Validate exact Gate 1 fill request
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {
            "schema_version": 1,
            "kind": "REMOTE_IMPLEMENTATION_REQUEST",
            "request_id": "miami-correction-stage2-gate1-fill-0001",
            "school_key": "miami",
            "operation": "STAGE2_GATE1_FILL",
            "expected_protected_main_sha": "66795cf099c05e272f590fa6d2ffb10c262d6b56",
            "target_branch": "data/miami-correction",
            "target_sha": "109fb1d5bcf880c8866380e8504b22a86dbed4f1",
            "stage2_proposal_checkpoint": {
              "path": ".remote-implementation/checkpoints/miami/miami-correction-stage2-proposal-0002/checkpoint-manifest.json",
              "sha256": "35096fe5e968d35c07fc721d6781dcf249da42742ddca662a3dbfe5da5237c0e"
            },
            "stage2_proposal_verification": {
              "path": ".remote-implementation/verifications/miami/miami-correction-stage2-proposal-0002/stage2-proposal-rehearsal-verification.json",
              "sha256": "a10640bf3e5cf184e423692da1d5ac61589c3bc9778cfce1615c0bb7809e26a7"
            },
            "integration_freeze_sha256": "e40e76155c6630d4650635ba0510ee166b5a2fa667cbb19dfa263fdbbf250618",
            "semantic_snapshot_sha256": "c4021b044a82e8f9edf095cd1d35c0a3ae7ed2520ba048e8495a55eef11b385d",
            "decision_universe_sha256": "4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945",
            "recommendation_map_sha256": "a1e9d918688481805370028100116a39d639541cf098599e7a397aa99cce8d77",
            "approved_plan_hash_preview": "20d23846891d8a2390d2f7f0395930304f90edd8ae2a1535479236e56db8a57d",
            "owner_gate_1_approval": {
              "approved": true,
              "approval_basis": "Owner explicitly approved the exact Miami zero-decision correction proposal at Owner Gate 1 by stating 'Approved. Proceed.' after presentation of OWNER_GATE_1_READY. This approval binds only proposal checkpoint 35096fe5e968d35c07fc721d6781dcf249da42742ddca662a3dbfe5da5237c0e, decision universe 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945, recommendation map a1e9d918688481805370028100116a39d639541cf098599e7a397aa99cce8d77, and approved-plan preview 20d23846891d8a2390d2f7f0395930304f90edd8ae2a1535479236e56db8a57d. It authorizes Gate 1 fill/sealing workflow only and does not authorize Preview, Owner Gate 2, merge, Production, Miami expansion Stage 7, or unrelated mutation.",
              "proposal_checkpoint_sha256": "35096fe5e968d35c07fc721d6781dcf249da42742ddca662a3dbfe5da5237c0e",
              "decision_universe_sha256": "4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945",
              "recommendation_map_sha256": "a1e9d918688481805370028100116a39d639541cf098599e7a397aa99cce8d77",
              "approved_plan_hash_preview": "20d23846891d8a2390d2f7f0395930304f90edd8ae2a1535479236e56db8a57d"
            },
            "creation_provenance": {
              "origin": "Miami post-publication package-only conference correction — explicit Owner Gate 1 approval",
              "authorization": "Owner explicitly approved the exact zero-decision OWNER_GATE_1_READY proposal. Authorize exactly one guarded STAGE2_GATE1_FILL against that fresh-verified proposal. No new historical decision, tracked mutation, preseal/seal/apply execution, Preview, Owner Gate 2, merge, Production, expansion Stage 7, recovery, maintenance, or unrelated authority is created by this request."
            },
            "authority": {
              "owner_gate_1": true,
              "owner_gate_2": false,
              "release": false,
              "phase0": false,
              "phase0_scope_supersession": false,
              "recovery": false,
              "stage2_census": false,
              "stage2_current_main_refresh": false,
              "stage2_opponent_display_normalize": false,
              "stage2_proposal_rehearsal": false,
              "stage2_gate1_fill": true,
              "stage2_preseal_rehearsal": false,
              "stage2_gate1_seal": false,
              "stage2_sealed_apply": false,
              "stage2_reconciliation_diagnostic": false,
              "release_readiness": false,
              "release_preview_verify": false,
              "release_gate2_approval": false,
              "release_presentation_refresh": false,
              "release_production_proof": false,
              "venue_identity_maintenance": false
            }
          }
          JSON
          python tools/remote_implementation_request_submit.py --template /tmp/request.json | tee /tmp/validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: miami-correction-stage2-gate1-fill-request-packet-0001
          path: |
            /tmp/request.json
            /tmp/validation.json
          retention-days: 30
