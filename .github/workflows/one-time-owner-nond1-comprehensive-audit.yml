          CSV

          python - <<'PY'
          import csv, json, re
          from collections import defaultdict, Counter
          from pathlib import Path

          def read_csv(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          def norm(value):
              value=(value or '').lower().replace('&',' and ')
              value=re.sub(r"[^a-z0-9]+",' ',value)
              return ' '.join(value.split())

          programs=read_csv('data/reference/programs.csv')
          aliases=read_csv('data/reference/program-names.csv')
          by_key={r['program_key'].strip():r for r in programs if r.get('program_key','').strip()}
          lookup=defaultdict(set)
          for r in programs:
              key=r.get('program_key','').strip()
              for name in (r.get('program_name',''), r.get('display_name','')):
                  if norm(name): lookup[norm(name)].add(key)
          for r in aliases:
              if r.get('verification_status','').strip()=='VERIFIED' and norm(r.get('alias_name','')):
                  lookup[norm(r['alias_name'])].add(r.get('program_key','').strip())

          # Human-facing names in the reviewed workbook that intentionally differ from
          # registry display spellings. Non-D1 target is explicit rather than guessed.
          target_overrides={
              'Arkansas-Monticello': ('arkansas-monticello', False),
              'Arkansas Pine Bluff': ('arkansas-pine-bluff', True),
              'Central Connecticut State': ('central-connecticut', True),
              'College of Charleston': ('charleston', True),
              'LaSalle': ('la-salle', True),
              'Pennsylvania': ('penn', True),
              'SIU Edwardsville': ('siu-edwardsville', True),
              'St. Joseph\'s': ('saint-josephs', True),
              'St. Mary\'s': ('saint-marys', True),
              'UNC Ashville': ('unc-asheville', True),
          }

          review=read_csv('/tmp/owner_scan.csv')
          results=[]; issues=[]
          status_counts=Counter(r['status'] for r in review)
          confirmed=[r for r in review if r['status']=='CONFIRMED']

          def resolve_target(name):
              if name in target_overrides:
                  return target_overrides[name][0], 'OVERRIDE'
              keys=sorted(k for k in lookup.get(norm(name),set()) if k)
              if len(keys)==1:
                  return keys[0], 'REGISTRY'
              if not keys:
                  return '', 'MISSING'
              return '|'.join(keys), 'AMBIGUOUS'

          for r in review:
              package=Path('schools')/r['program']/'opponents.csv'
              if not package.exists():
                  issues.append({'row':r['row'],'type':'MISSING_PACKAGE','detail':str(package)})
                  continue
              matches=[x for x in read_csv(package) if x.get('source_opponent_label','').strip()==r['label']]
              if len(matches)!=1:
                  issues.append({'row':r['row'],'type':'PACKAGE_MATCH_COUNT','detail':f"{r['program']} / {r['label']!r} => {len(matches)}"})
                  continue
              m=matches[0]
              target_key,target_source=resolve_target(r['target']) if r['status'] in {'CONFIRMED','PROBABLE'} else ('','NOT_REQUIRED')
              current_key=m.get('canonical_opponent_key','').strip()
              current_d1=m.get('current_d1','').strip()
              games=int(m.get('games_with_source_label','0') or 0)
              if r['status']=='CONFIRMED':
                  if target_source in {'MISSING','AMBIGUOUS'}:
                      mutation='TARGET_UNRESOLVED'
                  elif current_key==target_key:
                      mutation='ALREADY_CORRECT' if current_d1=='Yes' else 'FLAG_ONLY'
                  else:
                      mutation='KEY_REMAP'
              elif r['status']=='PROBABLE': mutation='PROBABLE_HOLD'
              elif r['status']=='HOLD': mutation='HOLD'
              else: mutation='KEEP'
              results.append({**r,'current_key':current_key,'current_name':m.get('canonical_opponent_name','').strip(),'current_d1':current_d1,'games':games,'target_key':target_key,'target_resolution':target_source,'mutation_class':mutation})

          confirmed_results=[x for x in results if x['status']=='CONFIRMED']
          mutation_counts=Counter(x['mutation_class'] for x in confirmed_results)
          target_issues=[x for x in confirmed_results if x['mutation_class']=='TARGET_UNRESOLVED']

          # Global remap consistency and blast-radius census.
          remaps=defaultdict(set)
          reviewed_usage=defaultdict(set)
          for x in confirmed_results:
              if x['mutation_class']=='KEY_REMAP':
                  remaps[x['current_key']].add(x['target_key'])
                  reviewed_usage[x['current_key']].add((x['program'],x['label']))
          inconsistent={k:sorted(v) for k,v in remaps.items() if len(v)!=1}

          all_usage=defaultdict(list)
          for opp in Path('schools').glob('*/opponents.csv'):
              program=opp.parent.name
              for x in read_csv(opp):
                  key=x.get('canonical_opponent_key','').strip()
                  if key in remaps:
                      all_usage[key].append((program,x.get('source_opponent_label','').strip(),int(x.get('games_with_source_label','0') or 0)))
          unreviewed_usage={}
          for key,items in all_usage.items():
              extra=[i for i in items if (i[0],i[1]) not in reviewed_usage[key]]
              if extra: unreviewed_usage[key]=extra

          canonical=read_csv('data/canonical/games.csv')
          assertions=read_csv('data/evidence/game-assertions.csv')
          remap_stats={}
          for key,targets in sorted(remaps.items()):
              if len(targets)!=1: continue
              target=next(iter(targets))
              cids=[r.get('canonical_game_id','').strip() for r in canonical if key in {r.get('team_a_key','').strip(),r.get('team_b_key','').strip()}]
              acount=sum(1 for r in assertions if r.get('normalized_opponent_key','').strip()==key)
              remap_stats[key]={'target':target,'canonical_rows':len(cids),'assertions':acount,'reviewed_package_rows':len(reviewed_usage[key]),'all_package_rows':len(all_usage[key]),'unreviewed_package_rows':len(unreviewed_usage.get(key,[]))}

          payload={
              'git_head': __import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'review_rows':len(review),
              'status_counts':dict(status_counts),
              'confirmed_rows':len(confirmed_results),
              'confirmed_mutation_counts':dict(mutation_counts),
              'issues':issues,
              'target_issues':target_issues,
              'inconsistent_global_remaps':inconsistent,
              'global_remap_count':len(remaps),
              'global_remap_stats':remap_stats,
              'unreviewed_global_key_usage':unreviewed_usage,
              'results':results,
          }
          Path('/tmp/owner-scan-audit.json').write_text(json.dumps(payload,indent=2,sort_keys=True))

          print('OWNER_SCAN_AUDIT_HEAD='+payload['git_head'])
          print('REVIEW_ROWS='+str(payload['review_rows']))
          print('STATUS_COUNTS='+json.dumps(payload['status_counts'],sort_keys=True))
          print('CONFIRMED_MUTATION_COUNTS='+json.dumps(payload['confirmed_mutation_counts'],sort_keys=True))
          print('PACKAGE_ISSUES='+str(len(issues)))
          print('TARGET_ISSUES='+str(len(target_issues)))
          print('GLOBAL_REMAP_KEYS='+str(len(remaps)))
          print('INCONSISTENT_GLOBAL_REMAPS='+str(len(inconsistent)))
          print('REMAP_KEYS_WITH_UNREVIEWED_PACKAGE_USAGE='+str(len(unreviewed_usage)))
          for x in target_issues:
              print('TARGET_ISSUE|'+x['row']+'|'+x['program']+'|'+x['label']+'|'+x['target']+'|'+x['target_resolution'])
          for x in issues:
              print('PACKAGE_ISSUE|'+x['row']+'|'+x['type']+'|'+x['detail'])
          for key,targets in sorted(inconsistent.items()):
              print('INCONSISTENT_REMAP|'+key+'|'+','.join(targets))
          for key,extra in sorted(unreviewed_usage.items()):
              print('UNREVIEWED_USAGE|'+key+'|'+json.dumps(extra,separators=(',',':')))
          print('--- CONFIRMED ROW CLASSIFICATIONS ---')
          for x in confirmed_results:
              print('|'.join([x['row'],x['program'],x['label'],x['mutation_class'],x['current_key'],x['target_key'],x['current_d1'],str(x['games'])]))
          PY

          cat /tmp/owner-scan-audit.json | sha256sum | awk '{print "OWNER_SCAN_AUDIT_SHA256="$1}'