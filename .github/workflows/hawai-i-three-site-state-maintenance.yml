name: Hawai'i exact three-row canonical site-state maintenance

on:
  push:
    branches:
      - maintenance/hawai-i-kansas-three-site-states
    paths:
      - .github/workflows/hawai-i-three-site-state-maintenance.yml

permissions:
  contents: write

concurrency:
  group: hawai-i-three-site-state-maintenance
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact authorized maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/hawai-i-kansas-three-site-states
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate exact authority, evidence, and idle control
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/control/remote-implementation:refs/remotes/origin/control/remote-implementation \
            +refs/heads/data/hawai-i-onboarding:refs/remotes/origin/data/hawai-i-onboarding
          python - <<'PY'
          import csv, io, json, subprocess
          from pathlib import Path

          MAIN = "36b8e829e7e5ffde7390ec7ef00816cda3d7f663"
          CONTROL = "f7485b931e8ced821e38896b814f5f05d780b40e"
          HAWAII = "03b47d1257d78e5f6d48f50ddcc52a554d67d64b"
          SPEC = Path("data/reconciliation/maintenance/hawai-i-kansas-three-site-states.json")
          IDS = ["CBBG-0013194", "CBBG-0013385", "CBBG-0013555"]

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          assert git("rev-parse", "origin/main") == MAIN
          assert git("merge-base", "HEAD", "origin/main") == MAIN
          assert git("rev-parse", "origin/control/remote-implementation") == CONTROL
          assert git("rev-parse", "origin/data/hawai-i-onboarding") == HAWAII
          assert git("rev-parse", "HEAD:data/canonical/games.csv") == "915e2be044c78255f52718a9251d26c2ba775cbb"
          assert git("rev-parse", "HEAD:site/data/teams/kansas.json") == "378dfdaf8a40388c0b37c81656b302aa5a98e524"
          assert git("rev-parse", "HEAD:schools/kansas/source-games.csv") == "0ea0407411ad5d0b62d1a2f92fdcc4e45ab3157c"
          assert git("rev-parse", "origin/data/hawai-i-onboarding:schools/hawai-i/source-games.csv") == "a88917acbedd32e7d6752ae7ab1108465465ca88"

          state = json.loads(git("show", "origin/control/remote-implementation:.remote-implementation/control-state.json"))
          assert state["current_sequence"] == 498
          assert state["lifecycle_state"] == "IDLE"
          assert state["transaction_state"] == "COMPLETE"
          assert state["recovery_required"] is False
          assert not state.get("active_request_id")
          assert not state.get("active_school_key")
          assert not state.get("active_lock_owner")
          last = state["last_operation"]
          assert last["request_id"] == "hawai-i-stage2-census-0001"
          assert last["school_key"] == "hawai-i"
          assert last["stage2_status"] == "BLOCKED"
          assert last["decision_universe_sha256"] == "341adf8512e6b12e4b637af970691bcbc005f5ebfa4e861155470f7edf5e7ccf"

          spec = json.loads(SPEC.read_text())
          assert spec["protected_main_predecessor_sha"] == MAIN
          assert spec["control_branch_predecessor_sha"] == CONTROL
          assert spec["hawai_i_onboarding_predecessor_sha"] == HAWAII
          assert spec["authorized_canonical_game_ids"] == IDS
          assert spec["authorized_field"] == "site_state"
          assert spec["expected_old_value"] == ""
          assert spec["required_new_value"] == "HI"
          assert spec["expected_unchanged_site_city"] == "Honolulu"
          assert spec["expected_final_changed_paths"] == [
              "data/canonical/games.csv",
              "data/reconciliation/maintenance/hawai-i-kansas-three-site-states.json",
              "site/data/teams/kansas.json",
          ]

          kansas = git("show", "HEAD:schools/kansas/source-games.csv")
          for sid, date in [
              ("KURAW-01970", "1986-12-30"),
              ("KURAW-02176", "1992-12-29"),
              ("KURAW-02357", "1997-12-30"),
          ]:
              hits = [r for r in csv.DictReader(io.StringIO(kansas)) if r["source_game_id"] == sid]
              assert len(hits) == 1 and hits[0]["game_date"] == date
              assert hits[0]["city"] == "Honolulu"
              assert "Honolulu" in hits[0]["raw_text"] and "Hawai" in hits[0]["raw_text"]

          hawaii = git("show", "origin/data/hawai-i-onboarding:schools/hawai-i/source-games.csv")
          for sid, date in [
              ("hawai-i-1986-87-011", "1986-12-30"),
              ("hawai-i-1992-93-007", "1992-12-29"),
              ("hawai-i-1997-98-011", "1997-12-30"),
          ]:
              hits = [r for r in csv.DictReader(io.StringIO(hawaii)) if r["source_game_id"] == sid]
              assert len(hits) == 1 and hits[0]["game_date"] == date
              assert hits[0]["city"] == "Honolulu" and hits[0]["state"] == "HI"

          print("PASS: exact authority, evidence, branch isolation, and global control")
          PY

      - name: Preserve before-state and prove exact partial population
        shell: bash
        run: |
          set -euo pipefail
          python tools/canonical_partial_location_census.py --repo . --output "$RUNNER_TEMP/before-census.json" >/dev/null
          cp site/data/teams/kansas.json "$RUNNER_TEMP/kansas-before.json"
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          ids = {"CBBG-0013194", "CBBG-0013385", "CBBG-0013555"}
          census = json.loads(Path(os.environ["RUNNER_TEMP"], "before-census.json").read_text())
          records = {r["canonical_game_id"]: r for r in census["records"]}
          assert ids <= records.keys()
          for gid in ids:
              row = records[gid]
              assert row["city"] == "Honolulu" and row["state"] == ""
              assert row["site_type"] == "NEUTRAL"
              assert row["venue_id"] == "" and row["venue_key"] == ""
          with Path("data/canonical/games.csv").open(newline="", encoding="utf-8-sig") as f:
              rows = {r["canonical_game_id"]: r for r in csv.DictReader(f) if r["canonical_game_id"] in ids}
          assert set(rows) == ids
          Path(os.environ["RUNNER_TEMP"], "canonical-before-targets.json").write_text(json.dumps(rows, sort_keys=True))
          print("BEFORE_PARTIAL_COUNT=", census["partial_canonical_count"])
          print("PASS: exact three authorized rows are partial before mutation")
          PY

      - name: Apply only site_state blank to HI on the three authorized canonical rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("data/canonical/games.csv")
          data = path.read_bytes()
          old_rows = [
              b"CBBG-0013194,1986-1987,1986-12-30,EXACT,hawai-i,kansas,80,81,kansas,1,NEUTRAL,,,,Honolulu,,REGULAR_SEASON,,,,PROVISIONAL,",
              b"CBBG-0013385,1992-1993,1992-12-29,EXACT,hawai-i,kansas,66,94,kansas,0,NEUTRAL,,,,Honolulu,,REGULAR_SEASON,,,,PROVISIONAL,",
              b"CBBG-0013555,1997-1998,1997-12-30,EXACT,hawai-i,kansas,76,65,hawai-i,0,NEUTRAL,,,,Honolulu,,REGULAR_SEASON,,,,PROVISIONAL,",
          ]
          new_rows = [row.replace(b",Honolulu,,REGULAR_SEASON", b",Honolulu,HI,REGULAR_SEASON") for row in old_rows]
          for old, new in zip(old_rows, new_rows):
              assert data.count(old) == 1, old[:20]
              assert data.count(new) == 0, new[:20]
              data = data.replace(old, new, 1)
          path.write_bytes(data)
          print("PASS: exactly three byte-bounded canonical row replacements applied")
          PY
          python tools/build_site_data.py . --apply > "$RUNNER_TEMP/build-site.log" 2>&1
          tail -20 "$RUNNER_TEMP/build-site.log"

      - name: Prove exact semantic diff and canonical census repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/canonical_partial_location_census.py --repo . --output "$RUNNER_TEMP/after-census.json" >/dev/null
          python - <<'PY'
          import copy, csv, json, os
          from pathlib import Path
          ids = {"CBBG-0013194", "CBBG-0013385", "CBBG-0013555"}
          before = json.loads(Path(os.environ["RUNNER_TEMP"], "canonical-before-targets.json").read_text())
          with Path("data/canonical/games.csv").open(newline="", encoding="utf-8-sig") as f:
              after = {r["canonical_game_id"]: r for r in csv.DictReader(f) if r["canonical_game_id"] in ids}
          assert set(after) == ids
          for gid in ids:
              expected = dict(before[gid])
              assert expected["site_city"] == "Honolulu"
              assert expected["site_state"] == ""
              expected["site_state"] = "HI"
              assert after[gid] == expected, (gid, before[gid], after[gid])

          before_census = json.loads(Path(os.environ["RUNNER_TEMP"], "before-census.json").read_text())
          after_census = json.loads(Path(os.environ["RUNNER_TEMP"], "after-census.json").read_text())
          after_ids = {r["canonical_game_id"] for r in after_census["records"]}
          assert not (ids & after_ids)
          assert after_census["canonical_game_count"] == before_census["canonical_game_count"]
          assert after_census["partial_canonical_count"] == before_census["partial_canonical_count"] - 3

          before_public = json.loads(Path(os.environ["RUNNER_TEMP"], "kansas-before.json").read_text())
          after_public = json.loads(Path("site/data/teams/kansas.json").read_text())
          b = copy.deepcopy(before_public)
          by_id = {g["canonical_game_id"]: g for g in b["games"]}
          for gid in ids:
              assert by_id[gid]["site"] == "NEUTRAL"
              assert by_id[gid]["site_city"] is None and by_id[gid]["site_state"] is None
              assert by_id[gid]["venue_key"] is None and by_id[gid]["venue_id"] is None
              by_id[gid]["site_city"] = "Honolulu"
              by_id[gid]["site_state"] = "HI"
          assert b == after_public
          print("AFTER_PARTIAL_COUNT=", after_census["partial_canonical_count"])
          print("PASS: only canonical site_state changed; Kansas derived JSON changed only by complete public location")
          PY

      - name: Run repository validation and full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_data.py > "$RUNNER_TEMP/validate.log" 2>&1 || { tail -120 "$RUNNER_TEMP/validate.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/validate.log"
          python tools/check_site_data_freshness.py > "$RUNNER_TEMP/freshness.log" 2>&1 || { tail -120 "$RUNNER_TEMP/freshness.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/freshness.log"
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -160 "$RUNNER_TEMP/tests.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/tests.log"
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check

      - name: Reauthenticate authority, prove changed paths, and publish maintenance successor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          paths = set(git("diff", "--name-only").splitlines())
          expected = {"data/canonical/games.csv", "site/data/teams/kansas.json"}
          assert paths == expected, "Unexpected working diff: " + repr(sorted(paths))

          assert git("rev-parse", "HEAD:data/evidence/game-assertions.csv") == "568bd8a6c5c1ee505f4649e352614107a6fe212c"
          assert git("rev-parse", "HEAD:schools/kansas/source-games.csv") == "0ea0407411ad5d0b62d1a2f92fdcc4e45ab3157c"
          print("PASS: exact uncommitted changed-path allowlist and source-evidence immutability")
          PY
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/control/remote-implementation:refs/remotes/origin/control/remote-implementation \
            +refs/heads/data/hawai-i-onboarding:refs/remotes/origin/data/hawai-i-onboarding
          python - <<'PY'
          import json, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", "origin/main") == "36b8e829e7e5ffde7390ec7ef00816cda3d7f663"
          assert git("rev-parse", "origin/control/remote-implementation") == "f7485b931e8ced821e38896b814f5f05d780b40e"
          assert git("rev-parse", "origin/data/hawai-i-onboarding") == "03b47d1257d78e5f6d48f50ddcc52a554d67d64b"
          state = json.loads(git("show", "origin/control/remote-implementation:.remote-implementation/control-state.json"))
          assert state["current_sequence"] == 498
          assert state["lifecycle_state"] == "IDLE"
          assert state["transaction_state"] == "COMPLETE"
          assert state["recovery_required"] is False
          assert not state.get("active_request_id") and not state.get("active_school_key") and not state.get("active_lock_owner")
          print("PASS: final exact main/onboarding/control reauthentication")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/canonical/games.csv site/data/teams/kansas.json
          git commit -m "[site-maintenance-applied] Fill three evidence-backed Hawai'i canonical states"
          git push origin HEAD:refs/heads/maintenance/hawai-i-kansas-three-site-states
          echo "MAINTENANCE_SUCCESSOR=$(git rev-parse HEAD)"
