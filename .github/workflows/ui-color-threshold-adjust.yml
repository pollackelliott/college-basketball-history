name: Adjust opponent badge color threshold

on:
  push:
    branches:
      - chore/history-ui-exploration

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/history-ui-exploration
          fetch-depth: 0
      - name: Lower fallback contrast threshold
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('site/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'if (contrastRatio(background, foreground) < 4.5) foreground = textColor(background);'
          new = 'if (contrastRatio(background, foreground) < 2.0) foreground = textColor(background);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one current threshold, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('site/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/site-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify requested brand pairings in browser
        run: |
          cat > site/_qa_colors.html <<'EOF'
          <!doctype html><html><body><iframe id="app" src="/index.html#team/missouri"></iframe><pre id="out">RUNNING</pre><script>
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          window.addEventListener('load',()=>setTimeout(async()=>{
            const f=document.getElementById('app'), w=f.contentWindow;
            for(let i=0;i<60;i++){try{if(w.eval('DB.programs.length'))break}catch{} await delay(100)}
            const names=['Ole Miss','Florida','Georgia','Tennessee'];
            const lines=[];
            for(const name of names){
              const result=w.eval(`(()=>{const p=DB.programs.find(x=>x.name===${JSON.stringify(name)}); const c=opponentColorPresentation(p.key); return [p.primary,p.secondary,c.background,c.foreground,contrastRatio(p.primary,p.secondary)]})()`);
              const pass=result[2]===result[0]&&result[3]===result[1];
              lines.push(`${pass?'PASS':'FAIL'}: ${name} official primary/secondary preserved :: ${result.join(' | ')}`);
            }
            const kansas=w.eval(`(()=>{const p=DB.programs.find(x=>x.name==='Kansas'); const c=opponentColorPresentation(p.key); return [p.primary,p.secondary,c.background,c.foreground,contrastRatio(p.primary,p.secondary)]})()`);
            lines.push(`${kansas[3]!==kansas[1]?'PASS':'FAIL'}: Kansas still receives fallback :: ${kansas.join(' | ')}`);
            document.getElementById('out').textContent=lines.join('\n');
          },500));
          </script></body></html>
          EOF
          python -m http.server 8000 --directory site >/tmp/ui-color-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep .2; done
          google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8000/_qa_colors.html >/tmp/ui-color-dom.html
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          text=Path('/tmp/ui-color-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<pre id="out">(.*?)</pre>',text,re.S)
          if not m: raise SystemExit('QA output missing')
          output=unescape(re.sub(r'<[^>]+>','',m.group(1))).strip()
          print(output)
          fails=[x for x in output.splitlines() if x.startswith('FAIL:')]
          if fails: raise SystemExit(f'{len(fails)} color checks failed')
          if output.count('PASS:') != 5: raise SystemExit(f'Expected 5 passes, got {output.count("PASS:")}')
          PY
      - name: Validate repository
        run: |
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_data.py
          PYTHONDONTWRITEBYTECODE=1 python tools/build_site_data.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          git diff --check
      - name: Commit production threshold adjustment
        run: |
          rm -f site/_qa_colors.html
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add site/index.html
          if git diff --cached --quiet; then
            echo "No production change to commit"
            exit 1
          fi
          git commit -m "Preserve more official opponent color pairings"
          git push origin HEAD:chore/history-ui-exploration
