name: One-time bulk package postcondition hardening

on:
  push:
    branches:
      - chore/opponent-identity-bulk-package-postconditions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/opponent-identity-bulk-package-postconditions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add global school-package stale-key postcondition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tool=Path('tools/opponent_identity_bulk_transaction.py')
          text=tool.read_text()
          needle='''        if any(clean(r.get("canonical_game_id")) in absorbed or clean(r.get("normalized_opponent_key")) in old_keys for r in ar2):\n            raise BulkTransactionError("postcondition: stale assertion mapping remains")\n        retained = set(plan["retained_distinct_canonical_game_ids"])\n'''
          replacement='''        if any(clean(r.get("canonical_game_id")) in absorbed or clean(r.get("normalized_opponent_key")) in old_keys for r in ar2):\n            raise BulkTransactionError("postcondition: stale assertion mapping remains")\n\n        stale_package_refs: list[str] = []\n        for package_path in sorted((repo / "schools").glob("*/opponents.csv")):\n            _, package_rows = read_csv(package_path)\n            if any(clean(r.get("canonical_opponent_key")) in old_keys for r in package_rows):\n                stale_package_refs.append(str(package_path.relative_to(repo)))\n        for package_path in sorted((repo / "schools").glob("*/source-games.csv")):\n            _, package_rows = read_csv(package_path)\n            if any(clean(r.get("normalized_opponent_key")) in old_keys for r in package_rows):\n                stale_package_refs.append(str(package_path.relative_to(repo)))\n        if stale_package_refs:\n            raise BulkTransactionError(\n                "postcondition: stale school-package key remains in "\n                + ", ".join(sorted(set(stale_package_refs)))\n            )\n\n        retained = set(plan["retained_distinct_canonical_game_ids"])\n'''
          if needle not in text:
              raise SystemExit('tool insertion point not found')
          tool.write_text(text.replace(needle,replacement,1))

          test=Path('tests/test_opponent_identity_bulk_transaction.py')
          text=test.read_text()
          needle='''    def test_hash_mismatch_refuses_before_write(self):\n'''
          insert='''    def test_omitted_global_package_usage_fails_and_rolls_back(self):\n        self._manifest()\n        self._resolution()\n        self._write(self.repo/'data/canonical/games.csv',CANONICAL_HEADERS,[game('CBBG-1','old-target')])\n        self._write(self.repo/'data/evidence/game-assertions.csv',ASSERTION_HEADERS,[['A1','CBBG-1','alpha','SRC-1','old-target']])\n        (self.repo/'schools/beta').mkdir(parents=True,exist_ok=True)\n        self._write(self.repo/'schools/beta/opponents.csv',OPPONENT_HEADERS,[[\n            'beta','Old Target','old-target','Old Target','No','1','1999-2000','1999-2000'\n        ]])\n        self._write(self.repo/'schools/beta/source-games.csv',SOURCE_HEADERS,[[\n            'BETA-1','beta','1999-2000','','Old Target','Old Target','old-target','No','','','W','0','beta raw'\n        ]])\n        plan=bulk.build_plan(self.repo,self.manifest,self.resolutions)\n        self.assertEqual(plan['blockers'],[])\n        before=(self.repo/'schools/alpha/source-games.csv').read_bytes()\n        with self.assertRaisesRegex(bulk.BulkTransactionError,'stale school-package key remains'):\n            bulk.apply(self.repo,self.manifest,self.resolutions,plan['plan_sha256'],run_validation=False)\n        self.assertEqual((self.repo/'schools/alpha/source-games.csv').read_bytes(),before)\n        self.assertEqual(self._read(self.repo/'data/canonical/games.csv')[0]['team_b_key'],'old-target')\n\n    def test_hash_mismatch_refuses_before_write(self):\n'''
          if needle not in text:
              raise SystemExit('test insertion point not found')
          test.write_text(text.replace(needle,insert,1))
          PY

          python -m unittest tests.test_opponent_identity_bulk_transaction -v
          python -m unittest tests.test_opponent_identity_transaction -v
          python -m unittest discover -s tests -v

          rm .github/workflows/one-time-bulk-package-postcondition-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/opponent_identity_bulk_transaction.py tests/test_opponent_identity_bulk_transaction.py .github/workflows/one-time-bulk-package-postcondition-hardening.yml
          git commit -m "Enforce bulk school-package postconditions"
          git push origin HEAD:chore/opponent-identity-bulk-package-postconditions
