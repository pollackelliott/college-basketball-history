name: Guarded one-field canonical location maintenance (temporary)

on:
  push:
    branches:
      - maintenance/canonical-partial-location-20261101
    paths:
      - .github/workflows/maintenance-canonical-partial-location-20261101.yml

permissions:
  contents: write

concurrency:
  group: temporary-canonical-location-maintenance-20261101
  cancel-in-progress: false

jobs:
  exact-branch-apply:
    if: github.repository == 'pollackelliott/college-basketball-history' && github.ref == 'refs/heads/maintenance/canonical-partial-location-20261101'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/canonical-partial-location-20261101
          persist-credentials: true
          fetch-depth: 1

      - name: Bind initial canonical blob and enforce clean branch
        shell: bash
        run: |
          test "$(git branch --show-current)" = "maintenance/canonical-partial-location-20261101"
          test -z "$(git status --porcelain)"
          test "$(git hash-object data/canonical/games.csv)" = "f15273947ee600dd6e9a7917569041ca8caf27fc"

      - name: Apply exact source-grounded one-field correction
        shell: bash
        run: |
          python tools/canonical_partial_site_maintenance.py --repo . --spec data/maintenance/canonical-location-dayton-kansas-2019-11-27.json --apply
          # Canonical CSV is historically CRLF; treat CR as line ending, not trailing whitespace.
          git -c core.whitespace=cr-at-eol diff --check
          test "$(git diff --name-only)" = "data/canonical/games.csv"
          python - <<'PY'
          import csv, subprocess
          from pathlib import Path
          assert subprocess.check_output(["git", "diff", "--numstat"], text=True).strip() == "1\t1\tdata/canonical/games.csv"
          path = Path("data/canonical/games.csv")
          matches = [row for row in csv.DictReader(path.open(newline="", encoding="utf-8-sig"))
                     if row["canonical_game_id"] == "CBBG-0014299"]
          assert len(matches) == 1
          assert matches[0]["site_type"] == "NEUTRAL"
          assert matches[0]["site_city"] == "Maui"
          assert matches[0]["site_state"] == "HI"
          assert not matches[0]["venue_key"] and not matches[0]["venue_id"]
          PY

      - name: Commit only canonical site-state correction to isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/canonical/games.csv
          git commit -m "Complete Kansas-supported Maui state on one preexisting canonical game"
          git push origin HEAD:refs/heads/maintenance/canonical-partial-location-20261101
