name: Refine mobile navigation affordances
on:
  push:
    branches:
      - chore/nav-context-refinement
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/nav-context-refinement
          fetch-depth: 0
      - name: Apply mobile nav affordance patch
        run: python tools/tmp_nav_affordance_refine.py
      - name: Validate inline JavaScript
        run: |
          python -c "from pathlib import Path; import re; t=Path('site/index.html').read_text(); s=re.findall(r'<script>(.*?)</script>',t,re.S); assert len(s)==1; Path('/tmp/site-inline.js').write_text(s[0])"
          node --check /tmp/site-inline.js
      - name: Browser QA mobile navigation affordances
        run: |
          cat > site/_qa_nav_affordances.html <<'EOF'
          <!doctype html><html><body><iframe id="app" style="width:390px;height:844px;border:0" src="/index.html#team/alabama"></iframe><pre id="out">RUNNING</pre><script>
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          async function waitFor(fn){for(let i=0;i<100;i++){try{const v=fn();if(v)return v}catch{}await delay(100)}throw new Error('timeout')}
          window.addEventListener('load',()=>setTimeout(async()=>{
            const lines=[], f=document.getElementById('app'), w=f.contentWindow, d=f.contentDocument;
            try{
              await waitFor(()=>d.getElementById('teamPageTitle'));
              const buttons=d.querySelectorAll('.navlinks button'), teams=buttons[0], search=d.querySelector('.mobile-search-toggle'), icon=d.querySelector('.mobile-search-icon');
              const ts=getComputedStyle(teams), ss=getComputedStyle(search), is=getComputedStyle(icon);
              lines.push(`${ts.textDecorationLine.includes('underline')?'PASS':'FAIL'}: Teams is underlined on mobile`);
              lines.push(`${ss.display.includes('flex')&&parseFloat(is.width)>0?'PASS':'FAIL'}: Search has visible inline magnifying-glass icon`);
              const tr=teams.getBoundingClientRect(), sr=search.getBoundingClientRect(), gap=sr.top-tr.bottom;
              lines.push(`${gap<=4?'PASS':'FAIL'}: stacked Teams/Search spacing is compact :: ${gap.toFixed(1)}px`);
            }catch(e){lines.push(`FAIL: ${e.message}`)}
            document.getElementById('out').textContent=lines.join('\n');
          },500));
          </script></body></html>
          EOF
          python -m http.server 8000 --directory site >/tmp/ui-nav-affordance-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep .2; done
          google-chrome --headless=new --disable-gpu --no-sandbox --window-size=430,900 --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8000/_qa_nav_affordances.html >/tmp/ui-nav-affordance-dom.html
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          text=Path('/tmp/ui-nav-affordance-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<pre id="out">(.*?)</pre>', text, re.S)
          if not m: raise SystemExit('QA output missing')
          output=unescape(re.sub(r'<[^>]+>','',m.group(1))).strip()
          print(output)
          fails=[line for line in output.splitlines() if line.startswith('FAIL:')]
          if fails: raise SystemExit(f'{len(fails)} mobile nav checks failed')
          if output.count('PASS:') != 3: raise SystemExit(f'Expected 3 passes, got {output.count("PASS:")}')
          PY
          rm -f site/_qa_nav_affordances.html
      - name: Validate repository
        run: |
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_data.py
          PYTHONDONTWRITEBYTECODE=1 python tools/build_site_data.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          git diff --check
      - name: Commit production change
        run: |
          rm -f site/_qa_nav_affordances.html
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add site/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish mobile navigation affordances"
          git push origin HEAD:chore/nav-context-refinement
