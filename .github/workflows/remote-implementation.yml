name: Remote Implementation control plane

on:
  push:
    branches:
      - control/remote-implementation

permissions:
  contents: write
  pull-requests: read
  checks: read
  statuses: read
  deployments: read
  actions: read

concurrency:
  group: remote-implementation-global-control
  cancel-in-progress: false

jobs:
  process-request:
    if: ${{ !startsWith(github.event.head_commit.message, '[remote-implementation-internal]') }}
    runs-on: ubuntu-latest
    outputs:
      has_request: ${{ steps.detect.outputs.has_request }}
      operation: ${{ steps.detect.outputs.operation }}
      protected_main_sha: ${{ steps.detect.outputs.protected_main_sha }}
    steps:
      - name: Check out exact control request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect bounded request
        id: detect
        shell: bash
        working-directory: control
        run: |
          if [[ -f .remote-implementation/request.json ]]; then
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          request=json.loads(Path(".remote-implementation/request.json").read_text())
          print("operation="+str(request.get("operation","")))
          print("protected_main_sha="+str(request.get("expected_protected_main_sha","")))
          PY
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "operation=" >> "$GITHUB_OUTPUT"
            echo "protected_main_sha=" >> "$GITHUB_OUTPUT"
            echo "Control branch update contains no request."
          fi

      - name: Authenticate exact protected-main runtime
        if: steps.detect.outputs.has_request == 'true'
        shell: bash
        working-directory: control
        run: |
          expected_main="${{ steps.detect.outputs.protected_main_sha }}"
          if [[ ! "$expected_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Request protected-main SHA is invalid: $expected_main" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          actual_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$actual_main" != "$expected_main" ]]; then
            echo "Protected main changed or request is stale: expected=$expected_main actual=$actual_main" >&2
            exit 1
          fi

      - name: Check out exact protected-main runtime
        if: steps.detect.outputs.has_request == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.detect.outputs.protected_main_sha }}
          path: runtime
          fetch-depth: 0

      - name: Process remote Implementation request
        if: steps.detect.outputs.has_request == 'true'
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$GITHUB_WORKSPACE/runtime/tools/remote_implementation_runner.py"

      - name: Upload request diagnostics
        if: steps.detect.outputs.has_request == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-implementation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/remote-implementation-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  fresh-owner-gate2-approval-verification:
    needs: process-request
    if: needs.process-request.result == 'success' && needs.process-request.outputs.operation == 'RELEASE_GATE2_APPROVAL'
    runs-on: ubuntu-latest
