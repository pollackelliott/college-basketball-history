        uses: actions/upload-artifact@v4
        with:
          name: remote-pending-verification-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/remote-implementation-verification
          if-no-files-found: ignore
          retention-days: 14

  fresh-owner-gate2-approval-verification:
