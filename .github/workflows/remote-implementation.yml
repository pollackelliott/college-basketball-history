name: Remote Implementation control plane

on:
  push:
    branches:
      - control/remote-implementation
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  checks: read
  statuses: read
  deployments: read
  actions: write

concurrency:
  group: remote-implementation-global-control
  cancel-in-progress: false

jobs:
  process-request:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, '[remote-implementation-internal]') }}
    runs-on: ubuntu-latest
    outputs:
      has_request: ${{ steps.detect.outputs.has_request }}
      operation: ${{ steps.detect.outputs.operation }}
      protected_main_sha: ${{ steps.detect.outputs.protected_main_sha }}
      pending_verification: ${{ steps.detect.outputs.pending_verification }}
      pending_operation: ${{ steps.detect.outputs.pending_operation }}
      verification_runtime_sha: ${{ steps.authenticate.outputs.verification_runtime_sha }}
    steps:
      - name: Check out exact control request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect bounded request or pending fresh verification
        id: detect
        shell: bash
        working-directory: control
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          state_path = Path(".remote-implementation/control-state.json")
          request_path = Path(".remote-implementation/request.json")
          state = json.loads(state_path.read_text()) if state_path.is_file() else {}
          request = json.loads(request_path.read_text()) if request_path.is_file() else None
          used = set(state.get("accepted_request_ids") or [])
          used.update(state.get("consumed_request_ids") or [])
          used.update(state.get("abandoned_request_ids") or [])
          request_id = str((request or {}).get("request_id") or "")
          has_request = bool(request) and request_id not in used

          if has_request:
              print("has_request=true")
              print("operation="+str(request.get("operation","")))
              print("protected_main_sha="+str(request.get("expected_protected_main_sha","")))
              print("pending_verification=false")
              print("pending_operation=")
          else:
              last = state.get("last_operation") or {}
              pending = (
                  state.get("lifecycle_state") == "IDLE"
                  and last.get("fresh_runner_verification") == "PENDING"
                  and bool(last.get("operation"))
                  and bool(last.get("protected_main_sha"))
              )
              print("has_request=false")
              print("operation=")
              print("protected_main_sha="+str(last.get("protected_main_sha","") if pending else ""))
              print("pending_verification="+("true" if pending else "false"))
              print("pending_operation="+str(last.get("operation","") if pending else ""))
          PY

      - name: Authenticate exact protected-main runtime
        id: authenticate
        if: steps.detect.outputs.has_request == 'true' || steps.detect.outputs.pending_verification == 'true'
        shell: bash
        working-directory: control
        run: |
          expected_main="${{ steps.detect.outputs.protected_main_sha }}"
          if [[ ! "$expected_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Request protected-main SHA is invalid: $expected_main" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          actual_main="$(git rev-parse refs/remotes/origin/main)"
          runtime_sha="$expected_main"
          if [[ "$actual_main" != "$expected_main" ]]; then
            if [[ "${{ steps.detect.outputs.has_request }}" == "true" ]]; then
              echo "Protected main changed or request is stale: expected=$expected_main actual=$actual_main" >&2
              exit 1
            fi
            pending_operation="${{ steps.detect.outputs.pending_operation }}"
            if [[ "$pending_operation" != "STAGE2_CURRENT_MAIN_REFRESH" && "$pending_operation" != "EXPANSION_PHASE0" ]]; then
              echo "Protected main changed while this verification is pending: operation=$pending_operation expected=$expected_main actual=$actual_main" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$expected_main" "$actual_main"; then
              echo "Pending verification bound main is no longer an ancestor of protected main: operation=$pending_operation expected=$expected_main actual=$actual_main" >&2
              exit 1
            fi
            runtime_sha="$actual_main"
            echo "Pending verification will use current verifier runtime against original bound transaction: operation=$pending_operation bound=$expected_main verifier_runtime=$runtime_sha"
          fi
          echo "verification_runtime_sha=$runtime_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact protected-main runtime
        if: steps.detect.outputs.has_request == 'true' || steps.detect.outputs.pending_verification == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.detect.outputs.protected_main_sha }}
          path: runtime
          fetch-depth: 0

      - name: Require control workflow snapshot to match protected-main scheduling authority
        if: steps.detect.outputs.has_request == 'true'
        shell: bash
        run: |
          control_workflow="$GITHUB_WORKSPACE/control/.github/workflows/remote-implementation.yml"
          runtime_workflow="$GITHUB_WORKSPACE/runtime/.github/workflows/remote-implementation.yml"
          if ! cmp --silent "$control_workflow" "$runtime_workflow"; then
            echo "Control workflow is stale relative to request-bound protected main; sync the workflow before submitting a request." >&2
            exit 1
          fi

      - name: Process remote Implementation request
        if: steps.detect.outputs.has_request == 'true'
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$GITHUB_WORKSPACE/runtime/tools/remote_implementation_runner.py"

      - name: Upload request diagnostics
        if: steps.detect.outputs.has_request == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-implementation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/remote-implementation-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  fresh-pending-verification-recovery:
    needs: process-request
    if: needs.process-request.result == 'success' && needs.process-request.outputs.has_request == 'false' && needs.process-request.outputs.pending_verification == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest durable control state
        uses: actions/checkout@v4
        with:
          ref: control/remote-implementation
          path: control
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out exact pending-operation protected-main runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.process-request.outputs.verification_runtime_sha }}
          path: runtime
          fetch-depth: 0

      - name: Independently recover pending fresh verification without replay
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$GITHUB_WORKSPACE/runtime/tools/remote_implementation_verify.py"

      - name: Resume any authorized Stage 2 phase continuation
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$GITHUB_WORKSPACE/runtime/tools/remote_implementation_stage2_continuation.py"

      - name: Upload pending-verification recovery diagnostics
