name: Stage 2 candidate runtime rehearsal

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate tooling commit SHA
        required: true
        type: string
      control_commit:
        description: Exact control/remote-implementation commit carrying the blocked proposal checkpoint
        required: true
        type: string
      proposal_checkpoint_path:
        description: Exact blocked Stage 2 proposal checkpoint manifest path
        required: true
        type: string

permissions:
  contents: read

jobs:
  rehearse-candidate-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out control authority
        uses: actions/checkout@v4
        with:
          ref: control/remote-implementation
          path: control
          fetch-depth: 0

      - name: Check out exact candidate runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate requested commits
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ inputs.candidate_sha }}"
          control_commit="${{ inputs.control_commit }}"
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid candidate_sha: $candidate" >&2
            exit 1
          fi
          if [[ ! "$control_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid control_commit: $control_commit" >&2
            exit 1
          fi
          actual_candidate="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual_candidate" != "$candidate" ]]; then
            echo "Candidate checkout mismatch: expected=$candidate actual=$actual_candidate" >&2
            exit 1
          fi
          git -C control cat-file -e "$control_commit^{commit}"

      - name: Replay exact blocked proposal with candidate tooling
        shell: bash
        run: |
          set -euo pipefail
          python candidate/tools/stage2_candidate_runtime_rehearsal.py             --source-repo control             --candidate-runtime candidate             --candidate-sha "${{ inputs.candidate_sha }}"             --control-commit "${{ inputs.control_commit }}"             --proposal-checkpoint-path "${{ inputs.proposal_checkpoint_path }}"             --diag /tmp/stage2-candidate-runtime-rehearsal

      - name: Upload candidate rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-candidate-runtime-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/stage2-candidate-runtime-rehearsal
          if-no-files-found: ignore
          retention-days: 14
