name: Stage 2 candidate runtime rehearsal — transport trigger

on:
  push:
    branches:
      - rehearsal/gmu-stage2-publication-coverage-54dcc76b

permissions:
  contents: read

jobs:
  rehearse-candidate-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact blocked proposal authority
        uses: actions/checkout@v4
        with:
          ref: 541db8c4dd0c450e55d06d6d7244ccc828de6c69
          path: control
          fetch-depth: 0

      - name: Check out exact candidate runtime
        uses: actions/checkout@v4
        with:
          ref: 54dcc76baf50a0993ae3606ac24899676e88c826
          path: candidate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replay exact blocked proposal with exact candidate tooling
        shell: bash
        run: |
          set -euo pipefail
          python candidate/tools/stage2_candidate_runtime_rehearsal.py \
            --source-repo control \
            --candidate-runtime candidate \
            --candidate-sha 54dcc76baf50a0993ae3606ac24899676e88c826 \
            --control-commit 541db8c4dd0c450e55d06d6d7244ccc828de6c69 \
            --proposal-checkpoint-path .remote-implementation/checkpoints/george-mason/george-mason-expansion-stage2-proposal-0003/checkpoint-manifest.json \
            --diag /tmp/stage2-candidate-runtime-rehearsal

      - name: Upload candidate rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-candidate-runtime-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/stage2-candidate-runtime-rehearsal
          if-no-files-found: ignore
          retention-days: 14
