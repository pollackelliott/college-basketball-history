name: Stage 2 candidate runtime rehearsal

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/stage2-candidate-runtime-rehearsal.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate tooling commit SHA
        required: true
        type: string
      control_commit:
        description: Exact control/remote-implementation commit carrying the blocked proposal checkpoint
        required: true
        type: string
      proposal_checkpoint_path:
        description: Exact blocked Stage 2 proposal checkpoint manifest path
        required: true
        type: string

permissions:
  contents: read

jobs:
  rehearse-candidate-runtime:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'tooling/'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out control authority
        uses: actions/checkout@v4
        with:
          ref: control/remote-implementation
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact candidate runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve exact PR-head and durable blocked-proposal authority
        if: >-
          github.event_name == 'workflow_dispatch' ||
          !startsWith(github.event.pull_request.head.ref, 'tooling/stage2-display-')
        id: authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
          INPUT_CONTROL_COMMIT: ${{ inputs.control_commit || '' }}
          INPUT_CHECKPOINT_PATH: ${{ inputs.proposal_checkpoint_path || '' }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          def fail(message): raise SystemExit('FAIL: ' + message)
          def git(repo, *args):
              return subprocess.check_output(['git', '-C', repo, *args], text=True).strip()
          def valid_sha(value): return bool(re.fullmatch(r'[0-9a-f]{40}', value or ''))

          event = os.environ['EVENT_NAME']
          control_head = git('control', 'rev-parse', 'HEAD')
          candidate_head = git('candidate', 'rev-parse', 'HEAD')
          if event == 'pull_request':
              candidate = os.environ['PR_HEAD_SHA']
              control_commit = control_head
              state = json.loads(Path('control/.remote-implementation/control-state.json').read_text())
              last = state.get('last_operation') or {}
              recovered_idle = (
                  state.get('transaction_state') in (
                      'ABANDONED_PREPARED_NOT_PUBLISHED',
                      'ABANDONED_NOT_ATTEMPTED',
                  )
                  and last.get('operation') == 'RECOVER'
              )
              if (state.get('kind') != 'REMOTE_IMPLEMENTATION_GLOBAL_CONTROL'
                      or state.get('lifecycle_state') != 'IDLE'
                      or (
                          state.get('transaction_state') != 'COMPLETE'
                          and not recovered_idle
                      )
                      or state.get('recovery_required')
                      or state.get('active_request_id')):
                  fail('global control is not safely idle after complete or recovered transaction')
              if (last.get('operation') == 'STAGE2_PROPOSAL_REHEARSAL'
                      and last.get('stage2_status') == 'BLOCKED'
                      and last.get('fresh_runner_verification') == 'PASS'
                      and last.get('remote_stage2_proposal_equivalence') == 'PASS'):
                  mode = 'BLOCKED_PROPOSAL'
                  checkpoint = str(last.get('checkpoint_manifest_path') or '')
                  school = str(last.get('school_key') or '')
                  expected_main = ''
                  if (not re.fullmatch(r'[a-z0-9][a-z0-9-]*', school)
                          or not checkpoint.startswith('.remote-implementation/checkpoints/' + school + '/')
                          or not checkpoint.endswith('/checkpoint-manifest.json')
                          or '..' in Path(checkpoint).parts):
                      fail('checkpoint path not within selected school authority')
                  raw = (Path('control') / checkpoint).read_bytes()
                  if hashlib.sha256(raw).hexdigest() != last.get('checkpoint_manifest_sha256'):
                      fail('checkpoint bytes do not match control-state hash')
                  manifest = json.loads(raw)
                  if (manifest.get('kind') != 'REMOTE_IMPLEMENTATION_STAGE2_PROPOSAL_REHEARSAL_CHECKPOINT'
                          or manifest.get('stage2_status') != 'BLOCKED'
                          or manifest.get('school_key') != school
                          or manifest.get('request_id') != last.get('request_id')
                          or manifest.get('target_sha') != last.get('target_sha')
                          or manifest.get('recommendation_map_sha256') != last.get('recommendation_map_sha256')
                          or manifest.get('decision_universe_sha256') != last.get('decision_universe_sha256')):
                      fail('checkpoint does not bind exact verified last operation')
              elif (last.get('operation') == 'STAGE2_RECONCILIATION_DIAGNOSTIC'
                    and last.get('fresh_runner_verification') == 'PASS'
                    and last.get('remote_stage2_diagnostic_equivalence') == 'PASS'):
                  mode = 'BLOCKED_PROPOSAL'
                  diagnostic_checkpoint = str(last.get('checkpoint_manifest_path') or '')
                  school = str(last.get('school_key') or '')
                  expected_main = ''
                  if (not re.fullmatch(r'[a-z0-9][a-z0-9-]*', school)
                          or not diagnostic_checkpoint.startswith(
                              '.remote-implementation/checkpoints/' + school + '/'
                          )
                          or not diagnostic_checkpoint.endswith('/checkpoint-manifest.json')
                          or '..' in Path(diagnostic_checkpoint).parts):
                      fail('diagnostic checkpoint path not within selected school authority')
                  diagnostic_raw = (
                      Path('control') / diagnostic_checkpoint
                  ).read_bytes()
                  if (
                      hashlib.sha256(diagnostic_raw).hexdigest()
                      != last.get('checkpoint_manifest_sha256')
                  ):
                      fail('diagnostic checkpoint bytes do not match control-state hash')
                  diagnostic = json.loads(diagnostic_raw)
                  checkpoint = str(
                      diagnostic.get('stage2_proposal_checkpoint_path') or ''
                  )
                  source_checkpoint_sha = str(
                      diagnostic.get('stage2_proposal_checkpoint_sha256') or ''
                  )
                  if (
                      diagnostic.get('kind')
                      != 'REMOTE_IMPLEMENTATION_STAGE2_RECONCILIATION_DIAGNOSTIC_CHECKPOINT'
                      or diagnostic.get('diagnostic_status') != 'PASS'
                      or diagnostic.get('execution_status') != 'RECONCILIATION_BLOCKED'
                      or diagnostic.get('school_key') != school
                      or diagnostic.get('request_id') != last.get('request_id')
                      or diagnostic.get('target_sha') != last.get('target_sha')
                      or diagnostic.get('canonical_game_id') != last.get('canonical_game_id')
                      or diagnostic.get('trace_sha256') != last.get('trace_sha256')
                      or not checkpoint.startswith(
                          '.remote-implementation/checkpoints/' + school + '/'
                      )
                      or not checkpoint.endswith('/checkpoint-manifest.json')
                      or '..' in Path(checkpoint).parts
                      or not re.fullmatch(r'[0-9a-f]{64}', source_checkpoint_sha)
                  ):
                      fail('diagnostic checkpoint does not bind exact verified last operation')
                  proposal_raw = (Path('control') / checkpoint).read_bytes()
                  if hashlib.sha256(proposal_raw).hexdigest() != source_checkpoint_sha:
                      fail('diagnostic source proposal checkpoint hash mismatch')
                  manifest = json.loads(proposal_raw)
                  if (
                      manifest.get('kind')
                      != 'REMOTE_IMPLEMENTATION_STAGE2_PROPOSAL_REHEARSAL_CHECKPOINT'
                      or manifest.get('stage2_status') != 'BLOCKED'
                      or manifest.get('school_key') != school
                      or manifest.get('request_id')
                      != diagnostic.get('source_proposal_request_id')
                      or manifest.get('target_sha') != diagnostic.get('target_sha')
                      or manifest.get('decision_universe_sha256')
                      != diagnostic.get('decision_universe_sha256')
                      or manifest.get('recommendation_map_sha256')
                      != diagnostic.get('recommendation_map_sha256')
                  ):
                      fail('diagnostic source proposal authority mismatch')
              elif (last.get('operation') == 'STAGE2_PRESEAL_REHEARSAL'
                    and last.get('preseal_status') == 'BLOCKED'
                    and last.get('fresh_runner_verification') == 'PASS'
                    and last.get('remote_stage2_preseal_equivalence') == 'PASS'):
                  mode = 'BLOCKED_PRESEAL'
                  checkpoint = str(last.get('checkpoint_manifest_path') or '')
                  school = str(last.get('school_key') or '')
                  expected_main = ''
                  if (not re.fullmatch(r'[a-z0-9][a-z0-9-]*', school)
                          or not checkpoint.startswith('.remote-implementation/checkpoints/' + school + '/')
                          or not checkpoint.endswith('/checkpoint-manifest.json')
                          or '..' in Path(checkpoint).parts):
                      fail('checkpoint path not within selected school authority')
                  raw = (Path('control') / checkpoint).read_bytes()
                  if hashlib.sha256(raw).hexdigest() != last.get('checkpoint_manifest_sha256'):
                      fail('checkpoint bytes do not match control-state hash')
                  manifest = json.loads(raw)
                  if (manifest.get('kind') != 'REMOTE_IMPLEMENTATION_STAGE2_PRESEAL_REHEARSAL_CHECKPOINT'
                          or manifest.get('preseal_status') != 'BLOCKED'
                          or manifest.get('school_key') != school
                          or manifest.get('request_id') != last.get('request_id')
                          or manifest.get('target_sha') != last.get('target_sha')
                          or manifest.get('decision_universe_sha256') != last.get('decision_universe_sha256')
                          or manifest.get('recommendation_map_sha256') != last.get('recommendation_map_sha256')
                          or manifest.get('filled_review_sha256') != last.get('filled_review_sha256')
                          or manifest.get('owner_gate_1_approval_sha256') != last.get('owner_gate_1_approval_sha256')):
                      fail('checkpoint does not bind exact verified last operation')
              elif (last.get('operation') == 'RECOVER'
                    and last.get('disposition') in (
                        'ABANDONED_PREPARED_NOT_PUBLISHED',
                        'ABANDONED_NOT_ATTEMPTED',
                    )):
                  mode = 'RECOVERED_IDLE'
                  checkpoint = ''
                  recovery = last.get('recovery_manifest') or {}
                  expected_main = str(recovery.get('protected_main_sha') or '')
                  school = str(recovery.get('target_branch') or '')
                  target_sha = str(recovery.get('actual_target_sha') or '')
                  classification = str(recovery.get('mutation_classification') or '')
                  read_only_not_attempted = (
                      classification == 'NOT_ATTEMPTED'
                      and recovery.get('target_branch') is None
                      and recovery.get('actual_target_sha') is None
                  )
                  mutation_target = (
                      valid_sha(target_sha)
                      and school.startswith('data/')
                  )
                  if (recovery.get('kind') != 'REMOTE_IMPLEMENTATION_RECOVERY'
                          or not re.fullmatch(
                              r'[a-z0-9][a-z0-9-]*',
                              str(recovery.get('request_id') or ''),
                          )
                          or recovery.get('recovered_request_id') != last.get('recovered_request_id')
                          or classification != {
                              'ABANDONED_PREPARED_NOT_PUBLISHED': 'PREPARED_NOT_PUBLISHED',
                              'ABANDONED_NOT_ATTEMPTED': 'NOT_ATTEMPTED',
                          }.get(last.get('disposition'))
                          or not valid_sha(expected_main)
                          or not (read_only_not_attempted or mutation_target)):
                      fail('recovered-idle control does not bind a valid recovery manifest')
                  if mutation_target:
                      remote_target = git(
                          'candidate', 'ls-remote', 'origin', 'refs/heads/' + school
                      ).split()
                      if not remote_target or remote_target[0] != target_sha:
                          fail('recovered-idle target no longer equals classified unpublished target')
              elif (last.get('operation') == 'STAGE2_OPPONENT_DISPLAY_NORMALIZE'
                    and last.get('stage2_status') in ('CAPABILITY_CENSUS_READY', 'BLOCKED')
                    and last.get('fresh_runner_verification') == 'PASS'
                    and last.get('remote_stage2_opponent_display_equivalence') == 'PASS'):
                  mode = 'LIVE_CENSUS_AFTER_OPPONENT_DISPLAY'
                  checkpoint = str(last.get('successor_manifest_path') or '')
                  school = str(last.get('school_key') or '')
                  expected_main = str(last.get('protected_main_sha') or '')
                  if (not re.fullmatch(r'[a-z0-9][a-z0-9-]*', school)
                          or not checkpoint.startswith('.remote-implementation/successors/' + school + '/')
                          or not checkpoint.endswith('/successor-manifest.json')
                          or '..' in Path(checkpoint).parts
                          or not valid_sha(expected_main)):
                      fail('opponent-display successor path/main authority invalid')
                  raw = (Path('control') / checkpoint).read_bytes()
                  if hashlib.sha256(raw).hexdigest() != last.get('successor_manifest_sha256'):
                      fail('opponent-display successor bytes do not match control-state hash')
                  successor = json.loads(raw)
                  if (successor.get('kind') != 'REMOTE_IMPLEMENTATION_STAGE2_OPPONENT_DISPLAY_SUCCESSOR'
                          or successor.get('operation') != 'STAGE2_OPPONENT_DISPLAY_NORMALIZE'
                          or successor.get('school_key') != school
                          or successor.get('request_id') != last.get('request_id')
                          or successor.get('target_branch') != last.get('target_branch')
                          or successor.get('actual_published_target_sha') != last.get('target_sha')
                          or successor.get('protected_main_sha') != expected_main
                          or successor.get('final_transaction_state') != 'COMPLETE'
                          or successor.get('publication_cas') != 'EXISTING_REF_CAS_PASS'
                          or (successor.get('post_repair_stage2') or {}).get('stage2_status')
                              != last.get('stage2_status')):
                      fail('opponent-display successor does not bind exact verified last operation')
              elif (last.get('operation') == 'STAGE2_CENSUS'
                    and last.get('stage2_status') == 'CAPABILITY_CENSUS_READY'
                    and last.get('fresh_runner_verification') == 'PASS'
                    and last.get('remote_stage2_census_equivalence') == 'PASS'):
                  mode = 'LIVE_PROPOSAL_AFTER_CENSUS'
                  checkpoint = str(last.get('checkpoint_manifest_path') or '')
                  school = str(last.get('school_key') or '')
                  expected_main = str(last.get('protected_main_sha') or '')
                  live_request = json.loads(
                      Path('control/.remote-implementation/request.json').read_text()
                  )
                  stage2_ref = live_request.get('stage2_authority') or {}
                  authority_flags = live_request.get('authority') or {}
                  used_ids = set(state.get('accepted_request_ids') or [])
                  used_ids.update(state.get('consumed_request_ids') or [])
                  used_ids.update(state.get('abandoned_request_ids') or [])
                  if (not re.fullmatch(r'[a-z0-9][a-z0-9-]*', school)
                          or not valid_sha(expected_main)
                          or not checkpoint.startswith(
                              '.remote-implementation/checkpoints/' + school + '/'
                          )
                          or not checkpoint.endswith('/checkpoint-manifest.json')
                          or '..' in Path(checkpoint).parts
                          or live_request.get('kind') != 'REMOTE_IMPLEMENTATION_REQUEST'
                          or live_request.get('operation') != 'STAGE2_PROPOSAL_REHEARSAL'
                          or live_request.get('school_key') != school
                          or live_request.get('target_branch') != last.get('target_branch')
                          or live_request.get('target_sha') != last.get('target_sha')
                          or live_request.get('expected_protected_main_sha') != expected_main
                          or live_request.get('decision_universe_sha256')
                              != last.get('decision_universe_sha256')
                          or stage2_ref.get('path') != checkpoint
                          or stage2_ref.get('sha256')
                              != last.get('checkpoint_manifest_sha256')
                          or authority_flags.get('stage2_proposal_rehearsal') is not True
                          or authority_flags.get('owner_gate_1') is not False
                          or authority_flags.get('owner_gate_2') is not False
                          or live_request.get('request_id') in used_ids):
                      fail('live proposal does not bind exact fresh-verified census authority')
                  raw = (Path('control') / checkpoint).read_bytes()
                  if hashlib.sha256(raw).hexdigest() != last.get(
                      'checkpoint_manifest_sha256'
                  ):
                      fail('live proposal census bytes do not match control-state hash')
                  manifest = json.loads(raw)
                  preflight = manifest.get('preflight') or {}
                  if (
                      manifest.get('kind')
                      != 'REMOTE_IMPLEMENTATION_STAGE2_CENSUS_CHECKPOINT'
                      or manifest.get('stage2_status') != 'CAPABILITY_CENSUS_READY'
                      or manifest.get('school_key') != school
                      or manifest.get('request_id') != last.get('request_id')
                      or manifest.get('target_branch') != last.get('target_branch')
                      or manifest.get('target_sha') != last.get('target_sha')
                      or manifest.get('protected_main_sha') != expected_main
                      or manifest.get('decision_universe_sha256')
                          != last.get('decision_universe_sha256')
                      or int(preflight.get('blocker_count', -1)) != 0
                      or int(preflight.get('warning_count', -1)) < 0
                  ):
                      fail('live proposal census does not bind exact verified last operation')
              elif (last.get('operation') == 'STAGE2_CENSUS'
                    and last.get('stage2_status') == 'BLOCKED'
                    and last.get('fresh_runner_verification') == 'PASS'
                    and last.get('remote_stage2_census_equivalence') == 'PASS'):
                  mode = 'BLOCKED_CENSUS_OPPONENT_REPRESENTATION'
                  checkpoint = str(last.get('checkpoint_manifest_path') or '')
                  school = str(last.get('school_key') or '')
                  expected_main = str(last.get('protected_main_sha') or '')
                  if (not re.fullmatch(r'[a-z0-9][a-z0-9-]*', school)
                          or not valid_sha(expected_main)
                          or not checkpoint.startswith(
                              '.remote-implementation/checkpoints/' + school + '/'
                          )
                          or not checkpoint.endswith('/checkpoint-manifest.json')
                          or '..' in Path(checkpoint).parts):
                      fail('blocked census checkpoint/main authority invalid')
                  raw = (Path('control') / checkpoint).read_bytes()
                  if hashlib.sha256(raw).hexdigest() != last.get(
                      'checkpoint_manifest_sha256'
                  ):
                      fail('blocked census bytes do not match control-state hash')
                  manifest = json.loads(raw)
                  preflight = manifest.get('preflight') or {}
                  if (
                      manifest.get('kind')
                      != 'REMOTE_IMPLEMENTATION_STAGE2_CENSUS_CHECKPOINT'
                      or manifest.get('stage2_status') != 'BLOCKED'
                      or manifest.get('capability_census_status')
                      != 'PREFLIGHT_BLOCKED'
                      or manifest.get('school_key') != school
                      or manifest.get('request_id') != last.get('request_id')
                      or manifest.get('target_branch') != last.get('target_branch')
                      or manifest.get('target_sha') != last.get('target_sha')
                      or manifest.get('protected_main_sha') != expected_main
                      or int(preflight.get('blocker_count', 0)) <= 0
                      or int(preflight.get('warning_count', -1)) < 0
                      or int(preflight.get('decision_count', -1)) != 0
                  ):
                      fail('blocked census does not bind exact verified last operation')
              elif (last.get('operation') == 'STAGE2_CURRENT_MAIN_REFRESH'
                    and last.get('fresh_runner_verification') == 'PASS'
                    and last.get('remote_stage2_current_main_refresh_equivalence') == 'PASS'):
                  mode = 'LIVE_CENSUS_AFTER_REFRESH'
                  checkpoint = ''
                  live_request = json.loads(
                      Path('control/.remote-implementation/request.json').read_text()
                  )
                  school = str(last.get('school_key') or '')
                  continuation = live_request.get('phase_continuation') or {}
                  refresh_ref = live_request.get('stage2_current_main_refresh_successor') or {}
                  authority = live_request.get('authority') or {}
                  expected_main = str(live_request.get('expected_protected_main_sha') or '')
                  if (not re.fullmatch(r'[a-z0-9][a-z0-9-]*', school)
                          or live_request.get('kind') != 'REMOTE_IMPLEMENTATION_REQUEST'
                          or live_request.get('operation') != 'STAGE2_CENSUS'
                          or live_request.get('school_key') != school
                          or live_request.get('target_branch') != last.get('target_branch')
                          or live_request.get('target_sha') != last.get('target_sha')
                          or expected_main != last.get('protected_main_sha')
                          or continuation.get('kind') != 'STAGE2_REFRESH_CENSUS_PROPOSAL_V1'
                          or live_request.get('request_id') != continuation.get('census_request_id')
                          or authority.get('stage2_census') is not True
                          or authority.get('stage2_current_main_refresh') is not False
                          or refresh_ref.get('path') != last.get('successor_manifest_path')
                          or refresh_ref.get('sha256') != last.get('successor_manifest_sha256')):
                      fail('live census continuation does not bind exact verified refresh')
              else:
                  fail('latest operation has no authenticated candidate-runtime authority mode')
              remote = git('candidate', 'ls-remote', 'origin', 'refs/heads/' + os.environ['PR_HEAD_REF']).split()
              if not remote or remote[0] != candidate:
                  fail('live PR head no longer equals event candidate SHA')
          elif event == 'workflow_dispatch':
              candidate = os.environ['INPUT_CANDIDATE_SHA']
              control_commit = os.environ['INPUT_CONTROL_COMMIT']
              checkpoint = os.environ['INPUT_CHECKPOINT_PATH']
              mode = 'BLOCKED_PROPOSAL'
              expected_main = ''
          else:
              fail('unsupported workflow event')
          if not valid_sha(candidate) or not valid_sha(control_commit):
              fail('candidate/control commit must be full SHA-40')
          if candidate_head != candidate:
              fail('candidate checkout does not match selected SHA')
          if (mode in ('BLOCKED_PROPOSAL', 'BLOCKED_PRESEAL')
                  and not re.fullmatch(r'\.remote-implementation/checkpoints/[a-z0-9-]+/[^/]+/checkpoint-manifest\.json', checkpoint)):
              fail('invalid checkpoint path')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in [('candidate_sha', candidate),
                                 ('control_commit', control_commit),
                                 ('proposal_checkpoint_path', checkpoint),
                                 ('mode', mode),
                                 ('expected_main_sha', expected_main)]:
                  output.write(key + '=' + value + '\n')
          print('AUTHENTICATED_CANDIDATE=' + candidate)
          print('AUTHENTICATED_CONTROL=' + control_commit)
          print('AUTHORITY_MODE=' + mode)
          if checkpoint:
              print('AUTHENTICATED_CHECKPOINT=' + checkpoint)
          if expected_main:
              print('EXPECTED_MAIN_SHA=' + expected_main)
          PY
      - name: Authenticate requested commits
        if: >-
          github.event_name == 'workflow_dispatch' ||
          !startsWith(github.event.pull_request.head.ref, 'tooling/stage2-display-')
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.authority.outputs.candidate_sha }}"
          control_commit="${{ steps.authority.outputs.control_commit }}"
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid candidate_sha: $candidate" >&2
            exit 1
          fi
          if [[ ! "$control_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid control_commit: $control_commit" >&2
            exit 1
          fi
          actual_candidate="$(git -C candidate rev-parse HEAD)"
          if [[ "$actual_candidate" != "$candidate" ]]; then
            echo "Candidate checkout mismatch: expected=$candidate actual=$actual_candidate" >&2
            exit 1
          fi
          git -C control cat-file -e "$control_commit^{commit}"

      - name: Replay exact blocked census with candidate tooling
        if: >-
          github.event_name == 'pull_request' &&
          steps.authority.outputs.mode == 'BLOCKED_CENSUS_OPPONENT_REPRESENTATION'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          candidate = Path('candidate').resolve()
          control = Path('control').resolve()
          sys.path.insert(0, str(candidate / 'tools'))

          from remote_implementation_stage2_census import (
              add_existing_onboarding_worktree,
              run_stage2_census_tool,
              verify_phase0_authority,
          )
          from remote_implementation_stage2_opponent_display import (
              apply_and_prepare_repair,
              post_repair_stage2_result,
              run_normalizer_dry_run,
              stage2_result_summary,
              verify_census_and_freeze_authority,
          )
          from stage2_candidate_runtime_rehearsal import (
              candidate_census_decision_universe,
              candidate_changed_paths,
              validate_candidate_scope,
          )

          state = json.loads(
              (control / '.remote-implementation/control-state.json').read_text()
          )
          last = state.get('last_operation') or {}
          checkpoint = Path(
              '${{ steps.authority.outputs.proposal_checkpoint_path }}'
          )
          raw = (control / checkpoint).read_bytes()
          assert (
              hashlib.sha256(raw).hexdigest()
              == last['checkpoint_manifest_sha256']
          )
          manifest = json.loads(raw)

          checkpoint_dir = checkpoint.parent
          request_path = checkpoint_dir / 'request.json'
          request_raw = (control / request_path).read_bytes()
          expected_request_sha = str(manifest.get('request_sha256') or '')
          if expected_request_sha:
              assert hashlib.sha256(request_raw).hexdigest() == expected_request_sha
          request = json.loads(request_raw)
          assert request['request_id'] == manifest['request_id']
          assert request['school_key'] == manifest['school_key']
          assert request['target_branch'] == manifest['target_branch']
          assert request['target_sha'] == manifest['target_sha']
          assert request['expected_protected_main_sha'] == manifest['protected_main_sha']

          candidate_sha = '${{ steps.authority.outputs.candidate_sha }}'
          authority_main = '${{ steps.authority.outputs.expected_main_sha }}'
          changed_paths, scoped_main = candidate_changed_paths(
              candidate,
              authority_main,
              candidate_sha,
          )
          validate_candidate_scope(changed_paths)

          authority = verify_phase0_authority(
              request,
              '${{ steps.authority.outputs.control_commit }}',
              source_repo=control,
          )

          status_path = checkpoint_dir / 'implementation-stage2-status.json'
          baseline_status_raw = (control / status_path).read_bytes()
          assert (
              hashlib.sha256(baseline_status_raw).hexdigest()
              == manifest['artifact_sha256']['implementation-stage2-status.json']
          )
          baseline_status = json.loads(baseline_status_raw)
          baseline_blockers = set(baseline_status.get('blockers') or [])
          assert baseline_blockers
          baseline_preflight = baseline_status.get('preflight') or {}
          baseline_warning_count = int(
              baseline_preflight.get('warning_count', 0) or 0
          )
          baseline_decision_count = int(
              baseline_preflight.get('decision_count', 0) or 0
          )
          baseline_universe = baseline_preflight.get(
              'decision_universe_sha256'
          )

          scratch_branch = (
              'remote-stage2-census/%s-%s'
              % (request['school_key'], request['target_sha'][:12])
          )
          worktree = add_existing_onboarding_worktree(
              request['target_branch'],
              request['target_sha'],
              request['school_key'],
              source_repo=candidate,
          )
          try:
              result = run_stage2_census_tool(
                  worktree,
                  request['school_key'],
                  authority['freeze_bytes'],
                  Path('/tmp/stage2-candidate-runtime-rehearsal/candidate-census'),
                  tool_repo=candidate,
              )
          finally:
              subprocess.run(
                  [
                      'git', '-C', str(candidate), 'worktree', 'remove',
                      '--force', str(worktree),
                  ],
                  check=True,
              )
              subprocess.run(
                  ['git', '-C', str(candidate), 'branch', '-D', scratch_branch],
                  check=True,
              )

          status = result.get('status') or {}
          preflight = status.get('preflight') or {}
          candidate_blockers = set(status.get('blockers') or [])
          proof = result.get('tracked_mutation_proof') or {}
          assert proof.get('tracked_stage2_mutation') == 'NONE', proof

          stage2_status = result.get('stage2_status')
          opponent_representation_rehearsal = None
          if stage2_status == 'CAPABILITY_CENSUS_READY':
              assert not candidate_blockers, candidate_blockers
              classification = 'RESOLVED_TO_CAPABILITY_CENSUS'
          else:
              assert stage2_status == 'BLOCKED', stage2_status
              assert candidate_blockers, candidate_blockers
              if baseline_blockers <= candidate_blockers:
                  repair_request = {
                      'school_key': request['school_key'],
                      'target_branch': request['target_branch'],
                      'target_sha': request['target_sha'],
                      'stage2_census_checkpoint': {
                          'path': checkpoint.as_posix(),
                          'sha256': last['checkpoint_manifest_sha256'],
                      },
                      'integration_freeze_sha256': manifest[
                          'integration_freeze_sha256'
                      ],
                      'semantic_snapshot_sha256': manifest[
                          'semantic_snapshot_sha256'
                      ],
                  }
                  repair_authority = verify_census_and_freeze_authority(
                      repair_request,
                      '${{ steps.authority.outputs.control_commit }}',
                      source_repo=control,
                  )
                  repair_worktree = add_existing_onboarding_worktree(
                      request['target_branch'],
                      request['target_sha'],
                      request['school_key'],
                      source_repo=candidate,
                  )
                  repair_diag = Path(
                      '/tmp/stage2-candidate-runtime-rehearsal/'
                      'candidate-opponent-representation'
                  )
                  try:
                      dry = run_normalizer_dry_run(
                          repair_worktree,
                          request['school_key'],
                          repair_authority['freeze_bytes'],
                          repair_authority['blocker_keys'],
                          repair_diag,
                          tool_repo=candidate,
                          sync_current_d1=repair_authority['sync_current_d1'],
                      )
                      proposed = sorted(
                          item['canonical_opponent_key']
                          for item in dry['report']['changes']
                      )
                      assert proposed == repair_authority['blocker_keys'], (
                          proposed,
                          repair_authority['blocker_keys'],
                      )
                      prepared = apply_and_prepare_repair(
                          repair_worktree,
                          request['school_key'],
                          request['target_sha'],
                          repair_authority['freeze_bytes'],
                          dry,
                          repair_authority['blocker_keys'],
                          repair_diag,
                          tool_repo=candidate,
                          sync_current_d1=repair_authority['sync_current_d1'],
                      )
                      field_proof = prepared['field_level_proof']
                      assert field_proof['literal_evidence_changes'] == 0, field_proof
                      assert field_proof['source_game_non_name_field_changes'] == 0, field_proof
                      assert (
                          field_proof['opponent_changed_keys']
                          == repair_authority['blocker_keys']
                      ), field_proof
                      assert not (
                          set(field_proof['source_game_changed_keys'])
                          - set(repair_authority['blocker_keys'])
                      ), field_proof
                      regenerated = post_repair_stage2_result(
                          repair_worktree,
                          request['school_key'],
                          repair_authority['freeze_bytes'],
                          repair_diag,
                          tool_repo=candidate,
                      )
                      repaired_stage2 = stage2_result_summary(regenerated)
                      repaired_universe = candidate_census_decision_universe(
                          regenerated
                      )
                      assert len(repaired_universe) == 64
                      assert all(
                          ch in '0123456789abcdef'
                          for ch in repaired_universe
                      ), repaired_universe
                      repaired_plan = json.loads(
                          (
                              repair_worktree
                              / '.onboarding'
                              / request['school_key']
                              / 'plan.json'
                          ).read_text()
                      )
                      accepted_warnings = repair_authority[
                          'accepted_legacy_warnings'
                      ]
                      assert (
                          list(repaired_plan.get('warnings') or [])
                          == accepted_warnings
                      ), repaired_plan.get('warnings')
                      assert (
                          list(
                              (repaired_plan.get('package') or {}).get(
                                  'warnings'
                              )
                              or []
                          )
                          == accepted_warnings
                      ), (repaired_plan.get('package') or {}).get('warnings')

                      repeated = post_repair_stage2_result(
                          repair_worktree,
                          request['school_key'],
                          repair_authority['freeze_bytes'],
                          repair_diag / 'determinism-repeat',
                          tool_repo=candidate,
                      )
                      repeated_stage2 = stage2_result_summary(repeated)
                      repeated_universe = candidate_census_decision_universe(
                          repeated
                      )
                      assert repeated_universe == repaired_universe, (
                          repeated_universe,
                          repaired_universe,
                      )
                      assert (
                          repeated_stage2['stage2_status']
                          == repaired_stage2['stage2_status']
                      ), repeated_stage2
                      assert (
                          repeated_stage2['warning_count']
                          == repaired_stage2['warning_count']
                      ), repeated_stage2
                      assert (
                          repeated_stage2['decision_count']
                          == repaired_stage2['decision_count']
                      ), repeated_stage2
                      assert (
                          repeated_stage2['artifact_normalized_sha256']
                          == repaired_stage2['artifact_normalized_sha256']
                      ), repeated_stage2
                  finally:
                      subprocess.run(
                          [
                              'git', '-C', str(candidate), 'worktree', 'remove',
                              '--force', str(repair_worktree),
                          ],
                          check=True,
                      )

                  repaired_status = regenerated.get('status') or {}
                  repaired_preflight = repaired_status.get('preflight') or {}
                  repaired_blockers = set(repaired_status.get('blockers') or [])
                  assert (
                      baseline_warning_count
                      == len(repair_authority['accepted_legacy_warnings'])
                  ), repair_authority['accepted_legacy_warnings']
                  assert (
                      int(repaired_preflight.get('warning_count', 0) or 0)
                      == len(repair_authority['accepted_legacy_warnings'])
                  ), repaired_preflight
                  repaired_decision_count = int(
                      repaired_preflight.get('decision_count', 0) or 0
                  )
                  if (
                      baseline_decision_count == 0
                      and repaired_decision_count > 0
                  ):
                      assert repaired_universe != baseline_universe, (
                          repaired_universe,
                          baseline_universe,
                      )
                  repaired_proof = repaired_stage2['tracked_mutation_proof']
                  assert (
                      repaired_proof.get('tracked_stage2_mutation') == 'NONE'
                  ), repaired_proof
                  assert (
                      repaired_stage2['stage2_status']
                      == 'CAPABILITY_CENSUS_READY'
                  ), repaired_stage2
                  assert repaired_stage2['blocker_count'] == 0, repaired_stage2
                  assert not repaired_blockers, repaired_blockers
                  classification = 'RESOLVED_BY_OPPONENT_REPRESENTATION'
                  opponent_representation_rehearsal = {
                      'blocker_keys': repair_authority['blocker_keys'],
                      'accepted_legacy_warnings': repair_authority[
                          'accepted_legacy_warnings'
                      ],
                      'field_level_proof': field_proof,
                      'post_repair_stage2': repaired_stage2,
                      'post_repair_blockers': sorted(repaired_blockers),
                      'post_repair_decision_universe_sha256': repaired_universe,
                  }
              else:
                  classification = 'ADVANCED_TO_DIFFERENT_BLOCKER'

          summary = {
              'kind': 'BLOCKED_CENSUS_CANDIDATE_REHEARSAL',
              'candidate_sha': candidate_sha,
              'control_commit': '${{ steps.authority.outputs.control_commit }}',
              'school_key': request['school_key'],
              'target_sha': request['target_sha'],
              'protected_main_sha': authority_main,
              'candidate_scope_main_sha': scoped_main,
              'changed_paths': changed_paths,
              'baseline_blockers': sorted(baseline_blockers),
              'candidate_blockers': sorted(candidate_blockers),
              'removed_blockers': sorted(baseline_blockers - candidate_blockers),
              'added_blockers': sorted(candidate_blockers - baseline_blockers),
              'candidate_warning_count': int(preflight.get('warning_count', 0) or 0),
              'candidate_decision_count': int(preflight.get('decision_count', 0) or 0),
              'candidate_decision_universe_sha256': preflight.get(
                  'decision_universe_sha256'
              ),
              'candidate_stage2_status': stage2_status,
              'classification': classification,
              'opponent_representation_rehearsal': opponent_representation_rehearsal,
              'tracked_mutation_proof': proof,
              'tracked_publication': 'NONE',
          }
          out = Path('/tmp/stage2-candidate-runtime-rehearsal')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'blocked-census-candidate-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('EXACT_BLOCKED_CENSUS_CANDIDATE_REPLAY=PASS')
          print('CANDIDATE_CLASSIFICATION=' + classification)
          print('POST_REPLAY_STAGE2_STATUS=' + stage2_status)
          print('TRACKED_BASKETBALL_PUBLICATION=NONE')
          PY

      - name: Replay live proposal after fresh census with candidate tooling
        if: >-
          github.event_name == 'pull_request' &&
          steps.authority.outputs.mode == 'LIVE_PROPOSAL_AFTER_CENSUS' &&
          !startsWith(github.event.pull_request.head.ref, 'tooling/stage2-display-')
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          candidate = Path('candidate').resolve()
          control = Path('control').resolve()
          sys.path.insert(0, str(candidate / 'tools'))
          from remote_implementation_stage2_census import (
              add_existing_onboarding_worktree,
              run_stage2_census_tool,
          )
          from remote_implementation_stage2_proposal import (
              run_stage2_proposal_tool,
              verify_stage2_proposal_authority,
          )
          from stage2_candidate_runtime_rehearsal import (
              candidate_census_decision_universe,
              candidate_changed_paths,
              validate_candidate_scope,
          )

          control_commit = '${{ steps.authority.outputs.control_commit }}'
          candidate_sha = '${{ steps.authority.outputs.candidate_sha }}'
          request = json.loads(
              (control / '.remote-implementation/request.json').read_text()
          )
          changed_paths, scoped_main = candidate_changed_paths(
              candidate,
              request['expected_protected_main_sha'],
              candidate_sha,
          )
          validate_candidate_scope(changed_paths)
          authority = verify_stage2_proposal_authority(
              request,
              control_commit,
              source_repo=control,
          )

          map_ref = request['recommendation_map']
          map_bytes = (control / map_ref['path']).read_bytes()
          assert hashlib.sha256(map_bytes).hexdigest() == map_ref['sha256']
          scratch = Path(tempfile.mkdtemp(prefix='live-proposal-candidate-'))
          map_path = scratch / 'recommendation-map.json'
          map_path.write_bytes(map_bytes)

          challenge_path = None
          challenge_ref = authority.get('historical_game_type_challenge')
          if challenge_ref:
              challenge_bytes = (control / challenge_ref['path']).read_bytes()
              assert (
                  hashlib.sha256(challenge_bytes).hexdigest()
                  == challenge_ref['sha256']
              )
              challenge_path = scratch / 'historical-game-type-challenge.json'
              challenge_path.write_bytes(challenge_bytes)

          target = add_existing_onboarding_worktree(
              request['target_branch'],
              request['target_sha'],
              request['school_key'],
              source_repo=control,
          )
          try:
              census = run_stage2_census_tool(
                  target,
                  request['school_key'],
                  authority['freeze_bytes'],
                  scratch / 'candidate-census',
                  tool_repo=candidate,
                  historical_game_type_challenge_path=challenge_path,
              )
              candidate_universe = candidate_census_decision_universe(census)
              preflight = (census.get('status') or {}).get('preflight') or {}
              assert census['stage2_status'] == 'CAPABILITY_CENSUS_READY', census
              assert int(preflight.get('blocker_count', -1)) == 0, preflight
              assert (
                  candidate_universe == request['decision_universe_sha256']
              ), (candidate_universe, request['decision_universe_sha256'])
              assert (
                  int(preflight.get('warning_count', -1))
                  == len(authority.get('accepted_legacy_warnings') or [])
              ), preflight
              census_proof = census.get('tracked_mutation_proof') or {}
              assert census_proof.get('tracked_stage2_mutation') == 'NONE', census_proof

              result = run_stage2_proposal_tool(
                  target,
                  request['school_key'],
                  authority['freeze_bytes'],
                  map_path,
                  request['decision_universe_sha256'],
                  scratch / 'candidate-proposal',
                  tool_repo=candidate,
                  historical_game_type_challenge_path=challenge_path,
                  venue_reconciliation_bytes=authority.get(
                      'venue_reconciliation_bytes'
                  ),
              )
              assert result['stage2_status'] == 'OWNER_GATE_1_READY', result
              proposal_proof = result.get('tracked_mutation_proof') or {}
              assert (
                  proposal_proof.get('tracked_stage2_mutation') == 'NONE'
              ), proposal_proof
          finally:
              subprocess.run(
                  ['git', '-C', str(control), 'worktree', 'remove',
                   '--force', str(target)],
                  check=True,
              )

          summary = {
              'kind': 'LIVE_PROPOSAL_AFTER_CENSUS_CANDIDATE_REHEARSAL',
              'candidate_sha': candidate_sha,
              'candidate_scope_main_sha': scoped_main,
              'control_commit': control_commit,
              'request_id': request['request_id'],
              'school_key': request['school_key'],
              'target_sha': request['target_sha'],
              'decision_universe_sha256': request['decision_universe_sha256'],
              'candidate_decision_universe_sha256': candidate_universe,
              'recommendation_map_sha256': map_ref['sha256'],
              'accepted_legacy_warnings': authority.get(
                  'accepted_legacy_warnings'
              ) or [],
              'candidate_stage2_status': result['stage2_status'],
              'changed_paths': changed_paths,
              'tracked_mutation_proof': proposal_proof,
          }
          out = Path('/tmp/stage2-candidate-runtime-rehearsal')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'live-proposal-candidate-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('EXACT_LIVE_PROPOSAL_AFTER_CENSUS_REPLAY=PASS')
          print('UNCHANGED_HISTORICAL_DECISION_UNIVERSE=PASS')
          print('TRACKED_STAGE2_MUTATION=NONE')
          PY

