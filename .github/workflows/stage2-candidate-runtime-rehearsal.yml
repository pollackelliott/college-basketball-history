          !startsWith(github.event.pull_request.head.ref, 'tooling/stage2-display-')
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          candidate = Path('candidate').resolve()
          control = Path('control').resolve()
          sys.path.insert(0, str(candidate / 'tools'))
          from remote_implementation_stage2_census import (
              add_existing_onboarding_worktree,
              run_stage2_census_tool,
              verify_phase0_authority,
          )

          request = json.loads(
              (control / '.remote-implementation/request.json').read_text()
          )
          control_commit = '${{ steps.authority.outputs.control_commit }}'
          authority = verify_phase0_authority(
              request,
              control_commit,
              source_repo=control,
          )
          assert (
              authority.get('target_authority_kind')
              == 'STAGE2_CURRENT_MAIN_REFRESH_SUCCESSOR'
          ), authority.get('target_authority_kind')
          assert authority.get('phase0_target_sha') == request['target_sha']

          worktree = add_existing_onboarding_worktree(
              request['target_branch'],
              request['target_sha'],
              request['school_key'],
              source_repo=candidate,
          )
          try:
              result = run_stage2_census_tool(
                  worktree,
                  request['school_key'],
                  authority['freeze_bytes'],
                  Path('/tmp/stage2-candidate-runtime-rehearsal'),
                  tool_repo=candidate,
              )
          finally:
              subprocess.run(
                  ['git', '-C', str(candidate), 'worktree', 'remove',
                   '--force', str(worktree)],
                  check=True,
              )

          expected = request['phase_continuation'][
              'expected_decision_universe_sha256'
          ]
          preflight = result['status'].get('preflight') or {}
          proof = result.get('tracked_mutation_proof') or {}
          assert result['stage2_status'] == 'CAPABILITY_CENSUS_READY'
          assert preflight.get('blocker_count') == 0, preflight
          assert preflight.get('warning_count') == 0, preflight
          assert preflight.get('decision_count') == 0, preflight
          assert preflight.get('decision_universe_sha256') == expected, preflight
          assert proof.get('tracked_stage2_mutation') == 'NONE', proof

          summary = {
              'kind': 'LIVE_CENSUS_AFTER_REFRESH_CANDIDATE_REHEARSAL',
              'candidate_sha': '${{ steps.authority.outputs.candidate_sha }}',
              'control_commit': control_commit,
              'school_key': request['school_key'],
              'target_sha': request['target_sha'],
              'expected_protected_main_sha': request[
                  'expected_protected_main_sha'
              ],
              'stage2_status': result['stage2_status'],
              'decision_universe_sha256': preflight[
                  'decision_universe_sha256'
              ],
              'tracked_stage2_mutation': proof['tracked_stage2_mutation'],
          }
          out = Path('/tmp/stage2-candidate-runtime-rehearsal')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'live-census-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('EXACT_LIVE_CENSUS_CANDIDATE_REPLAY=PASS')
          print('UNCHANGED_HISTORICAL_DECISION_UNIVERSE=PASS')
          print('TRACKED_STAGE2_MUTATION=NONE')
          PY

      - name: Replay live census after opponent-display normalization
        if: >-
          github.event_name == 'pull_request' &&
          steps.authority.outputs.mode == 'LIVE_CENSUS_AFTER_OPPONENT_DISPLAY' &&
          !startsWith(github.event.pull_request.head.ref, 'tooling/stage2-display-')
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          candidate = Path('candidate').resolve()
          control = Path('control').resolve()
          sys.path.insert(0, str(candidate / 'tools'))
          from remote_implementation_stage2_census import (
              add_existing_onboarding_worktree,
              run_stage2_census_tool,
              verify_phase0_authority,
          )

          state = json.loads(
              (control / '.remote-implementation/control-state.json').read_text()
          )
          last = state.get('last_operation') or {}
          successor_path = Path(
              '${{ steps.authority.outputs.proposal_checkpoint_path }}'
          )
          successor_raw = (control / successor_path).read_bytes()
          assert (
              hashlib.sha256(successor_raw).hexdigest()
              == last['successor_manifest_sha256']
          )
          successor = json.loads(successor_raw)
          census_path = Path(successor['stage2_census_checkpoint_path'])
          census_raw = (control / census_path).read_bytes()
          assert (
              hashlib.sha256(census_raw).hexdigest()
              == successor['stage2_census_checkpoint_sha256']
          )
          census = json.loads(census_raw)

          request = {
              'school_key': last['school_key'],
              'target_branch': last['target_branch'],
              'target_sha': last['target_sha'],
              'expected_protected_main_sha': last['protected_main_sha'],
              'phase0_successor': {
                  'path': census['phase0_successor_path'],
                  'sha256': census['phase0_successor_sha256'],
              },
              'integration_freeze_sha256': last['integration_freeze_sha256'],
              'semantic_snapshot_sha256': last['semantic_snapshot_sha256'],
              'stage2_opponent_display_successor': {
                  'path': successor_path.as_posix(),
                  'sha256': last['successor_manifest_sha256'],
              },
          }
          control_commit = '${{ steps.authority.outputs.control_commit }}'
          authority = verify_phase0_authority(
              request,
              control_commit,
              source_repo=control,
          )
          assert (
              authority.get('target_authority_kind')
              == 'STAGE2_OPPONENT_DISPLAY_SUCCESSOR'
          ), authority.get('target_authority_kind')
          assert authority.get('phase0_target_sha') != request['target_sha']

          worktree = add_existing_onboarding_worktree(
              request['target_branch'],
              request['target_sha'],
              request['school_key'],
              source_repo=candidate,
          )
          try:
              result = run_stage2_census_tool(
                  worktree,
                  request['school_key'],
                  authority['freeze_bytes'],
                  Path('/tmp/stage2-candidate-runtime-rehearsal'),
                  tool_repo=candidate,
              )
          finally:
              subprocess.run(
                  ['git', '-C', str(candidate), 'worktree', 'remove',
                   '--force', str(worktree)],
                  check=True,
              )

          preflight = result['status'].get('preflight') or {}
          proof = result.get('tracked_mutation_proof') or {}
          universe = str(preflight.get('decision_universe_sha256') or '')
          assert result['stage2_status'] == 'CAPABILITY_CENSUS_READY'
          assert preflight.get('blocker_count') == 0, preflight
          assert preflight.get('warning_count') == 0, preflight
          assert len(universe) == 64, preflight
          assert proof.get('tracked_stage2_mutation') == 'NONE', proof

          summary = {
              'kind': 'LIVE_CENSUS_AFTER_OPPONENT_DISPLAY_CANDIDATE_REHEARSAL',
              'candidate_sha': '${{ steps.authority.outputs.candidate_sha }}',
              'control_commit': control_commit,
              'school_key': request['school_key'],
              'target_sha': request['target_sha'],
              'expected_protected_main_sha': request[
                  'expected_protected_main_sha'
              ],
              'stage2_status': result['stage2_status'],
              'decision_count': preflight.get('decision_count'),
              'decision_universe_sha256': universe,
              'tracked_stage2_mutation': proof['tracked_stage2_mutation'],
          }
          out = Path('/tmp/stage2-candidate-runtime-rehearsal')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'live-census-after-opponent-display-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('EXACT_LIVE_CENSUS_AFTER_OPPONENT_DISPLAY_REPLAY=PASS')
          print('CANDIDATE_DECISION_UNIVERSE=' + universe)
          print('TRACKED_STAGE2_MUTATION=NONE')
          PY

      - name: Require control and actual PR head remained fixed
        if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.event.pull_request.head.ref, 'tooling/stage2-display-')
        shell: bash
        env:
          SELECTED_CONTROL: ${{ steps.authority.outputs.control_commit }}
          SELECTED_CANDIDATE: ${{ steps.authority.outputs.candidate_sha }}
          AUTHORITY_MODE: ${{ steps.authority.outputs.mode }}
          EXPECTED_MAIN_SHA: ${{ steps.authority.outputs.expected_main_sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          control="$(git -C control ls-remote origin refs/heads/control/remote-implementation | awk '{print $1}')"
          candidate="$(git -C candidate ls-remote origin "refs/heads/$PR_HEAD_REF" | awk '{print $1}')"
          test -n "$control" && test "$control" = "$SELECTED_CONTROL"
          test -n "$candidate" && test "$candidate" = "$SELECTED_CANDIDATE"
          if [[ "$AUTHORITY_MODE" == "LIVE_PROPOSAL_AFTER_CENSUS" ]]; then
            scoped_main="$(python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/stage2-candidate-runtime-rehearsal/live-proposal-candidate-summary.json').read_text())
          print(summary['candidate_scope_main_sha'])
          PY
          )"
          elif [[ "$AUTHORITY_MODE" == "BLOCKED_PROPOSAL" ]]; then
            scoped_main="$(python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/stage2-candidate-runtime-rehearsal/candidate-rehearsal-summary.json').read_text())
          print(summary['candidate_scope_main_sha'])
          PY
          )"
          elif [[ "$AUTHORITY_MODE" == "BLOCKED_PRESEAL" ]]; then
            scoped_main="$(python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/stage2-candidate-runtime-rehearsal/candidate-preseal-summary.json').read_text())
          print(summary['candidate_scope_main_sha'])
          PY
          )"
          elif [[ "$AUTHORITY_MODE" == "BLOCKED_CENSUS_OPPONENT_REPRESENTATION" ]]; then
            scoped_main="$(python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/stage2-candidate-runtime-rehearsal/blocked-census-candidate-summary.json').read_text())
          print(summary['candidate_scope_main_sha'])
          PY
          )"
          elif [[ "$AUTHORITY_MODE" == "LIVE_CENSUS_AFTER_REFRESH" ]]; then
            scoped_main="$EXPECTED_MAIN_SHA"
          elif [[ "$AUTHORITY_MODE" == "LIVE_CENSUS_AFTER_OPPONENT_DISPLAY" ]]; then
            scoped_main="$EXPECTED_MAIN_SHA"
          elif [[ "$AUTHORITY_MODE" == "RECOVERED_IDLE" ]]; then
            scoped_main="$EXPECTED_MAIN_SHA"
            echo 'RECOVERED_IDLE_NO_HISTORICAL_REPLAY_REQUIRED=PASS'
          else
            echo "Unsupported authority mode: $AUTHORITY_MODE" >&2
            exit 1
          fi
          live_main="$(git -C candidate ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$live_main" && test "$live_main" = "$scoped_main"
          echo 'EXACT_PR_HEAD_CONTROL_AND_MAIN_STABILITY=PASS'
      - name: Rehearse recovered census-bound opponent display repair with candidate tooling
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.event.pull_request.head.ref, 'tooling/stage2-display-')
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python candidate/tools/stage2_candidate_opponent_display_rehearsal.py \
            --control-checkout control \
            --candidate-checkout candidate \
            --candidate-sha "$PR_HEAD_SHA" \
            --control-commit "$(git -C control rev-parse HEAD)" \
            --pr-head-ref "$PR_HEAD_REF" \
            --diag /tmp/stage2-candidate-runtime-rehearsal

      - name: Upload candidate rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-candidate-runtime-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/stage2-candidate-runtime-rehearsal
          if-no-files-found: ignore
          retention-days: 14
