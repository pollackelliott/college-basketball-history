name: Stage 2 reconciliation diagnostic remote validation

on:
  push:
    branches:
      - tooling/stage2-reconciliation-diagnostic-remote

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile tools/remote_implementation_control.py
          python -m py_compile tools/remote_implementation_runner.py
          python -m py_compile tools/remote_implementation_verify.py
          python -m py_compile tools/remote_implementation_stage2_diagnostic.py
      - name: Focused remote diagnostic tests
        run: |
          python -m unittest discover -s tests -p 'test_remote_implementation_stage2_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_remote_implementation_control.py' -v
          python -m unittest discover -s tests -p 'test_remote_implementation_stage2_proposal.py' -v
          python -m unittest discover -s tests -p 'test_reconciliation_diagnostic_trace.py' -v
