    <div class="mobile-search-head"><label class="sr-only" for="mobileSearch">Search current Division I programs</label><input id="mobileSearch" placeholder="Search current D1 programs…" autocomplete="off" aria-controls="mobileSearchResults" aria-expanded="false"><button type="button" class="mobile-search-close" onclick="toggleMobileSearch(false)" aria-label="Close search">×</button></div>
    <div id="mobileSearchResults" class="search-results" role="listbox"></div>
  </section>
</div>
<main id="app" class="shell"></main>
<footer id="siteFooter">Published program pages are loading from generated data.</footer>
<script>
"use strict";

const DB = {
  manifest: null,
  referenceSeason: "",
  programs: [],
  activeKeys: [],
  teams: {},
  summaries: {},
  seasons: {},
  opponents: {},
  games: {},
  conferenceHistory: {},
  conferenceNames: {},
  conferenceTournamentLabels: {},
  pairs: {},
};

let ACTIVE = new Set();
const PAGE_SIZE = 50;
const teamPageState = {};
const directoryState = { query: "", conference: "all", availability: "all" };
let mobileSearchReturnFocus = null;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;",
  })[char]);
}

function fmtNum(value) {
  return Number(value ?? 0).toLocaleString("en-US");
}

function fmtOptionalNum(value) {
  return value == null ? "—" : fmtNum(value);
}

function fmtOptionalYear(value) {
  return value == null ? "—" : String(value);
}

function fmtWinPct(wins, losses, ties = 0) {
  const games = Number(wins || 0) + Number(losses || 0) + Number(ties || 0);
  if (!games) return ".000";
  const rate = (Number(wins || 0) + 0.5 * Number(ties || 0)) / games;
  const formatted = Math.max(0, Math.min(1, rate)).toFixed(3);
  return formatted.startsWith("0.") ? formatted.slice(1) : formatted;
}

function fmtRecord(wins, losses, ties = 0) {
  return `${fmtNum(wins)}–${fmtNum(losses)}${ties ? `–${fmtNum(ties)}` : ""}`;
}

function initials(name) {
  return String(name || "?")
    .split(/\s+/)
    .filter(Boolean)
    .map((part) => part[0])
    .join("")
    .slice(0, 2)
    .toUpperCase();
}

function textColor(hex) {
  const value = String(hex || "#333333").replace("#", "");
  if (!/^[0-9a-f]{6}$/i.test(value)) return "#fff";
  const channels = [value.slice(0, 2), value.slice(2, 4), value.slice(4, 6)]
    .map((channel) => parseInt(channel, 16) / 255)
    .map((channel) => channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4);
  const luminance = channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
  const darkLuminance = 0;
  const whiteContrast = 1.05 / (luminance + 0.05);
  const darkContrast = (luminance + 0.05) / (darkLuminance + 0.05);
  return whiteContrast >= darkContrast ? "#FFFFFF" : "#000000";
}

function safeHex(value, fallback) {
  const color = String(value || "").trim();
  return /^#[0-9a-f]{6}$/i.test(color) ? color.toUpperCase() : fallback;
}

function conferenceName(conference) {
  return conference?.conference_name || "";
}

function programLocation(program) {
  return [program.city, program.state].filter(Boolean).join(", ");
}

function gameLocation(game) {
  return [game.site_city, game.site_state].filter(Boolean).join(", ");
}

function humanizeKey(value) {
  if (!value) return "—";
  return String(value)
    .toLowerCase()
    .replace(/[_-]+/g, " ")
    .replace(/\b\w/g, (letter) => letter.toUpperCase());
}

function formatSeason(season) {
  return String(season || "—").replace(/^(\d{4})-\d{2}(\d{2})$/, "$1–$2");
}

function formatSinceSeason(season) {
  return String(season || "—").replace(/^(\d{4})-\d{2}(\d{2})$/, "$1-$2");
}

function bestFinishLabel(key) {
  const labels = {
    NATIONAL_CHAMPION: "National Champion",
    NATIONAL_RUNNER_UP: "National Runner Up",
    FINAL_FOUR: "Final Four",
    ELITE_EIGHT: "Elite Eight",
    SWEET_SIXTEEN: "Sweet Sixteen",
    ROUND_OF_32: "Round of 32",
    ROUND_OF_64: "Round of 64",
    PLAY_IN_ROUND: "Play-in Round",
  };
  return labels[key] || "—";
}

function formatGameDate(game) {
  if (game.datePrecision !== "EXACT" || !game.date) {
    return `${formatSeason(game.season)} · exact date unknown`;
  }
  const parsed = new Date(`${game.date}T12:00:00`);
  return Number.isNaN(parsed.getTime())
    ? game.date
    : parsed.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

function compactGameDate(game) {
  if (game.datePrecision !== "EXACT" || !game.date) return `${formatSeason(game.season)} · date unknown`;
  const parsed = new Date(`${game.date}T12:00:00`);
  return Number.isNaN(parsed.getTime())
    ? game.date
    : parsed.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

function gameSortValue(game) {
  return `${game.date || ""}|${game.season || ""}`;
}

function scoreText(game) {
  if (!game.scoreKnown || game.teamScore == null || game.oppScore == null) return "—";
  const overtime = game.overtimePeriods > 0
    ? ` (${game.overtimePeriods === 1 ? "OT" : `${game.overtimePeriods}OT`})`
    : "";
  return `${game.teamScore}–${game.oppScore}${overtime}`;
}

function resolvedConferenceMembership(game, teamKey) {
  if (!teamKey) return null;
  const matches = (DB.conferenceHistory[teamKey] || []).filter((membership) => (
    membership.start_season <= game.season
    && (!membership.end_season || game.season <= membership.end_season)
  ));
  if (matches.length !== 1 || matches[0].conference_key === "independent") return null;
  return matches[0];
}

function fullConferenceTournamentLabel(game, teamKey) {
  const membership = resolvedConferenceMembership(game, teamKey);
  if (!membership) return "Conference Tournament";
  const name = DB.conferenceNames[teamKey]?.[membership.conference_key];
  return name ? `${name} Tournament` : "Conference Tournament";
}

function baseGameTypeLabel(game, teamKey) {
const labels = {
REGULAR_SEASON: "Regular season",
CONFERENCE_TOURNAMENT: fullConferenceTournamentLabel(game, teamKey),
NCAA_TOURNAMENT: "NCAA Tournament",
NIT: "NIT",
};
return labels[game.gameType] || humanizeKey(game.gameType || "Game");
}
function gameTypeLabel(game, teamKey) {
const base = baseGameTypeLabel(game, teamKey);
return game.postseasonRound ? `${base} · ${humanizeKey(game.postseasonRound)}` : base;
}

function mobileConferenceTournamentLabel(game, teamKey) {
  const membership = resolvedConferenceMembership(game, teamKey);
  if (!membership) return "Conference Tournament";
  const conferenceKey = membership.conference_key;
  const label = DB.conferenceTournamentLabels[teamKey]?.[conferenceKey];
  return label ? `${label} T` : "Conference Tournament";
}

function mobileGameTypeLabel(game, teamKey) {
  let base;
  if (game.gameType === "NCAA_TOURNAMENT") base = "NCAA T";
  else if (game.gameType === "CONFERENCE_TOURNAMENT") {
    return mobileConferenceTournamentLabel(game, teamKey);
  } else base = baseGameTypeLabel(game);
  return game.postseasonRound ? `${base} · ${humanizeKey(game.postseasonRound)}` : base;
}

function administrativeLabel(status) {
  return status ? humanizeKey(status) : "On court";
}

function administrativeClass(status) {
  if (!status) return "verified";
  return status === "FORFEIT" ? "resolved" : "review";
}

function administrativeChip(game) {
  const title = game.administrativeNote ? ` title="${esc(game.administrativeNote)}"` : "";
  return `<span class="chip ${administrativeClass(game.administrativeStatus)}"${title}>${esc(administrativeLabel(game.administrativeStatus))}</span>`;
}

function normalizeProgram(program) {
  return {
    key: program.program_key,
    name: program.program_name,
    display: program.display_name || program.program_name,
    nickname: program.nickname || "",
    city: program.city || "",
    state: program.state || "",
    location: programLocation(program),
    conference: conferenceName(program.current_conference) || "Independent",
    primary: safeHex(program.primary_hex, "#334155"),
    secondary: safeHex(program.secondary_hex, "#FFFFFF"),
    historyStartSeason: program.history_start_season || "",
    conferenceRegularSeasonChampionships:
      program.conference_regular_season_championships == null
        ? null
        : Number(program.conference_regular_season_championships),
    conferenceTournamentChampionships:
      program.conference_tournament_championships == null
        ? null
        : Number(program.conference_tournament_championships),
    ncaaTournamentAppearances:
      program.ncaa_tournament_appearances == null
        ? null
        : Number(program.ncaa_tournament_appearances),
    finalFourAppearances:
      program.final_four_appearances == null
        ? null
        : Number(program.final_four_appearances),
    nationalChampionships:
      program.national_championships == null
        ? null
        : Number(program.national_championships),
    bestFinishKey: program.best_finish_key || "",
    bestFinishYear:
      program.best_finish_year == null ? null : Number(program.best_finish_year),
    currentD1: program.current_d1 !== false,
    enabled: Boolean(program.public_page_enabled),
  };
}

function normalizeOpponent(opponent) {
  return {
    key: opponent.opponent_key,
    name: opponent.opponent_name,
    currentD1: Boolean(opponent.current_d1),
    enabled: Boolean(opponent.public_page_enabled),
    conference: conferenceName(opponent.current_conference)
      || (opponent.current_d1 ? "Independent" : "Non-D1 / Historical"),
    firstSeason: opponent.first_season,
    lastSeason: opponent.last_season,
    games: opponent.games,
    wins: opponent.wins,
    losses: opponent.losses,
    ties: opponent.ties,
  };
}

function normalizeGame(game, opponentsByKey) {
  const opponent = opponentsByKey.get(game.opponent_key);
  return {
    canonicalGameId: game.canonical_game_id,
    season: game.season_label,
    date: game.game_date,
    datePrecision: game.date_precision,
    opponentKey: game.opponent_key,
    opponent: game.opponent_name,
    opponentCurrentD1: Boolean(game.opponent_current_d1),
    opponentPublicPageEnabled: Boolean(game.opponent_public_page_enabled),
    opponentConference: opponent?.conference
      || (game.opponent_current_d1 ? "Independent" : "Non-D1 / Historical"),
    teamScore: game.team_score,
    oppScore: game.opponent_score,
    scoreKnown: Boolean(game.score_known),
    result: game.result,
    overtimePeriods: Number(game.overtime_periods || 0),
    site: game.site || "UNKNOWN",
    venue: game.venue_name || humanizeKey(game.venue_key),
    venueKey: game.venue_key,
    location: gameLocation(game),
    siteCity: game.site_city,
    siteState: game.site_state,
    gameType: game.game_type,
    postseasonRound: game.postseason_round,
    administrativeStatus: game.administrative_status,
    administrativeNote: game.administrative_note,
  };
}

function oppositeResult(result) {
  return result === "W" ? "L" : result === "L" ? "W" : result;
}

function pairSite(site, teamKey, opponentKey) {
  if (site === "HOME") return `at ${DB.teams[teamKey].name}`;
  if (site === "AWAY") return `at ${DB.teams[opponentKey].name}`;
  if (site === "NEUTRAL") return "Neutral";
  return "Unknown";
}

function buildPairs() {
  DB.pairs = {};
  const seenByPair = {};

  for (const teamKey of DB.activeKeys) {
    for (const game of DB.games[teamKey]) {
      const opponentKey = game.opponentKey;
      if (!ACTIVE.has(opponentKey)) continue;
      const ordered = [teamKey, opponentKey].sort();
      if (teamKey !== ordered[0]) continue;
      const pairKey = ordered.join("--");
      if (!DB.pairs[pairKey]) DB.pairs[pairKey] = { games: [] };
      if (!seenByPair[pairKey]) seenByPair[pairKey] = new Set();
      if (seenByPair[pairKey].has(game.canonicalGameId)) continue;
      seenByPair[pairKey].add(game.canonicalGameId);

      DB.pairs[pairKey].games.push({
        canonicalGameId: game.canonicalGameId,
        season: game.season,
        date: game.date,
        datePrecision: game.datePrecision,
        scores: {
          [teamKey]: game.teamScore,
          [opponentKey]: game.oppScore,
        },
        results: {
          [teamKey]: game.result,
          [opponentKey]: oppositeResult(game.result),
        },
        scoreKnown: game.scoreKnown,
        overtimePeriods: game.overtimePeriods,
        site: pairSite(game.site, teamKey, opponentKey),
        venue: game.venue,
        location: game.location,
        gameType: game.gameType,
        postseasonRound: game.postseasonRound,
        administrativeStatus: game.administrativeStatus,
        administrativeNote: game.administrativeNote,
      });
    }
  }
}

async function fetchJSON(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(`${response.status} ${response.statusText} while loading ${url}`);
  return response.json();
}

async function loadData() {
  const manifest = await fetchJSON("data/manifest.json");
  if (manifest.schema_version !== 1) throw new Error(`Unsupported manifest schema: ${manifest.schema_version}`);
  DB.manifest = manifest;
  DB.referenceSeason = manifest.reference_season || "";

  const programsPath = manifest.files?.programs || "programs.json";
  const programsDocument = await fetchJSON(`data/${programsPath}`);
  if (!Array.isArray(programsDocument.programs)) throw new Error("programs.json does not contain a programs array");

  DB.programs = programsDocument.programs
    .map(normalizeProgram)
    .sort((a, b) => a.name.localeCompare(b.name));
  DB.activeKeys = DB.programs.filter((program) => program.enabled).map((program) => program.key);
  ACTIVE = new Set(DB.activeKeys);

  if (manifest.program_count != null && DB.programs.length !== manifest.program_count) {
    throw new Error(`Program count mismatch: expected ${manifest.program_count}, loaded ${DB.programs.length}`);
  }
  if (manifest.public_page_count != null && DB.activeKeys.length !== manifest.public_page_count) {
    throw new Error(`Public-page count mismatch: expected ${manifest.public_page_count}, loaded ${DB.activeKeys.length}`);
  }

  const teamsRoot = String(manifest.files?.teams_root || "teams/")
    .replace(/^\/+/, "")
    .replace(/\/?$/, "/");
  const teamDocuments = await Promise.all(
    DB.activeKeys.map((key) => fetchJSON(`data/${teamsRoot}${encodeURIComponent(key)}.json`)),
  );

  for (const document of teamDocuments) {
    const key = document.program?.program_key;
    if (!ACTIVE.has(key)) throw new Error(`Unexpected team file: ${key || "missing program_key"}`);
    const directoryProgram = DB.programs.find((program) => program.key === key);
    const opponents = (document.opponents || []).map(normalizeOpponent);
    const opponentsByKey = new Map(opponents.map((opponent) => [opponent.key, opponent]));
    const games = (document.games || []).map((game) => normalizeGame(game, opponentsByKey));
    const summary = document.summary || {};

    DB.teams[key] = directoryProgram;
    DB.opponents[key] = opponents;
    DB.seasons[key] = document.seasons || [];
    DB.games[key] = games;
    DB.conferenceHistory[key] = document.conference_history || [];
    DB.conferenceNames[key] = document.conference_names || {};
    DB.conferenceTournamentLabels[key] = document.conference_tournament_labels || {};
    DB.summaries[key] = {
      games: summary.games || games.length,
      wins: summary.wins || 0,
      losses: summary.losses || 0,
      ties: summary.ties || 0,
      firstSeason: summary.first_season,
      lastSeason: summary.last_season,
      opponents: summary.opponents || opponents.length,
      home: games.filter((game) => game.site === "HOME").length,
      road: games.filter((game) => game.site === "AWAY").length,
      neutral: games.filter((game) => game.site === "NEUTRAL").length,
      unknownSite: games.filter((game) => game.site === "UNKNOWN").length,
    };
  }

  const missing = DB.activeKeys.filter((key) => !DB.teams[key]);
  if (missing.length) throw new Error(`Missing team data: ${missing.join(", ")}`);
  buildPairs();
}

function updateChrome() {
  const count = DB.activeKeys.length;
  document.title = "College Basketball History";
  const subtitle = document.getElementById("brandSubtitle");
  if (subtitle) subtitle.textContent = `${count} histories available`;
  const search = document.getElementById("globalSearch");
  if (search) search.placeholder = `Search ${fmtNum(DB.programs.length)} current D1 programs…`;
  const mobileSearch = document.getElementById("mobileSearch");
  if (mobileSearch) mobileSearch.placeholder = `Search ${fmtNum(DB.programs.length)} current D1 programs…`;
  const footer = document.getElementById("siteFooter");
  if (footer) {
    footer.textContent = `${count} complete program histories are available. Every current Division I program remains visible in the directory. Records default to on-court outcomes; administrative adjustments remain separate metadata.`;
  }
}

function programByKey(key) {
  return DB.teams[key] || DB.programs.find((program) => program.key === key) || null;
}

function teamLogo(keyOrProgram) {
  const team = typeof keyOrProgram === "string" ? programByKey(keyOrProgram) : keyOrProgram;
  if (!team) return "";
  const color = textColor(team.primary);
  return `<div class="logo-disc" style="--team:${team.primary};--secondary:${team.secondary || "#fff"};--teamText:${color};background:${team.primary};color:${color};border-color:${team.secondary || "#fff"}">${initials(team.name)}</div>`;
}

function goHome() {
  location.hash = "home";
}

function goTeam(key) {
  if (ACTIVE.has(key)) location.hash = `team/${key}`;
}

function goMatch(teamA, teamB) {
  if (seriesGamesFor(teamA, teamB).length) location.hash = `matchup/${teamA}/${teamB}`;
}

function showAbout() {
  location.hash = "about";
}

function directoryCard(program) {
  const cardText = textColor(program.primary);
  const action = program.enabled ? `onclick="goTeam('${program.key}')"` : "disabled";
  const aria = program.enabled
    ? `${program.name}. Open program history.`
    : `${program.name}. Program history not yet published.`;
  return `<button type="button" class="program-card ${program.enabled ? "enabled" : "disabled"}" style="--primary:${program.primary};--secondary:${program.secondary};--cardText:${cardText}" ${action} aria-label="${esc(aria)}"><span><span class="program-name">${esc(program.name)}</span><span class="program-meta">${esc(program.nickname || "Nickname not listed")} · ${esc(program.conference)}</span></span></button>`;
}

function filteredDirectoryPrograms() {
  const query = directoryState.query.toLowerCase().trim();
  return DB.programs.filter((program) => {
    if (directoryState.conference !== "all" && program.conference !== directoryState.conference) return false;
    if (directoryState.availability === "available" && !program.enabled) return false;
    if (directoryState.availability === "coming" && program.enabled) return false;
    if (!query) return true;
    const searchable = `${program.name} ${program.display} ${program.nickname} ${program.conference} ${program.location}`.toLowerCase();
    return searchable.includes(query);
  });
}

function updateDirectory() {
  const query = document.getElementById("directorySearch");
  const conference = document.getElementById("directoryConference");
  const availability = document.getElementById("directoryAvailability");
  if (!query || !conference || !availability) return;
  directoryState.query = query.value;
  directoryState.conference = conference.value;
  directoryState.availability = availability.value;
  const programs = filteredDirectoryPrograms();
  const grid = document.getElementById("programGrid");
  const count = document.getElementById("directoryCount");
  grid.innerHTML = programs.length
    ? programs.map(directoryCard).join("")
    : '<div class="empty" style="grid-column:1/-1">No programs match these directory filters.</div>';
  count.textContent = `${fmtNum(programs.length)} of ${fmtNum(DB.programs.length)} current Division I programs shown`;
}

function homeView() {
  directoryState.query = "";
  directoryState.conference = "all";
  directoryState.availability = "all";
  const teamRows = DB.activeKeys.reduce((total, key) => total + DB.summaries[key].games, 0);
  const seriesKeys = new Set();
  for (const key of DB.activeKeys) {
    for (const opponent of DB.opponents[key] || []) seriesKeys.add([key, opponent.key].sort().join("--"));
  }
  const conferences = [...new Set(DB.programs.map((program) => program.conference).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
  const conferenceOptions = conferences.map((conference) => `<option value="${esc(conference)}">${esc(conference)}</option>`).join("");
  const allPrograms = DB.programs.map(directoryCard).join("");

  return `<section class="hero"><h1>College Basketball History</h1><p>Explore complete program histories, season-by-season results, and every available opponent series. New histories appear in the same Division I directory as soon as their verified data is published.</p><div class="statbar"><div class="stat"><b>${fmtNum(DB.activeKeys.length)}</b><span>complete histories</span></div><div class="stat"><b>${fmtNum(DB.programs.length)}</b><span>current D1 programs</span></div><div class="stat"><b>${fmtNum(teamRows)}</b><span>team-history rows</span></div><div class="stat"><b>${fmtNum(seriesKeys.size)}</b><span>opponent series</span></div></div></section><div class="section-head"><h2>Current D-I Directory</h2><p>Every school uses its official colors. Select any published program to explore its results.</p></div><div class="panel directory-panel"><div class="directory-controls"><div class="directory-control"><label for="directorySearch">Find a program</label><input id="directorySearch" type="search" placeholder="School, nickname, city…" autocomplete="off" oninput="updateDirectory()"></div><div class="directory-control"><label for="directoryConference">Conference</label><select id="directoryConference" onchange="updateDirectory()"><option value="all">All conferences</option>${conferenceOptions}</select></div><div class="directory-control"><label for="directoryAvailability">Availability</label><select id="directoryAvailability" onchange="updateDirectory()"><option value="all">All programs</option><option value="available">Published</option><option value="coming">Not yet published</option></select></div></div><div id="directoryCount" class="directory-count">${fmtNum(DB.programs.length)} of ${fmtNum(DB.programs.length)} current Division I programs shown</div><div id="programGrid" class="program-grid">${allPrograms}</div></div>`;
}

function canonicalWinnerKey(game, teamA, teamB) {
  if (game.results?.[teamA] === "W") return teamA;
  if (game.results?.[teamB] === "W") return teamB;
  if (game.results?.[teamA] === "T" || game.results?.[teamB] === "T") return "tie";
  const scoreA = game.scores?.[teamA];
  const scoreB = game.scores?.[teamB];
  if (scoreA == null || scoreB == null) return null;
  return scoreA > scoreB ? teamA : scoreA < scoreB ? teamB : "tie";
}

function opponentProfile(teamKey, opponentKey) {
  const knownProgram = programByKey(opponentKey);
  if (knownProgram) return knownProgram;
  const opponent = (DB.opponents[teamKey] || []).find((row) => row.key === opponentKey);
  return {
    key: opponentKey,
    name: opponent?.name || humanizeKey(opponentKey),
    display: opponent?.name || humanizeKey(opponentKey),
    nickname: "",
    location: "",
    conference: opponent?.conference || "Non-D1 / Historical",
    primary: "#5F6F82",
    secondary: "#FFFFFF",
    enabled: false,
  };
}

function seriesGamesFor(teamKey, opponentKey) {
  const team = DB.teams[teamKey];
  if (!team) return [];
  const opponent = opponentProfile(teamKey, opponentKey);
  return (DB.games[teamKey] || [])
    .filter((game) => (
      game.opponentKey === opponentKey
      && gameInProgramScope(game, teamKey)
    ))
    .map((game) => ({
      canonicalGameId: game.canonicalGameId,
      season: game.season,
      date: game.date,
      datePrecision: game.datePrecision,
      scores: { [teamKey]: game.teamScore, [opponentKey]: game.oppScore },
      results: { [teamKey]: game.result, [opponentKey]: oppositeResult(game.result) },
      scoreKnown: game.scoreKnown,
      overtimePeriods: game.overtimePeriods,
      site: game.site === "HOME" ? `at ${team.name}` : game.site === "AWAY" ? `at ${opponent.name}` : game.site === "NEUTRAL" ? "Neutral" : "Unknown",
      venue: game.venue,
      location: game.location,
      gameType: game.gameType,

function opponentBreakdown(key) {
  const ownConference = DB.teams[key]?.conference;
  const historicalConference = "Non-D1 / Historical";
  const groups = new Map();
  for (const opponent of DB.opponents[key] || []) {
    if (!groups.has(opponent.conference)) groups.set(opponent.conference, []);
    groups.get(opponent.conference).push(opponent);
  }

  return [...groups.entries()]
    .map(([conference, rows]) => ({
      conference,
      rows: rows.sort((a, b) => b.games - a.games || a.name.localeCompare(b.name)),
      total: rows.reduce((sum, row) => sum + row.games, 0),
      wins: rows.reduce((sum, row) => sum + row.wins, 0),
      losses: rows.reduce((sum, row) => sum + row.losses, 0),
      ties: rows.reduce((sum, row) => sum + row.ties, 0),
    }))
    .sort((a, b) => {
      if (a.conference === ownConference && b.conference !== ownConference) return -1;
      if (b.conference === ownConference && a.conference !== ownConference) return 1;
      if (a.conference === historicalConference && b.conference !== historicalConference) return 1;
      if (b.conference === historicalConference && a.conference !== historicalConference) return -1;
      return a.conference.localeCompare(b.conference);
    })
    .map((group) => `<details class="conference-group"><summary>${esc(group.conference)}<span>${fmtNum(group.rows.length)} opponents · ${fmtNum(group.total)} games · ${fmtRecord(group.wins, group.losses, group.ties)}</span></summary><div class="table-wrap"><table><thead><tr><th>Opponent</th><th>Record</th><th>Games</th><th>Win %</th></tr></thead><tbody>${group.rows.map((row) => {
      const name = `<button type="button" class="series-link" onclick="goMatch('${key}','${row.key}')" aria-label="Open complete series against ${esc(row.name)}">${esc(row.name)}</button>`;
      const percentage = fmtWinPct(row.wins, row.losses, row.ties);
      return `<tr><td>${name}</td><td>${fmtRecord(row.wins, row.losses, row.ties)}</td><td>${fmtNum(row.games)}</td><td>${percentage}</td></tr>`;
    }).join("")}</tbody></table></div></details>`)
    .join("");
}

<option value="">All seasons</option>${seasonOptions}</select></div><div class="filter-field opponent-field"><label for="oppFilter">Opponent</label><div class="opponent-combobox"><div class="opponent-input-wrap"><div id="opponentChips" class="filter-chips"></div><input id="oppFilter" placeholder="Type to match or select teams…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="oppSuggestions" aria-expanded="false" oninput="onOpponentFilterInput('${key}')" onkeydown="handleOpponentFilterKeydown(event,'${key}')"></div><div id="oppSuggestions" class="opponent-suggestions" role="listbox"></div></div></div><div class="filter-field"><label for="siteFilter">Site</label><select id="siteFilter" onchange="updateTeamGames('${key}',0,true)"><option value="all">All sites</option><option value="home">Home</option><option value="road">Road</option><option value="neutral">Neutral</option><option value="unknown">Unknown</option></select></div><div class="filter-field"><label for="typeFilter">Type</label><select id="typeFilter" onchange="updateTeamGames('${key}',0,true)"><option value="all">All Types</option><option value="REGULAR_SEASON">Regular Season</option><option value="CONFERENCE_TOURNAMENT">Conference Tournament</option><option value="NCAA_TOURNAMENT">NCAA Tournament</option><option value="NIT">NIT</option></select></div><button type="button" class="filter-clear" onclick="clearTeamFilters('${key}')">Clear filters</button></div><div id="seasonSummary" class="season-summary"></div><div id="teamGamesTable"></div></div><div class="panel opponent-breakdown"><div class="panel-title">All Time Record by Opponent</div><div class="data-note" style="padding:11px 16px;border-bottom:1px solid var(--line)">Current D1 opponents are grouped by their ${esc(formatSeason(DB.referenceSeason))} conference; historical and non-D1 opponents are grouped together. Select any opponent to open the complete series.</div>${opponentBreakdown(key)}</div>`;

function opponentSuggestions(key, state) {
  const query = state.q.toLowerCase().trim();
  if (!query) return [];
  const selected = new Set(state.selectedOpponentKeys || []);
  return (DB.opponents[key] || [])
    .filter((opponent) => !selected.has(opponent.key))
    .filter((opponent) => `${opponent.name} ${opponent.key}`.toLowerCase().includes(query))
    .sort((a, b) => b.games - a.games || a.name.localeCompare(b.name))

function renderOpponentAssist(key) {

  }).join("");
  const suggestions = opponentSuggestions(key, state);
  state.suggestionIndex = Math.max(-1, Math.min(state.suggestionIndex ?? -1, suggestions.length - 1));
  if (!state.q.trim()) {
    suggestionsBox.classList.remove("open");
    suggestionsBox.innerHTML = "";
    input.setAttribute("aria-expanded", "false");
    return;
  }
  suggestionsBox.innerHTML = suggestions.length
    ? suggestions.map((opponent, index) => `<button type="button" class="opponent-suggestion ${index === state.suggestionIndex ? "active" : ""}" role="option" aria-selected="${index === state.suggestionIndex}" onclick="selectOpponentFilter('${key}','${opponent.key}')"><span><b>${esc(opponent.name)}</b><br><small>${esc(opponent.conference)}</small></span><small>${fmtNum(opponent.games)} games</small></button>`).join("")
    : '<div class="suggestion-empty">No exact opponent suggestions. Partial matching still applies to the game list.</div>';

function onOpponentFilterInput(key) {
  const state = teamPageState[key];
  const input = document.getElementById("oppFilter");
  if (!state || !input) return;
  state.q = input.value;
  state.suggestionIndex = -1;
  updateTeamGames(key, 0, true);
}

function selectOpponentFilter(key, opponentKey) {
  const state = teamPageState[key];
  const input = document.getElementById("oppFilter");
  if (!state || !input) return;
  if (!state.selectedOpponentKeys.includes(opponentKey)) state.selectedOpponentKeys.push(opponentKey);
  state.q = "";
  state.suggestionIndex = -1;
  input.value = "";
  input.focus();
  updateTeamGames(key, 0, true);
}

function removeOpponentFilter(key, opponentKey) {
  const state = teamPageState[key];
  if (!state) return;
  state.selectedOpponentKeys = state.selectedOpponentKeys.filter((value) => value !== opponentKey);
  updateTeamGames(key, 0, true);
}

function handleOpponentFilterKeydown(event, key) {
  const state = teamPageState[key];
  if (!state) return;
  const suggestions = opponentSuggestions(key, state);
  if (event.key === "ArrowDown" && suggestions.length) {
    event.preventDefault();
    state.suggestionIndex = (state.suggestionIndex + 1) % suggestions.length;
    renderOpponentAssist(key);
  } else if (event.key === "ArrowUp" && suggestions.length) {
    event.preventDefault();
    state.suggestionIndex = (state.suggestionIndex - 1 + suggestions.length) % suggestions.length;
    renderOpponentAssist(key);
  } else if (event.key === "Enter" && state.suggestionIndex >= 0 && suggestions[state.suggestionIndex]) {
    event.preventDefault();
    selectOpponentFilter(key, suggestions[state.suggestionIndex].key);
  } else if (event.key === "Escape") {
    state.q = "";
    event.currentTarget.value = "";
    updateTeamGames(key, 0, true);
  } else if (event.key === "Backspace" && !event.currentTarget.value && state.selectedOpponentKeys.length) {
    state.selectedOpponentKeys.pop();
    updateTeamGames(key, 0, true);
  }
}

function clearTeamFilters(key) {
  const state = teamPageState[key];
  if (!state) return;
  Object.assign(state, { page: 0, q: "", selectedOpponentKeys: [], site: "all", season: "", type: "all", suggestionIndex: -1 });
  const input = document.getElementById("oppFilter");
  const site = document.getElementById("siteFilter");
  const season = document.getElementById("seasonFilter");
  const type = document.getElementById("typeFilter");
  if (input) input.value = "";
  if (site) site.value = "all";
  if (season) season.value = "";
  if (type) type.value = "all";
  updateTeamGames(key, 0, true);
}

function mobileHistoryMonth(game) {
  if (game.datePrecision !== "EXACT" || !/^\d{4}-\d{2}-\d{2}$/.test(game.date || "")) return { key: "unknown", label: "Date Unknown" };
  const parsed = new Date(`${game.date.slice(0, 7)}-01T12:00:00`);
  if (Number.isNaN(parsed.getTime())) return { key: "unknown", label: "Date Unknown" };
  return { key: game.date.slice(0, 7), label: parsed.toLocaleDateString("en-US", { year: "numeric", month: "long" }) };
}
function mobileTeamGameRows(games, teamKey) {
  let html = "";
  let currentSeason = null;
  let currentMonth = null;
  let seasonOpen = false;
  let monthOpen = false;
  for (const game of games) {
    if (game.season !== currentSeason) {
      if (monthOpen) html += "</div>";
      if (seasonOpen) html += "</section>";
      currentSeason = game.season;
      currentMonth = null;
      html += `<section class="mobile-history-season-group"><div class="mobile-history-season">${esc(formatSeason(game.season))}</div>`;
      seasonOpen = true;
      monthOpen = false;
    }
    const month = mobileHistoryMonth(game);
    if (month.key !== currentMonth) {

      currentMonth = month.key;
      html += `<div class="mobile-history-month-group"><div class="mobile-history-month">${esc(month.label)}</div>`;
      monthOpen = true;
    }
    html += mobileTeamGameRow(game, teamKey);
  }
  if (monthOpen) html += "</div>";
  if (seasonOpen) html += "</section>";
  return html;
}
function updateTeamGames(key, delta = 0, reset = false) {
  const state = teamPageState[key] || { page: 0, q: "", selectedOpponentKeys: [], site: "all", season: "", type: "all", suggestionIndex: -1 };
  const opponentFilter = document.getElementById("oppFilter");
  if (opponentFilter) {
    state.q = opponentFilter.value;
    state.site = document.getElementById("siteFilter").value;
    state.season = document.getElementById("seasonFilter").value;
    state.type = document.getElementById("typeFilter").value;
  }
  state.page = reset ? 0 : Math.max(0, (state.page || 0) + delta);
  teamPageState[key] = state;

  let games = [...DB.games[key]].sort((a, b) => gameSortValue(b).localeCompare(gameSortValue(a)));
  const selectedOpponents = new Set(state.selectedOpponentKeys || []);
  const partialQuery = state.q.toLowerCase().trim();
  games = games.filter((game) => {
    if (selectedOpponents.size || partialQuery) {
      const exactSelected = selectedOpponents.has(game.opponentKey);
      const partialMatch = partialQuery && `${game.opponent} ${game.opponentKey}`.toLowerCase().includes(partialQuery);
      if (!exactSelected && !partialMatch) return false;
    }
    if (state.season && game.season !== state.season) return false;
    if (state.type !== "all" && game.gameType !== state.type) return false;
    const short = siteShort(game.site);
    if (state.site === "home" && short !== "H") return false;
    if (state.site === "road" && short !== "A") return false;
    if (state.site === "neutral" && short !== "N") return false;
    if (state.site === "unknown" && short !== "?") return false;
    return true;
  });

  const maxPage = Math.max(0, Math.ceil(games.length / PAGE_SIZE) - 1);
  state.page = Math.min(state.page, maxPage);
  const record = { W: 0, L: 0, T: 0 };
  for (const game of games) if (record[game.result] != null) record[game.result] += 1;

  const selectedNames = (state.selectedOpponentKeys || []).map((opponentKey) => opponentProfile(key, opponentKey).name);
  const opponentSummary = selectedNames.length ? `<b>${esc(selectedNames.join(" or "))}</b> · ` : partialQuery ? `<b>Matching “${esc(state.q.trim())}”</b> · ` : "";
  document.getElementById("seasonSummary").innerHTML = `${state.season ? `<b>${esc(formatSeason(state.season))}</b> · ` : ""}${opponentSummary}${fmtRecord(record.W, record.L, record.T)} · ${fmtNum(games.length)} games shown`;
  const slice = games.slice(state.page * PAGE_SIZE, (state.page + 1) * PAGE_SIZE);
  const rows = slice.map((game) => {
    const opponent = `<button type="button" class="opp-link" onclick="goMatch('${key}','${game.opponentKey}')" aria-label="Open complete ${esc(DB.teams[key].name)} versus ${esc(game.opponent)} series">${esc(game.opponent)}</button>`;
    return `<tr><td>${esc(formatGameDate(game))}</td><td>${opponent}</td><td class="result ${esc(game.result)}">${esc(game.result)}</td><td>${esc(scoreText(game))}</td><td>${esc(siteShort(game.site))}</td><td>${esc(game.venue)}</td><td>${esc(game.location || "—")}</td><td>${esc(gameTypeLabel(game, key))}</td><td>${administrativeChip(game)}</td></tr>`;
  }).join("");
  const mobileRows = mobileTeamGameRows(slice, key);
  document.getElementById("teamGamesTable").innerHTML = `<div class="desktop-history"><div class="table-wrap"><table class="history-table"><thead><tr><th>Date</th><th>Opponent</th><th>Result</th><th>Score</th><th>Site</th><th>Venue</th><th>Location</th><th>Type</th><th>Administrative</th></tr></thead><tbody>${rows || '<tr><td colspan="9" class="empty">No games match these filters.</td></tr>'}</tbody></table></div></div><div class="mobile-history">${mobileRows || '<div class="empty">No games match these filters.</div>'}</div><div class="pager"><span>${fmtNum(games.length)} games · page ${fmtNum(state.page + 1)} of ${fmtNum(maxPage + 1)}</span><span><button type="button" onclick="updateTeamGames('${key}',-1)" ${state.page === 0 ? "disabled" : ""}>Previous</button> <button type="button" onclick="updateTeamGames('${key}',1)" ${state.page >= maxPage ? "disabled" : ""}>Next</button></span></div>`;
  renderOpponentAssist(key);
  const activeFilterCount = (state.selectedOpponentKeys || []).length + (partialQuery ? 1 : 0) + (state.site !== "all" ? 1 : 0) + (state.season ? 1 : 0) + (state.type !== "all" ? 1 : 0);
  const toggleStatus = document.getElementById("filterToggleStatus");
  if (toggleStatus) toggleStatus.textContent = activeFilterCount ? `${activeFilterCount} active` : "All games";
}

function streakText(games, teamA, teamB) {
  if (!games.length) return "—";
  const newest = [...games].sort((a, b) => gameSortValue(b).localeCompare(gameSortValue(a)));
  const first = canonicalWinnerKey(newest[0], teamA, teamB);
  if (!first || first === "tie") return first === "tie" ? "Tie" : "—";
  let length = 0;
  for (const game of newest) {
    if (canonicalWinnerKey(game, teamA, teamB) === first) length += 1;
    else break;
  }
  const winner = first === teamA ? DB.teams[teamA] : opponentProfile(teamA, teamB);
  return `${winner.name} ${fmtNum(length)}`;
}

function longestStreak(games, teamA, teamB) {
  let best = { key: null, length: 0 };
  let current = { key: null, length: 0 };
  for (const game of [...games].sort((a, b) => gameSortValue(a).localeCompare(gameSortValue(b)))) {
    const winner = canonicalWinnerKey(game, teamA, teamB);
    if (!winner || winner === "tie") {
      current = { key: null, length: 0 };
      continue;
    }
    current = current.key === winner
      ? { key: winner, length: current.length + 1 }
      : { key: winner, length: 1 };
    if (current.length > best.length) best = { ...current };
  }
  if (!best.key) return "—";
  const winner = best.key === teamA ? DB.teams[teamA] : opponentProfile(teamA, teamB);
  return `${winner.name} ${fmtNum(best.length)}`;
}

function bucket(games, teamA, teamB, labelFunction) {
  const map = {};
  for (const game of games) {
    const label = labelFunction(game) || "Unknown";
    if (!map[label]) map[label] = { label, wins: 0, losses: 0, ties: 0, games: 0 };
    map[label].games += 1;
    const winner = canonicalWinnerKey(game, teamA, teamB);
    if (winner === teamA) map[label].wins += 1;
    else if (winner === teamB) map[label].losses += 1;
    else if (winner === "tie") map[label].ties += 1;
  }
  return Object.values(map);
}

function matchupView(teamA, teamB) {
  const teamAProgram = DB.teams[teamA];
  const teamBProgram = opponentProfile(teamA, teamB);
  const games = seriesGamesFor(teamA, teamB);
  if (!teamAProgram || !games.length) return '<div class="empty">Series not available.</div>';
  const scoredGames = games.filter((game) => game.scoreKnown && game.scores[teamA] != null && game.scores[teamB] != null);
  let teamAWins = 0;
  let teamBWins = 0;
  let ties = 0;
  let teamAPoints = 0;
  let teamBPoints = 0;

  for (const game of games) {
    const winner = canonicalWinnerKey(game, teamA, teamB);
    if (winner === teamA) teamAWins += 1;
    else if (winner === teamB) teamBWins += 1;
    else if (winner === "tie") ties += 1;
  }
  for (const game of scoredGames) {
    teamAPoints += game.scores[teamA];
    teamBPoints += game.scores[teamB];
  }

  const margins = scoredGames.map((game) => ({
    game,
    margin: Math.abs(game.scores[teamA] - game.scores[teamB]),
    total: game.scores[teamA] + game.scores[teamB],
  }));
  const largest = [...margins].sort((a, b) => b.margin - a.margin)[0];
  const closest = [...margins].sort((a, b) => a.margin - b.margin)[0];
  const highest = [...margins].sort((a, b) => b.total - a.total)[0];
  const administrativeCount = games.filter((game) => game.administrativeStatus).length;
  const sites = bucket(games, teamA, teamB, (game) => game.site).sort((a, b) => b.games - a.games);
  const decades = bucket(games, teamA, teamB, (game) => {
    const year = Number((game.date || game.season || "").slice(0, 4));
    return year ? `${Math.floor(year / 10) * 10}s` : "";
  }).sort((a, b) => b.label.localeCompare(a.label)).slice(0, 8);
  const venues = bucket(games, teamA, teamB, (game) => game.venue || game.location || "Venue not resolved")
    .sort((a, b) => b.games - a.games)
    .slice(0, 8);

  const rows = [...games]
    .sort((a, b) => gameSortValue(b).localeCompare(gameSortValue(a)))
    .map((game) => {
      const scoreA = game.scoreKnown && game.scores[teamA] != null ? game.scores[teamA] : "—";
      const scoreB = game.scoreKnown && game.scores[teamB] != null ? game.scores[teamB] : "—";
      const winner = canonicalWinnerKey(game, teamA, teamB);
      return `<tr><td>${esc(formatGameDate(game))}</td><td>${seriesScoreMarkup(scoreA, teamAProgram, winner, teamA)}</td><td>${seriesScoreMarkup(scoreB, teamBProgram, winner, teamB)}</td><td>${esc(game.site || "Unknown")}</td><td>${esc(game.venue || "—")}</td><td>${esc(game.location || "—")}</td><td>${esc(gameTypeLabel(game, teamA))}</td><td>${administrativeChip(game)}</td></tr>`;
    }).join("");
  const mobileRows = [...games]
    .sort((a, b) => gameSortValue(b).localeCompare(gameSortValue(a)))
    .map((game) => {
      const scoreA = game.scoreKnown && game.scores[teamA] != null ? game.scores[teamA] : "—";
      const scoreB = game.scoreKnown && game.scores[teamB] != null ? game.scores[teamB] : "—";
      const outcome = game.results?.[teamA] || "—";
      const winner = canonicalWinnerKey(game, teamA, teamB);
      const scoreAMarkup = seriesScoreMarkup(scoreA, teamAProgram, winner, teamA);
      const scoreBMarkup = seriesScoreMarkup(scoreB, teamBProgram, winner, teamB);
      return `<details class="mobile-game-row"><summary><div class="mobile-game-line"><span class="mobile-game-date">${esc(compactGameDate(game))}</span><span class="mobile-game-outcome series-mobile-outcome"><span class="result ${esc(outcome)}">${esc(outcome)}</span><span aria-hidden="true">·</span><span class="series-score-pair">${scoreAMarkup}<span aria-hidden="true">–</span>${scoreBMarkup}</span></span></div><div class="mobile-game-line"><span class="mobile-game-meta">${esc(game.site || "Unknown")} · ${esc(gameTypeLabel(game, teamA))}</span><span class="mobile-game-cue">Details</span></div></summary>${mobileGameDetails(game, teamA)}</details>`;
    }).join("");

  return `<button type="button" class="back" onclick="goTeam('${teamA}')">← ${esc(teamAProgram.name)} history</button><div class="match-head"><div class="side-team">${teamLogo(teamAProgram)}<div><h2>${matchupTeamName(teamAProgram)}</h2><div class="kicker" style="color:${teamAProgram.primary}">${esc(teamAProgram.conference)}</div></div></div><div class="vs">VS.</div><div class="side-team right">${teamLogo(teamBProgram)}<div><h2>${matchupTeamName(teamBProgram)}</h2><div class="kicker" style="color:${teamBProgram.primary}">${esc(teamBProgram.conference)}</div></div></div></div><div class="series-score">${fmtRecord(teamAWins, teamBWins, ties)}</div><div class="series-caption">${esc(teamAProgram.name)} record vs. ${esc(teamBProgram.name)} · ${fmtNum(games.length)} meetings${scoredGames.length !== games.length ? ` · ${fmtNum(scoredGames.length)} with known scores` : ""}</div>${administrativeCount ? `<div class="notice">${fmtNum(administrativeCount)} game${administrativeCount === 1 ? "" : "s"} carries administrative metadata. Records shown use on-court results.</div>` : ""}<div class="match-metrics"><div class="metric"><b>${streakText(games, teamA, teamB)}</b><span>Current Streak</span></div><div class="metric"><b>${longestStreak(games, teamA, teamB)}</b><span>Longest Streak</span></div><div class="metric"><b>${largest ? fmtNum(largest.margin) : "—"}</b><span>Largest Margin · ${largest ? formatGameDate(largest.game) : ""}</span></div><div class="metric"><b>${closest ? fmtNum(closest.margin) : "—"}</b><span>Closest Margin · ${closest ? formatGameDate(closest.game) : ""}</span></div><div class="metric"><b>${highest ? fmtNum(highest.total) : "—"}</b><span>Highest Combined Score</span></div><div class="metric"><b>${scoredGames.length ? (teamAPoints / scoredGames.length).toFixed(1) : "—"}</b><span>${esc(teamAProgram.name)} Avg. Points</span></div><div class="metric"><b>${scoredGames.length ? (teamBPoints / scoredGames.length).toFixed(1) : "—"}</b><span>${esc(teamBProgram.name)} Avg. Points</span></div><div class="metric"><b>${fmtNum(teamAPoints)}–${fmtNum(teamBPoints)}</b><span>Total Known Points</span></div></div><div class="subgrid">${miniPanel("Record by Site", sites, teamA)}${miniPanel("Record by Decade", decades, teamA)}${miniPanel("Most-Used Venues", venues, teamA)}</div><div class="panel history-panel" style="margin-top:14px"><div class="panel-title">Complete Series History</div><div class="desktop-history"><div class="table-wrap"><table class="matchup-history-table"><thead><tr><th>Date</th><th>${esc(teamAProgram.name)}</th><th>${esc(teamBProgram.name)}</th><th>Site</th><th>Venue</th><th>Location</th><th>Type</th><th>Administrative</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="mobile-history">${mobileRows}</div></div>`;
}

function aboutView() {
  const names = DB.activeKeys.map((key) => DB.teams[key].name).join(", ");
  return `<section class="hero"><div class="kicker">How the history is built</div><h1>One Game, Many Pieces of Evidence</h1><p>The site loads canonical games from generated program files. Source rows, corrections, and disagreements remain evidence behind each canonical game rather than becoming duplicate games.</p></section><div class="panel" style="padding:20px"><div class="data-note"><b>Complete histories available:</b> ${esc(names)}.</div><div class="data-note"><b>Records:</b> on-court outcomes by default; administrative adjustments remain separately labeled.</div><div class="data-note"><b>Opponent grouping:</b> current D1 teams use their ${esc(formatSeason(DB.referenceSeason))} conference; everyone else is Non-D1 / Historical.</div><div class="data-note"><b>Expansion model:</b> enabling another public program in generated data adds its colored directory card, team history, filters, and opponent series without school-specific interface code.</div></div>`;
}

function render() {
  const route = (location.hash || "#home").slice(1).split("/");
  const app = document.getElementById("app");
  if (route[0] === "team" && ACTIVE.has(route[1])) {
    app.innerHTML = teamView(route[1]);
    setTimeout(() => updateTeamGames(route[1]), 0);
  } else if (route[0] === "matchup" && ACTIVE.has(route[1]) && seriesGamesFor(route[1], route[2]).length) {
    app.innerHTML = matchupView(route[1], route[2]);
  } else if (route[0] === "about") {
    app.innerHTML = aboutView();
  } else {
    app.innerHTML = homeView();
  }
  window.scrollTo(0, 0);
}

function openProgramFromSearch(key, inputId, resultsId, mobile = false) {
  const input = document.getElementById(inputId);
  const results = document.getElementById(resultsId);
  if (input) {
    input.value = "";
    input.setAttribute("aria-expanded", "false");
  }
  if (results) results.style.display = "none";
  if (mobile) toggleMobileSearch(false, false);
  goTeam(key);
}

function renderProgramSearch(input, results, mobile) {
  const query = input.value.toLowerCase().trim();
  if (!query) {
    results.style.display = "none";
    results.innerHTML = "";
    input.setAttribute("aria-expanded", "false");
    return;
  }
  const hits = DB.programs
    .filter((program) => `${program.name} ${program.display} ${program.nickname} ${program.conference} ${program.location}`.toLowerCase().includes(query))
    .slice(0, 12);
  results.innerHTML = hits.length
    ? hits.map((program) => `<button type="button" class="search-result ${program.enabled ? "enabled" : "disabled"}" style="--searchColor:${program.primary}" ${program.enabled ? `onclick="openProgramFromSearch('${program.key}','${input.id}','${results.id}',${mobile})"` : "disabled"}><span><b>${esc(program.name)}</b><br><small>${esc(program.nickname)} · ${esc(program.conference)}</small></span><span>${program.enabled ? "Open" : "Coming later"}</span></button>`).join("")
    : '<div class="suggestion-empty">No current Division I programs match that search.</div>';
  results.style.display = "block";
  input.setAttribute("aria-expanded", "true");
}

function bindSearchPair(inputId, resultsId, mobile = false) {
  const input = document.getElementById(inputId);
  const results = document.getElementById(resultsId);
  if (!input || !results) return;
  input.addEventListener("input", () => renderProgramSearch(input, results, mobile));
  input.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      if (mobile) toggleMobileSearch(false);
      else {
        input.value = "";
        renderProgramSearch(input, results, mobile);
      }
    }
  });
}

function toggleMobileSearch(open, restoreFocus = true) {
  const overlay = document.getElementById("mobileSearchOverlay");
  const input = document.getElementById("mobileSearch");
  const results = document.getElementById("mobileSearchResults");
  if (!overlay || !input || !results) return;
  if (open) {
    mobileSearchReturnFocus = document.activeElement;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.classList.add("search-open");
    setTimeout(() => input.focus(), 0);
  } else {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.classList.remove("search-open");
    input.value = "";
    results.innerHTML = "";
    results.style.display = "none";
    input.setAttribute("aria-expanded", "false");
    if (restoreFocus && mobileSearchReturnFocus?.focus) mobileSearchReturnFocus.focus();
  }
}

function bindSearch() {
  bindSearchPair("globalSearch", "searchResults", false);
  bindSearchPair("mobileSearch", "mobileSearchResults", true);
  document.addEventListener("click", (event) => {
    const desktopResults = document.getElementById("searchResults");
    if (desktopResults && !event.target.closest(".searchbox")) {
      desktopResults.style.display = "none";
      document.getElementById("globalSearch")?.setAttribute("aria-expanded", "false");
    }
    if (!event.target.closest(".opponent-combobox")) {
      document.getElementById("oppSuggestions")?.classList.remove("open");
      document.getElementById("oppFilter")?.setAttribute("aria-expanded", "false");
    }
  });
}

async function boot() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="empty"><b>Loading college basketball history…</b></div>';
  try {
    await loadData();
    updateChrome();
    bindSearch();
    window.addEventListener("hashchange", render);
    render();
  } catch (error) {
    console.error(error);
    app.innerHTML = `<div class="notice"><b>The site data could not be loaded.</b><br>${esc(error.message)}<br><br>Open this page through the local web server, not as a file from disk.</div>`;
  }
}

boot();
</script></body></html>
